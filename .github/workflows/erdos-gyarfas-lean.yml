name: Erdős–Gyárfás Lean smoke test

on:
  push:
    branches: ['ci/erdos-gyarfas-lean-20260816']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0 and build formal package
        shell: bash
        working-directory: eg_lean_test
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          source "$HOME/.elan/env"
          lean --version
          lake --version
          lake update
          lake build
      - name: Reject proof placeholders
        shell: bash
        working-directory: eg_lean_test
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.lean' -E '\bsorry\b|admit|axiom' formal; then
            echo 'Formal sources contain a prohibited placeholder or axiom.' >&2
            exit 1
          fi
