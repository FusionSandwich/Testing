name: Materialize Prompt 3 payload

on:
  push:
    branches:
      - agent/afp-pure-math-p3-global-rigidity-near-rigidity
    paths:
      - '.p3_payload/**'
      - '.github/workflows/p3-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat .p3_payload/part_* > /tmp/payload.b64
          test "$(sha256sum /tmp/payload.b64 | awk '{print $1}')" = "0ca981dbc03df831481459727b9305ebd6b23bc0370b9f2da525b392e529fe2c"
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          test "$(sha256sum /tmp/payload.tar.gz | awk '{print $1}')" = "7c415f7808538ab37ec9b69c39f59ee73879d7c5ed290e91ff5d6d3892cb5040"
          tar -xzf /tmp/payload.tar.gz
          rm -rf .p3_payload
          python -m compileall -q afp_barrier_gate1/pure_math
          git diff --check

      - name: Commit materialized theorem package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Prompt 3 theorem package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
