name: AFP publication P2C quadrature-generator co-design

on:
  push:
    branches:
      - agent/afp-publication-p2c-codesign-9b39b6ad-v2
      - archive/afp-publication-p2c-codesign-verified
  pull_request:
    branches:
      - archive/afp-publication-p2b-harmonic-transport-verified
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  EXPECTED_REPOSITORY: FusionSandwich/Testing
  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P2C_BRANCH: agent/afp-publication-p2c-codesign-9b39b6ad-v2
  P2C_ARCHIVE: archive/afp-publication-p2c-codesign-verified
  P2B_COMMIT: 9b39b6ad52213197c0af75d4988eccd1a29d66a9
  P2B_TREE: 36514ca5824da3550a800e9ce9289cdff36581e9
  P2B_ARCHIVE: archive/afp-publication-p2b-harmonic-transport-verified
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  exact-codesign-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact head, lineage, scope, and refs
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"; mkdir -p "${out}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            test "${GITHUB_HEAD_REF}" = "${P2C_BRANCH}"
            test "${GITHUB_BASE_REF}" = "${P2B_ARCHIVE}"
            test "${PR_HEAD_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P2B_COMMIT}^{tree}")" = "${P2B_TREE}"
          git merge-base --is-ancestor "${P2B_COMMIT}" "${CANDIDATE_SHA}"
          test "$(git rev-list --count --merges "${P2B_COMMIT}..${CANDIDATE_SHA}")" -eq 0
          python - "${P2B_COMMIT}" "${CANDIDATE_SHA}" <<'PY' | tee "${out}/scope.log"
          import os, subprocess, sys

          base, head = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-publication-p2c-codesign.yml",
              "afp_barrier_gate1/pure_math/codesign/__init__.py",
              "afp_barrier_gate1/pure_math/codesign/adaptive.py",
              "afp_barrier_gate1/pure_math/codesign/audit.py",
              "afp_barrier_gate1/pure_math/codesign/convergence.py",
              "afp_barrier_gate1/pure_math/codesign/exact_audit.py",
              "afp_barrier_gate1/pure_math/codesign/families.py",
              "afp_barrier_gate1/pure_math/codesign/feasibility.py",
              "afp_barrier_gate1/pure_math/codesign/fixtures.py",
              "afp_barrier_gate1/pure_math/codesign/graph_updates.py",
              "afp_barrier_gate1/pure_math/codesign/inner.py",
              "afp_barrier_gate1/pure_math/codesign/metrics.py",
              "afp_barrier_gate1/pure_math/codesign/outer.py",
              "afp_barrier_gate1/pure_math/codesign/rotations.py",
              "afp_barrier_gate1/pure_math/codesign/types.py",
              "afp_barrier_gate1/pure_math/tests/test_p2c_codesign.py",
              "docs/publication_program/P2C_APPROACH_REGISTRY.md",
              "docs/publication_program/P2C_CLAIM_MAP.md",
              "docs/publication_program/P2C_CLAUSE_MATRIX.md",
              "docs/publication_program/P2C_PRIOR_ART_AND_HOSTILE_AUDIT.md",
              "docs/publication_program/P2C_QUADRATURE_GENERATOR_CODESIGN.md",
              "docs/publication_program/P2C_STAGE_REPORT.md",
          }
          raw = subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-only", "-z", base, head]
          )
          changed = {os.fsdecode(item) for item in raw.split(b"\0") if item}
          if changed != allowed:
              raise SystemExit(
                  f"P2C scope mismatch; missing={sorted(allowed-changed)} "
                  f"outside={sorted(changed-allowed)}"
              )
          forbidden = (set(range(32)) - {9, 10, 13}) | {127}
          for path in sorted(changed):
              row = subprocess.check_output(
                  ["git", "ls-tree", head, "--", path], text=True
              ).strip()
              if not row.startswith("100644 blob "):
                  raise SystemExit(f"not a regular blob: {path}: {row!r}")
              payload = subprocess.check_output(["git", "show", f"{head}:{path}"])
              if not payload:
                  raise SystemExit(f"empty P2C path: {path}")
              payload.decode("utf-8")
              bad = sorted({byte for byte in payload if byte in forbidden})
              if bad:
                  raise SystemExit(f"forbidden control bytes in {path}: {bad}")
          print(f"P2C allowlist and UTF-8/control-byte audit: EXACT ({len(changed)} paths)")
          PY
          git diff --check "${P2B_COMMIT}" "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_BRANCH}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P2B_ARCHIVE}" | awk 'NR==1 {print $1}')" = "${P2B_COMMIT}"
          set +e
          line=$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_ARCHIVE}"); status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            archive_sha="$(awk 'NR==1 {print $1}' <<<"${line}")"
            if [[ "${GITHUB_REF}" = "refs/heads/${P2C_ARCHIVE}" ]]; then
              test "${archive_sha}" = "${CANDIDATE_SHA}"
            else
              git merge-base --is-ancestor "${archive_sha}" "${CANDIDATE_SHA}"
            fi
          elif [[ ${status} -ne 2 || "${GITHUB_REF}" = "refs/heads/${P2C_ARCHIVE}" ]]; then
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep | tee "${out}/apt.log"
          python -m pip install --disable-pip-version-check --no-input \
            'clarabel==0.11.1' 'cvxpy==1.7.3' 'numpy==2.3.2' \
            'osqp==1.0.4' 'pytest==8.4.2' 'scipy==1.18.0' \
            'scs==3.2.9' 'sympy==1.14.0' | tee "${out}/dependencies.log"
          python -m pip freeze --all | sort > "${out}/pip-freeze.txt"

      - name: Run P2C exact audit, benchmark, and hostile tests
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p2c-pycache"
          python -m compileall -q pure_math/codesign pure_math/tests/test_p2c_codesign.py
          python -m pure_math.codesign.exact_audit | tee "${out}/exact-audit.log"
          python -m pure_math.codesign.audit --quick | tee "${out}/codesign-audit.log"
          python -m pytest -p no:cacheprovider -q -ra \
            pure_math/tests/test_p2c_codesign.py | tee "${out}/pytest.log"
          grep -Fxq 'P2C_EXACT_AUDIT_PASS' "${out}/exact-audit.log"
          grep -Fxq 'P2C_CODESIGN_AUDIT_PASS' "${out}/codesign-audit.log"
          grep -Fq '"optimized_inner": true' "${out}/codesign-audit.log"
          grep -Fq '"verification": "VERIFIED_FLOAT_FINITE_REGRESSION+EMPIRICAL_ROTATION_SAMPLE"' "${out}/codesign-audit.log"
          grep -Eq '^[0-9]+ passed(, [0-9]+ [a-z]+)* in ' "${out}/pytest.log"

      - name: Run retained P1E, P2A, and P2B regressions
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p2c-pycache"
          python -m pure_math.optimization.exact_audit | tee "${out}/p2a.log"
          python -m pure_math.dynamics.exact_audit | tee "${out}/p2b.log"
          python pure_math/covariance/p1b_sharp_quadratic_defect_audit.py | tee "${out}/p1b.log"
          python pure_math/covariance/p1e_short_gap_family_audit.py | tee "${out}/p1e.log"
          grep -Fxq 'P2A exact symmetric/Farkas audit: PASS' "${out}/p2a.log"
          grep -Fxq 'P2B exact manufactured audit: PASS' "${out}/p2b.log"
          grep -Fxq 'P1B sharp quadratic-defect audit: PASS' "${out}/p1b.log"
          grep -Fxq 'hostile transition and q/h-guard mutations: deterministic failure PASS' "${out}/p1e.log"

      - name: Audit documents, claims, and placeholders
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"
          main=docs/publication_program/P2C_QUADRATURE_GENERATOR_CODESIGN.md
          test "$(head -n 1 "${main}")" = '# P2C — Controlled quadrature–generator co-design'
          for heading in \
            '## 2. Exact inner problem' \
            '## 3. Common family definitions and admission gates' \
            '## 5. Strategy I — finite group orbits' \
            '## 6. Strategy II — Riemannian nodes with exact inner SDP' \
            '## 7. Strategy III — alternating weight, node, and conductance updates' \
            '## 8. Strategy IV — certified graph updates' \
            '## 9. Strategy V — direct spherical-design construction' \
            '## 10. Strategy VI — adaptive response refinement' \
            '## 11. All-orders co-designed convergence family' \
            '## 12. Rotation claims and tests'; do
            rg -Fxq "${heading}" "${main}"
          done
          python - <<'PY' | tee "${out}/documents.log"
          import pathlib, re

          root = pathlib.Path("docs/publication_program")
          paths = sorted(root.glob("P2C*.md"))
          required = {
              "P2C_APPROACH_REGISTRY.md", "P2C_CLAIM_MAP.md",
              "P2C_CLAUSE_MATRIX.md", "P2C_PRIOR_ART_AND_HOSTILE_AUDIT.md",
              "P2C_QUADRATURE_GENERATOR_CODESIGN.md", "P2C_STAGE_REPORT.md",
          }
          if {p.name for p in paths} != required:
              raise SystemExit("P2C document inventory mismatch")
          claims = (root / "P2C_CLAIM_MAP.md").read_text(encoding="utf-8")
          keys = re.findall(r"^\|\s*(C[0-9]{2})\s*\|", claims, re.M)
          if keys != [f"C{i:02d}" for i in range(1, 27)]:
              raise SystemExit(f"claim key mismatch: {keys}")
          registry = (root / "P2C_APPROACH_REGISTRY.md").read_text(encoding="utf-8")
          for status in ("PROVED", "COMPUTATIONAL", "BLOCKED", "REJECTED"):
              if status not in registry:
                  raise SystemExit(f"missing approach status {status}")
          placeholders = re.compile(
              r"(?im)(?:^|\s)(?:TODO|TBD|FIXME|XXX):|STATUS_PENDING|"
              r"MISSING[ _-]PROOF|INSERT[ _-]CITATION|NotImplementedError"
          )
          scan = paths + sorted(pathlib.Path(
              "afp_barrier_gate1/pure_math/codesign"
          ).glob("*.py")) + [pathlib.Path(
              "afp_barrier_gate1/pure_math/tests/test_p2c_codesign.py"
          )]
          for path in scan:
              match = placeholders.search(path.read_text(encoding="utf-8"))
              if match:
                  raise SystemExit(f"placeholder in {path}: {match.group(0)!r}")
          print("P2C claim inventory and placeholder audit: EXACT")
          PY
          git diff --check
          test -z "$(git status --short)"

      - name: Hash and upload exact records
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2c-exact"
          name="afp-publication-p2c-source-${CANDIDATE_SHA}.tar.gz"
          git archive --format=tar.gz --output="${out}/${name}" "${CANDIDATE_SHA}"
          sha256sum "${out}/${name}" > "${out}/${name}.sha256"
          printf 'commit=%s\ntree=%s\nbase=%s\nrun=%s\nattempt=%s\n' \
            "${CANDIDATE_SHA}" "$(git rev-parse HEAD^{tree})" "${P2B_COMMIT}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" > "${out}/report.txt"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afp-publication-p2c-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2c-exact
          if-no-files-found: error

  retained-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build inherited formal kernel and audit axioms
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P2B_COMMIT}^{tree}")" = "${P2B_TREE}"
          lake update
          lake exe cache get
          lake build
          lake env lean AFPBarrier/PureMathAxiomAudit.lean
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
          ! rg --glob '*.lean' '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' AFPBarrier AFPBarrier.lean
          ! rg --glob '*.lean' '^[[:space:]]*(@\[[^]]*\][[:space:]]*)*((private|protected|noncomputable|unsafe|scoped|local)[[:space:]]+)*(axiom|axioms)([[:space:]]|$)' AFPBarrier AFPBarrier.lean
          git diff --check
          test -z "$(git status --short)"

  final-candidate-integrity:
    needs: [exact-codesign-and-regressions, retained-lean-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Resolve exact candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.exact-codesign-and-regressions.result }}" = success
          test "${{ needs.retained-lean-kernel.result }}" = success
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_BRANCH}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P2B_COMMIT}" "${CANDIDATE_SHA}"
          git diff --check "${P2B_COMMIT}" "${CANDIDATE_SHA}"
          test -z "$(git status --short)"

  freeze-forward-only-archive:
    needs: [exact-codesign-and-regressions, retained-lean-kernel, final-candidate-integrity]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/afp-publication-p2c-codesign-9b39b6ad-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: true
      - name: Fast-forward the verified P2C archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_BRANCH}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
          set +e
          line=$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_ARCHIVE}"); status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            archive_sha="$(awk 'NR==1 {print $1}' <<<"${line}")"
            git merge-base --is-ancestor "${archive_sha}" "${CANDIDATE_SHA}"
            if [[ "${archive_sha}" != "${CANDIDATE_SHA}" ]]; then
              git push origin "${CANDIDATE_SHA}:refs/heads/${P2C_ARCHIVE}"
            fi
          elif [[ ${status} -eq 2 ]]; then
            git push --force-with-lease="refs/heads/${P2C_ARCHIVE}:" origin \
              "${CANDIDATE_SHA}:refs/heads/${P2C_ARCHIVE}"
          else
            exit 1
          fi
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P2C_ARCHIVE}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
