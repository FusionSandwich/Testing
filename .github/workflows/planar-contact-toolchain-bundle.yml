name: Planar contact local compiler bundle

on:
  pull_request:
    branches: [testing]
    paths:
      - '.github/workflows/planar-contact-toolchain-bundle.yml'
      - 'planar_contact_ci/lean-toolchain'
      - 'planar_contact_ci/lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat planar_contact_ci/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve and cache mathlib
        working-directory: planar_contact_ci
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build PlanarContact.Definitions
      - name: Pack compiler and dependency tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiler-bundle/toolchains compiler-bundle/project
          cp -a "$HOME/.elan/toolchains/leanprover--lean4---v4.33.0" compiler-bundle/toolchains/
          cp -a planar_contact_ci/.lake compiler-bundle/project/
          cp planar_contact_ci/lean-toolchain planar_contact_ci/lakefile.lean \
            planar_contact_ci/lake-manifest.json compiler-bundle/project/
          tar -I 'zstd -3 -T0' -cf lean433-mathlib433-bundle.tar.zst compiler-bundle
          du -h lean433-mathlib433-bundle.tar.zst
      - name: Upload compiler bundle
        uses: actions/upload-artifact@v4
        with:
          name: lean433-mathlib433-bundle
          path: lean433-mathlib433-bundle.tar.zst
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
