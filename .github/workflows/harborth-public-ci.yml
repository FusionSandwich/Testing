name: Harborth public Lean CI

on:
  pull_request:
    branches:
      - ci/harborth-lean-base-20260824
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harborth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Install Lean and build package
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain leanprover/lean4:v4.32.2
          source "$HOME/.elan/env"
          cd harborth_ci
          lake update
          lake exe cache get
          lake build
