name: AFP Prompt 2+3 exact-candidate closeout

on:
  push:
    branches:
      - agent/afp-pure-math-p2-p3-final-closeout-c66f3229
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.sha }}
  CLOSEOUT_BRANCH: agent/afp-pure-math-p2-p3-final-closeout-c66f3229
  P2_COMMIT: 31ea6a49f006df10ca633eafd6848ad43b51ac3f
  P2_TREE: 879b88de81eeb52ebb09373c2ccb77cb7cb7642c
  P2_ARCHIVE: archive/afp-pure-math-p2-quadratic-covariance-verified-31ea6a49
  P3_MATH_COMMIT: c66f3229d0a89d97559535810c4ba09daf6e4e42
  P3_MATH_TREE: 29d5e7f8f55479513a71dd457f9bd64c11b6df0f
  TRANSPORT_ARCHIVE: archive/afp-gate6-spatial-multigroup-verified
  TRANSPORT_COMMIT: 515f1aae6c20bd85711c90b5c1c21b4905252d01

jobs:
  exact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      artifact-id: ${{ steps.upload-exact.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-exact.outputs.artifact-digest }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify immutable objects, ancestry, archives, and mutable observations
        shell: bash
        run: |
          set -euo pipefail
          record=afp_barrier_gate1/pure_math/rigidity/P3_BRANCH_PROTECTION_RECORD.md
          dir="${RUNNER_TEMP}/p3-exact"
          mkdir -p "${dir}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git cat-file -e "${P2_COMMIT}^{commit}"
          test "$(git rev-parse "${P2_COMMIT}^{tree}")" = "${P2_TREE}"
          git cat-file -e "${P3_MATH_COMMIT}^{commit}"
          test "$(git rev-parse "${P3_MATH_COMMIT}^{tree}")" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"

          query_immutable_ref() {
            local ref=$1 expected=$2 output actual
            if ! output=$(git ls-remote --exit-code --heads origin \
                "refs/heads/${ref}"); then
              echo "Required immutable ref is missing or unreadable: ${ref}" >&2
              return 1
            fi
            actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
            if [[ "${actual}" != "${expected}" ]]; then
              echo "Immutable ref mismatch: ${ref} expected ${expected}, observed ${actual}" >&2
              return 1
            fi
            printf '%s %s %s EXACT\n' "${ref}" "${expected}" "${actual}"
          }
          {
            printf 'ref expected observed result\n'
            query_immutable_ref "${P2_ARCHIVE}" "${P2_COMMIT}"
            query_immutable_ref "${TRANSPORT_ARCHIVE}" "${TRANSPORT_COMMIT}"
          } | tee "${dir}/immutable-refs.log"

          old_commits=(
            65821ff1ebd47fbee1098b30c552906cd6e03b46
            6b5d7ad53d704b7ff1b96d40abbef19f6e6a2125
            d9304b5d19a1bbe69fe4ac23736308f9efe9d694
          )
          for old in "${old_commits[@]}"; do
            git cat-file -e "${old}^{commit}"
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Old Prompt 3 source commit entered candidate ancestry: ${old}" >&2
              exit 1
            fi
          done

          test -f "${record}"
          grep -Fq 'This task does not claim that no third party moved a mutable branch.' \
            "${record}"
          mutable=(
            'agent/afp-pure-math-p3-q1-rigidity 65821ff1ebd47fbee1098b30c552906cd6e03b46'
            'agent/afp-pure-math-p3-integration-record 6b5d7ad53d704b7ff1b96d40abbef19f6e6a2125'
            'agent/afp-pure-math-p3-global-rigidity-near-rigidity d9304b5d19a1bbe69fe4ac23736308f9efe9d694'
          )
          mutable_log="${dir}/mutable-reference-observations.log"
          printf 'ref initial observed classification record_rows\n' > "${mutable_log}"
          mutable_query_failed=0
          for item in "${mutable[@]}"; do
            read -r ref initial <<< "${item}"
            set +e
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            query_status=$?
            set -e
            if [[ "${query_status}" -eq 0 ]]; then
              actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
              if [[ "${actual}" == "${initial}" ]]; then
                classification=UNCHANGED_SINCE_INITIAL_OBSERVATION
              else
                classification=MOVED_EXTERNALLY
              fi
            elif [[ "${query_status}" -eq 2 ]]; then
              actual=MISSING
              classification=MISSING
              mutable_query_failed=1
            else
              actual=QUERY_ERROR
              classification=QUERY_ERROR
              mutable_query_failed=1
            fi
            needle="| \`${ref}\` | \`${initial}\` |"
            record_rows=$(awk -v needle="${needle}" \
              'index($0, needle) { count++ } END { print count + 0 }' "${record}")
            if [[ "${record_rows}" -ne 1 ]]; then
              echo "Mutable observation is not represented exactly once in ${record}: ${ref}" >&2
              mutable_query_failed=1
            fi
            printf '%s %s %s %s %s\n' \
              "${ref}" "${initial}" "${actual}" "${classification}" \
              "${record_rows}" >> "${mutable_log}"
            if [[ "${classification}" == MOVED_EXTERNALLY ]]; then
              echo "reference branch moved externally; candidate ancestry and source integrity remain valid: ${ref}" \
                >> "${mutable_log}"
            fi
          done
          cat "${mutable_log}"
          if [[ "${mutable_query_failed}" -ne 0 ]]; then
            echo 'A mutable branch required for the current observation audit was missing or unreadable, or its record row was invalid.' >&2
            exit 1
          fi

          {
            echo "candidate=${CANDIDATE_SHA}"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "prompt2_commit=${P2_COMMIT}"
            echo "prompt2_tree=${P2_TREE}"
            echo "prompt3_mathematical_commit=${P3_MATH_COMMIT}"
            echo "prompt3_mathematical_tree=${P3_MATH_TREE}"
            echo 'old_prompt3_ancestry=absent'
          } | tee "${dir}/provenance.log"

      - name: Enforce closeout allowlist and mathematical source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p3-exact"
          scope_log="${RUNNER_TEMP}/p3-exact/scope-validation.log"
          python - "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}" <<'PY' \
            2>&1 | tee "${scope_log}"
          import os
          from pathlib import PurePosixPath
          import subprocess
          import sys

          base, candidate = sys.argv[1:]
          changed_raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", base, candidate,
          ])
          changed_bytes = [item for item in changed_raw.split(b"\0") if item]
          changed = [os.fsdecode(item) for item in changed_bytes]

          allowed_paths = {
              ".github/workflows/afp-prompt3-from-p2-rigidity.yml",
              "afp_barrier_gate1/pure_math/rigidity/P3_BRANCH_PROTECTION_RECORD.md",
              "afp_barrier_gate1/docs/P2_P3_FINALIZATION_RECORD.md",
              "afp_barrier_gate1/docs/P3_STAGE_REPORT.md",
          }

          failures: list[str] = []
          for path in changed:
              if path not in allowed_paths:
                  failures.append(f"outside closeout allowlist: {path!r}")

          tree_raw = subprocess.check_output([
              "git", "ls-tree", "-r", "-z", candidate,
          ])
          tree: dict[str, tuple[str, str]] = {}
          for entry in tree_raw.split(b"\0"):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, object_type, _object_sha = metadata.decode("ascii").split()
              path = os.fsdecode(raw_path)
              tree[path] = (mode, object_type)

              parts = PurePosixPath(path).parts
              basename = parts[-1].lower() if parts else ""
              forbidden = (
                  "__pycache__" in parts
                  or basename.endswith((".pyc", ".pyo", ".b64", ".jsonl"))
                  or basename in {"plantri", "plantri.exe", "plantri.c"}
              )
              if forbidden:
                  failures.append(f"forbidden tracked generated file: {path!r}")

          for path in sorted(allowed_paths):
              entry = tree.get(path)
              if entry != ("100644", "blob"):
                  failures.append(
                      f"required closeout file missing or not a regular 100644 blob: "
                      f"{path!r} observed={entry!r}"
                  )

          for path in changed:
              if path in tree:
                  mode, object_type = tree[path]
                  if object_type != "blob" or mode not in {"100644", "100755"}:
                      failures.append(
                          f"changed path is not a regular file: {path!r} "
                          f"mode={mode} type={object_type}"
                      )

          numstat_raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--numstat", "-z", base, candidate,
          ])
          for record in numstat_raw.split(b"\0"):
              if not record:
                  continue
              fields = record.split(b"\t", 2)
              if len(fields) != 3:
                  failures.append(f"malformed numstat record: {record!r}")
                  continue
              added, deleted, raw_path = fields
              if added == b"-" or deleted == b"-":
                  failures.append(
                      f"binary change forbidden: {os.fsdecode(raw_path)!r}"
                  )

          if failures:
              print("Prompt 2+3 closeout scope/tree hygiene: FAIL", file=sys.stderr)
              for failure in failures:
                  print(f"  {failure}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Prompt 2+3 closeout scope/tree hygiene: PASS ({len(changed)} changed paths)")
          for path in changed:
              print(path)
          PY

          git diff --quiet --no-ext-diff \
            "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}" -- \
            afp_barrier_gate1/AFPBarrier.lean \
            afp_barrier_gate1/AFPBarrier \
            afp_barrier_gate1/pure_math \
            ':(exclude)afp_barrier_gate1/pure_math/rigidity/P3_BRANCH_PROTECTION_RECORD.md'
          git diff --check "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"
          {
            echo "baseline_afpbarrier_lean_blob=$(git rev-parse "${P3_MATH_COMMIT}:afp_barrier_gate1/AFPBarrier.lean")"
            echo "candidate_afpbarrier_lean_blob=$(git rev-parse "${CANDIDATE_SHA}:afp_barrier_gate1/AFPBarrier.lean")"
            echo "baseline_afpbarrier_tree=$(git rev-parse "${P3_MATH_COMMIT}:afp_barrier_gate1/AFPBarrier")"
            echo "candidate_afpbarrier_tree=$(git rev-parse "${CANDIDATE_SHA}:afp_barrier_gate1/AFPBarrier")"
            echo 'mathematical_and_executable_source=IDENTICAL'
          } | tee "${RUNNER_TEMP}/p3-exact/source-identity.log"
          echo 'Prompt 2+3 closeout path scope and mathematical source identity: PASS' \
            | tee "${RUNNER_TEMP}/p3-exact/scope.log"

      - name: Set up deterministic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p3-exact"
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' 'mpmath==1.3.0' \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/python-dependencies.log"
          {
            python --version
            python -c 'import numpy, sympy, mpmath; print("numpy", numpy.__version__); print("sympy", sympy.__version__); print("mpmath", mpmath.__version__)'
          } | tee "${RUNNER_TEMP}/p3-exact/python-toolchain.log"

      - name: Compile pure-math Python
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p3-pycache"
          python -m compileall -q pure_math \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/python-compile.log"

      - name: Run retained Prompt 1 and Prompt 2 regressions
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p3-pycache"
          python pure_math/falsification/claim_falsification_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p1-claim-falsification.log"
          python pure_math/covariance/quadratic_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p1-covariance.log"
          python pure_math/examples/exact_local_global_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p1-local-global.log"
          python pure_math/tests/test_spherical_feasibility.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p1-spherical-feasibility.log"
          python pure_math/covariance/exact_quadratic_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p2-exact-covariance.log"
          python pure_math/covariance/exact_signed_restoration_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p2-signed-restoration.log"
          python pure_math/covariance/exact_d3_invariance_counterexample.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p2-d3-invariance.log"
          python pure_math/spectral_products/exact_spectral_product_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/p2-spectral-products.log"

      - name: Run source-pinned Plantri hostile census
        shell: bash
        working-directory: afp_barrier_gate1
        env:
          P3_REQUIRE_PLANTRI: '1'
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p3-pycache"
          catalog="${RUNNER_TEMP}/p3-exact/triangulations-through-12.jsonl"
          python pure_math/rigidity/triangulation_counterexample_audit.py \
            --require-plantri --catalog "${catalog}" \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/triangulation-audit.log"
          test "$(wc -l < "${catalog}")" -eq 9150

      - name: Run Prompt 3 quantitative and covariance audits
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p3-pycache"
          python pure_math/rigidity/global_near_rigidity_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/global-near-rigidity.log"
          python pure_math/rigidity/q1_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p3-exact/q1-covariance.log"

      - name: Verify exact-regression checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo 'Exact-regression checkout remains clean.' \
            | tee "${RUNNER_TEMP}/p3-exact/checkout-clean.log"

      - name: Hash exact-regression records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p3-exact"
          mkdir -p "${dir}"
          {
            echo 'AFP Prompt 3 exact regressions'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p3-exact-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0 \
              | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload exact-regression records
        if: always()
        id: upload-exact
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt3-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-exact
          if-no-files-found: error

      - name: Record exact-regression artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo '### Prompt 3 exact-regression artifact'
            echo "artifact_id=${{ steps.upload-exact.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-exact.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-exact.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      artifact-id: ${{ steps.upload-lean.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-lean.outputs.artifact-digest }}
      source-sha256: ${{ steps.pack-source.outputs.source-sha256 }}
      lean-jobs: ${{ steps.pack-source.outputs.lean-jobs }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Recheck pinned Prompt 2 and Prompt 3 bases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P2_COMMIT}^{tree}")" = "${P2_TREE}"
          test "$(git rev-parse "${P3_MATH_COMMIT}^{tree}")" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"
          mkdir -p "${RUNNER_TEMP}/p3-lean"
          {
            echo "candidate=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "prompt2=${P2_COMMIT}"
            echo "prompt3_mathematical_candidate=${P3_MATH_COMMIT}"
          } | tee "${RUNNER_TEMP}/p3-lean/provenance.log"

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Record Lean toolchain
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          {
            lean --version
            lake --version
            echo "toolchain=$(cat lean-toolchain)"
          } | tee "${RUNNER_TEMP}/p3-lean/toolchain.log"

      - name: Install source-policy scanner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep \
            2>&1 | tee "${RUNNER_TEMP}/p3-lean/ripgrep-install.log"
          rg --version | tee "${RUNNER_TEMP}/p3-lean/ripgrep-version.log"

      - name: Resolve pinned dependencies and cache
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake update 2>&1 | tee "${RUNNER_TEMP}/p3-lean/lake-update.log"
          lake exe cache get 2>&1 | tee "${RUNNER_TEMP}/p3-lean/mathlib-cache.log"

      - name: Build pinned Lean package
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake build 2>&1 | tee "${RUNNER_TEMP}/p3-lean/lean-build.log"

      - name: Run focused axiom audit
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake env lean AFPBarrier/PureMathAxiomAudit.lean \
            2>&1 | tee "${RUNNER_TEMP}/p3-lean/axiom-audit.log"
          if grep -n 'sorryAx' "${RUNNER_TEMP}/p3-lean/axiom-audit.log"; then
            echo "A Prompt 3 declaration depends on Lean's sorry axiom." >&2
            exit 1
          else
            grep_status=$?
            if [[ "${grep_status}" -ne 1 ]]; then
              echo "Axiom-log scan failed with status ${grep_status}." >&2
              exit "${grep_status}"
            fi
          fi

      - name: Reject placeholders and user axioms
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          if placeholder_matches=$(rg --glob '*.lean' \
              '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
              AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${placeholder_matches}"
            echo 'Lean proof placeholder found.' >&2
            exit 1
          else
            scan_status=$?
            if [[ "${scan_status}" -ne 1 ]]; then
              echo "Placeholder scan failed with status ${scan_status}." >&2
              exit "${scan_status}"
            fi
          fi
          if axiom_matches=$(rg --glob '*.lean' \
              '^[[:space:]]*((private|protected|noncomputable|unsafe|scoped)[[:space:]]+)*(axiom|axioms)([[:space:]]|$)' \
              AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${axiom_matches}"
            echo 'User axiom declaration found.' >&2
            exit 1
          else
            scan_status=$?
            if [[ "${scan_status}" -ne 1 ]]; then
              echo "User-axiom scan failed with status ${scan_status}." >&2
              exit "${scan_status}"
            fi
          fi
          echo 'No placeholders or user axioms.' \
            | tee "${RUNNER_TEMP}/p3-lean/source-policy.log"

      - name: Verify Lean checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo 'Lean checkout remains clean.' \
            | tee "${RUNNER_TEMP}/p3-lean/checkout-clean.log"

      - name: Pack and hash exact source
        if: always()
        id: pack-source
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p3-lean"
          mkdir -p "${dir}"
          archive_name="afp-prompt3-source-${CANDIDATE_SHA}.tar.gz"
          archive="${dir}/${archive_name}"
          git archive --format=tar.gz --output="${archive}" "${CANDIDATE_SHA}" -- \
            .gitignore \
            .github/workflows/afp-prompt3-from-p2-rigidity.yml \
            afp_barrier_gate1
          (
            cd "${dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
            sha256sum -c "${archive_name}.sha256"
          )
          if ! lean_jobs=$(grep -Eo '[0-9]+ jobs' "${dir}/lean-build.log" | tail -n 1); then
            echo 'Lean job count was not found in the build log.' >&2
            exit 1
          fi
          if [[ -z "${lean_jobs}" ]]; then
            echo 'Lean job count was empty.' >&2
            exit 1
          fi
          source_sha256=$(awk 'NR == 1 { print $1 }' \
            "${dir}/${archive_name}.sha256")
          test -n "${source_sha256}"
          echo "source-sha256=${source_sha256}" >> "${GITHUB_OUTPUT}"
          echo "lean-jobs=${lean_jobs}" >> "${GITHUB_OUTPUT}"
          {
            echo 'AFP Prompt 3 Lean kernel verification'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "toolchain=$(cat afp_barrier_gate1/lean-toolchain)"
            echo "lean_build=${lean_jobs}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p3-lean-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0 \
              | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload Lean records and exact source
        if: always()
        id: upload-lean
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt3-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-lean
          if-no-files-found: error

      - name: Record Lean artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo '### Prompt 3 Lean/source artifact'
            echo "artifact_id=${{ steps.upload-lean.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-lean.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-lean.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  final-candidate-integrity:
    name: final-candidate-integrity
    needs:
      - exact-regressions
      - lean-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate for final integrity audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate, ancestry, source identity, and remote bindings
        shell: bash
        env:
          EXACT_RESULT: ${{ needs.exact-regressions.result }}
          LEAN_RESULT: ${{ needs.lean-kernel.result }}
          EXACT_ARTIFACT_ID: ${{ needs.exact-regressions.outputs.artifact-id }}
          EXACT_ARTIFACT_DIGEST: ${{ needs.exact-regressions.outputs.artifact-digest }}
          LEAN_ARTIFACT_ID: ${{ needs.lean-kernel.outputs.artifact-id }}
          LEAN_ARTIFACT_DIGEST: ${{ needs.lean-kernel.outputs.artifact-digest }}
          SOURCE_SHA256: ${{ needs.lean-kernel.outputs.source-sha256 }}
          LEAN_JOBS: ${{ needs.lean-kernel.outputs.lean-jobs }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p3-final-state"
          mkdir -p "${dir}"
          gate_log="${dir}/final-gate.log"
          {
            echo "exact_regressions=${EXACT_RESULT}"
            echo "lean_kernel=${LEAN_RESULT}"
            echo "exact_artifact_id=${EXACT_ARTIFACT_ID}"
            echo "exact_artifact_digest=${EXACT_ARTIFACT_DIGEST}"
            echo "lean_artifact_id=${LEAN_ARTIFACT_ID}"
            echo "lean_artifact_digest=${LEAN_ARTIFACT_DIGEST}"
            echo "source_tar_sha256=${SOURCE_SHA256}"
            echo "lean_build=${LEAN_JOBS}"
          } > "${gate_log}"
          test "${EXACT_RESULT}" = success
          test "${LEAN_RESULT}" = success
          test -n "${EXACT_ARTIFACT_ID}"
          test -n "${EXACT_ARTIFACT_DIGEST}"
          test -n "${LEAN_ARTIFACT_ID}"
          test -n "${LEAN_ARTIFACT_DIGEST}"
          [[ "${SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LEAN_JOBS}" =~ ^[0-9]+[[:space:]]jobs$ ]]

          candidate_head=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          p2_tree=$(git rev-parse "${P2_COMMIT}^{tree}")
          p3_math_tree=$(git rev-parse "${P3_MATH_COMMIT}^{tree}")
          {
            echo "candidate_expected=${CANDIDATE_SHA}"
            echo "candidate_observed=${candidate_head}"
            echo "candidate_tree=${candidate_tree}"
            echo "prompt2_commit=${P2_COMMIT}"
            echo "prompt2_tree_expected=${P2_TREE}"
            echo "prompt2_tree_observed=${p2_tree}"
            echo "prompt3_mathematical_commit=${P3_MATH_COMMIT}"
            echo "prompt3_mathematical_tree_expected=${P3_MATH_TREE}"
            echo "prompt3_mathematical_tree_observed=${p3_math_tree}"
          } >> "${gate_log}"
          test "${candidate_head}" = "${CANDIDATE_SHA}"
          test "${p2_tree}" = "${P2_TREE}"
          test "${p3_math_tree}" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"

          old_commits=(
            65821ff1ebd47fbee1098b30c552906cd6e03b46
            6b5d7ad53d704b7ff1b96d40abbef19f6e6a2125
            d9304b5d19a1bbe69fe4ac23736308f9efe9d694
          )
          for old in "${old_commits[@]}"; do
            git cat-file -e "${old}^{commit}"
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Old Prompt 3 source commit entered candidate ancestry: ${old}" >&2
              exit 1
            fi
          done

          python - "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}" <<'PY' \
            2>&1 | tee "${dir}/final-scope.log"
          import os
          import subprocess
          import sys

          base, candidate = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-prompt3-from-p2-rigidity.yml",
              "afp_barrier_gate1/pure_math/rigidity/P3_BRANCH_PROTECTION_RECORD.md",
              "afp_barrier_gate1/docs/P2_P3_FINALIZATION_RECORD.md",
              "afp_barrier_gate1/docs/P3_STAGE_REPORT.md",
          }
          raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", base, candidate,
          ])
          changed = [os.fsdecode(path) for path in raw.split(b"\0") if path]
          outside = sorted(set(changed) - allowed)
          if outside:
              for path in outside:
                  print(f"outside closeout allowlist: {path}", file=sys.stderr)
              raise SystemExit(1)
          for path in sorted(allowed):
              entry = subprocess.check_output([
                  "git", "ls-tree", candidate, "--", path,
              ]).decode("utf-8").strip()
              if not entry.startswith("100644 blob "):
                  print(
                      f"required closeout file missing or not a regular 100644 blob: "
                      f"{path} observed={entry!r}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
          print("closeout_changed_paths:")
          for path in changed:
              print(path)
          PY
          git diff --quiet --no-ext-diff \
            "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}" -- \
            afp_barrier_gate1/AFPBarrier.lean \
            afp_barrier_gate1/AFPBarrier \
            afp_barrier_gate1/pure_math \
            ':(exclude)afp_barrier_gate1/pure_math/rigidity/P3_BRANCH_PROTECTION_RECORD.md'
          git diff --check "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"
          echo 'mathematical_and_executable_source=IDENTICAL' >> "${gate_log}"

          query_exact_ref() {
            local ref=$1 expected=$2 output actual
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
            printf '%s %s %s\n' "${ref}" "${expected}" "${actual}" \
              >> "${dir}/immutable-remote-bindings.log"
            test "${actual}" = "${expected}"
          }
          printf 'ref expected observed\n' > "${dir}/immutable-remote-bindings.log"
          query_exact_ref "${CLOSEOUT_BRANCH}" "${CANDIDATE_SHA}"
          query_exact_ref "${P2_ARCHIVE}" "${P2_COMMIT}"
          query_exact_ref "${TRANSPORT_ARCHIVE}" "${TRANSPORT_COMMIT}"
          cat "${dir}/immutable-remote-bindings.log" | tee -a "${gate_log}"

          mutable=(
            'agent/afp-pure-math-p3-q1-rigidity 65821ff1ebd47fbee1098b30c552906cd6e03b46'
            'agent/afp-pure-math-p3-integration-record 6b5d7ad53d704b7ff1b96d40abbef19f6e6a2125'
            'agent/afp-pure-math-p3-global-rigidity-near-rigidity d9304b5d19a1bbe69fe4ac23736308f9efe9d694'
          )
          mutable_log="${dir}/mutable-reference-observations.log"
          printf 'ref initial observed classification\n' > "${mutable_log}"
          for item in "${mutable[@]}"; do
            read -r ref initial <<< "${item}"
            set +e
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
              if [[ "${actual}" == "${initial}" ]]; then
                classification=UNCHANGED_SINCE_INITIAL_OBSERVATION
              else
                classification=MOVED_EXTERNALLY
              fi
            elif [[ "${status}" -eq 2 ]]; then
              actual=MISSING
              classification=MISSING
            else
              actual=QUERY_ERROR
              classification=QUERY_ERROR
            fi
            printf '%s %s %s %s\n' \
              "${ref}" "${initial}" "${actual}" "${classification}" \
              >> "${mutable_log}"
            if [[ "${classification}" == MOVED_EXTERNALLY ]]; then
              echo "reference branch moved externally; candidate ancestry and source integrity remain valid: ${ref}" \
                >> "${mutable_log}"
            fi
            if [[ "${classification}" == MISSING || \
                  "${classification}" == QUERY_ERROR ]]; then
              echo "Mutable branch required for this observation audit is unavailable: ${ref}" >&2
              exit 1
            fi
          done
          cat "${mutable_log}" | tee -a "${gate_log}"
          git diff --check
          test -z "$(git status --short)"
          echo 'Prompt 2+3 final candidate integrity: PASS' | tee -a "${gate_log}"

      - name: Hash final-state evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p3-final-state"
          mkdir -p "${dir}"
          {
            echo 'AFP Prompt 2+3 final candidate integrity'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p3-final-state-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0 \
              | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload final candidate-integrity evidence
        if: always()
        id: upload-final-state
        uses: actions/upload-artifact@v4
        with:
          name: afp-p2-p3-final-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p3-final-state
          if-no-files-found: error

      - name: Materialize the resolved finalization record
        shell: bash
        env:
          EXACT_ARTIFACT_ID: ${{ needs.exact-regressions.outputs.artifact-id }}
          EXACT_ARTIFACT_DIGEST: ${{ needs.exact-regressions.outputs.artifact-digest }}
          LEAN_ARTIFACT_ID: ${{ needs.lean-kernel.outputs.artifact-id }}
          LEAN_ARTIFACT_DIGEST: ${{ needs.lean-kernel.outputs.artifact-digest }}
          SOURCE_SHA256: ${{ needs.lean-kernel.outputs.source-sha256 }}
          LEAN_JOBS: ${{ needs.lean-kernel.outputs.lean-jobs }}
        run: |
          set -euo pipefail
          resolved="${RUNNER_TEMP}/p2-p3-finalization-resolved"
          mkdir -p "${resolved}"
          cp afp_barrier_gate1/docs/P2_P3_FINALIZATION_RECORD.md \
            "${resolved}/P2_P3_FINALIZATION_RECORD.resolved.md"
          {
            echo
            echo '## Machine-resolved exact closeout values'
            echo
            echo '```text'
            echo "final_closeout_commit=${CANDIDATE_SHA}"
            echo "final_closeout_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo 'exact_regressions=success'
            echo "exact_artifact_id=${EXACT_ARTIFACT_ID}"
            echo "exact_artifact_digest=${EXACT_ARTIFACT_DIGEST}"
            echo 'lean_kernel=success'
            echo "lean_artifact_id=${LEAN_ARTIFACT_ID}"
            echo "lean_artifact_digest=${LEAN_ARTIFACT_DIGEST}"
            echo "lean_build=${LEAN_JOBS}"
            echo "exact_source_tar_sha256=${SOURCE_SHA256}"
            echo 'final_candidate_integrity=success'
            echo "final_state_artifact_id=${{ steps.upload-final-state.outputs.artifact-id }}"
            echo "final_state_artifact_digest=${{ steps.upload-final-state.outputs.artifact-digest }}"
            echo 'mathematical_and_executable_source=IDENTICAL_TO_c66f3229d0a89d97559535810c4ba09daf6e4e42'
            echo '```'
          } >> "${resolved}/P2_P3_FINALIZATION_RECORD.resolved.md"
          cp "${RUNNER_TEMP}/p3-final-state/mutable-reference-observations.log" \
            "${resolved}/mutable-reference-observations.log"
          (
            cd "${resolved}"
            sha256sum P2_P3_FINALIZATION_RECORD.resolved.md \
              mutable-reference-observations.log > records.sha256
          )

      - name: Upload resolved finalization record
        id: upload-resolution
        uses: actions/upload-artifact@v4
        with:
          name: afp-p2-p3-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-p3-finalization-resolved
          if-no-files-found: error

      - name: Record final artifact identities
        shell: bash
        run: |
          {
            echo '### Prompt 2+3 final candidate-integrity artifact'
            echo "artifact_id=${{ steps.upload-final-state.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-final-state.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-final-state.outputs.artifact-digest }}"
            echo
            echo '### Prompt 2+3 resolved finalization record'
            echo "artifact_id=${{ steps.upload-resolution.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-resolution.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-resolution.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"
