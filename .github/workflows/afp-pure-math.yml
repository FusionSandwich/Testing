name: AFP Pure Mathematics

on:
  push:
    branches:
      - agent/afp-pure-math-p0-m1
      - agent/afp-pure-math-p2-closeout-corrected
  pull_request:
    branches:
      - testing
      - agent/afp-pure-math-p0-m1
    paths:
      - 'afp_barrier_gate1/AFPBarrier/**'
      - 'afp_barrier_gate1/AFPBarrier.lean'
      - 'afp_barrier_gate1/pure_math/**'
      - 'afp_barrier_gate1/docs/**'
      - 'afp_barrier_gate1/lakefile.lean'
      - 'afp_barrier_gate1/lean-toolchain'
      - 'afp_barrier_gate1/lake-manifest.json'
      - '.github/workflows/afp-pure-math.yml'
      - '.github/workflows/afp-quadratic-covariance.yml'
      - '.github/workflows/afp-spherical-feasibility.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  theorem-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: afp_barrier_gate1

    steps:
      - name: Check out exact repository head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact pure-math checkout
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual=$(git rev-parse HEAD)
          tree=$(git show -s --format=%T HEAD)
          echo "expected_head=${expected}"
          echo "actual_head=${actual}"
          echo "actual_tree=${tree}"
          test "$actual" = "$expected"

      - name: Set up deterministic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install falsification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' \
            2>&1 | tee pure-math-python-dependencies.log

      - name: Python syntax audit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q pure_math \
            2>&1 | tee pure-math-python-compile.log

      - name: Deterministic claim-falsification audit
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/falsification/claim_falsification_audit.py \
            2>&1 | tee pure-math-falsification.log

      - name: Quadratic covariance and closeout audits
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/covariance/quadratic_covariance_audit.py \
            2>&1 | tee pure-math-covariance.log
          python pure_math/covariance/prompt2_closeout_audit.py \
            2>&1 | tee pure-math-prompt2-closeout.log

      - name: Exact local and global feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/examples/exact_local_global_audit.py \
            2>&1 | tee pure-math-local-global-exact.log

      - name: Independent exact rational spherical audit
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/tests/test_spherical_feasibility.py \
            2>&1 | tee pure-math-spherical-rational.log

      - name: Install Elan and pinned Lean toolchain
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat afp_barrier_gate1/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            python --version
            python -c 'import numpy, sympy; print("numpy", numpy.__version__); print("sympy", sympy.__version__)'
            lean --version
            lake --version
          } | tee pure-math-toolchain.log

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update 2>&1 | tee pure-math-lake-update.log

      - name: Download Mathlib compiled cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee pure-math-mathlib-cache.log

      - name: Lean kernel build
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee pure-math-lean-build.log

      - name: Focused pure-math axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AFPBarrier/PureMathAxiomAudit.lean \
            2>&1 | tee pure-math-axiom-audit.log
          if grep -q 'sorryAx' pure-math-axiom-audit.log; then
            echo "A pure-math theorem depends on Lean's sorry axiom." >&2
            exit 1
          fi

      - name: Source placeholder and user-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
            AFPBarrier AFPBarrier.lean; then
            echo "Proof placeholder found." >&2
            exit 1
          fi
          if grep -RInE --include='*.lean' \
            '^[[:space:]]*(axiom|axioms)([[:space:]]|$)' \
            AFPBarrier AFPBarrier.lean; then
            echo "User axiom declaration found." >&2
            exit 1
          fi
          echo "No proof placeholders or user axiom declarations found." \
            | tee pure-math-source-audit.log

      - name: Verify immutable archive and closeout scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            archive/afp-gate6-spatial-multigroup-verified
          test "$(git rev-parse FETCH_HEAD)" = \
            "515f1aae6c20bd85711c90b5c1c21b4905252d01"
          base=1835918fe9d0b941395e9f00f6ac5514129cefa0
          if git merge-base --is-ancestor "$base" HEAD; then
            bad=$(git diff --name-only "$base"...HEAD | \
              grep -Ev '^(.github/workflows/afp-(quadratic-covariance|pure-math|spherical-feasibility)\.yml|afp_barrier_gate1/(AFPBarrier(\.lean|/.*\.lean)|pure_math/.*|docs/.*))$' || true)
            test -z "$bad" || { echo "$bad" >&2; exit 1; }
            git diff --check "$base"...HEAD
          fi

      - name: Write checkpoint report
        if: always()
        shell: bash
        run: |
          {
            echo "AFP pure-mathematics checkpoint"
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git show -s --format=%T HEAD)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "toolchain=$(cat lean-toolchain)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > pure-math-report.txt

      - name: Pack exact source snapshot
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='afp_barrier_gate1/.lake' \
            --exclude='afp_barrier_gate1/*.log' \
            --exclude='afp_barrier_gate1/pure-math-report.txt' \
            -czf afp-pure-math-source-${GITHUB_SHA}.tar.gz \
            afp_barrier_gate1 \
            .github/workflows/afp-pure-math.yml \
            .github/workflows/afp-quadratic-covariance.yml \
            .github/workflows/afp-spherical-feasibility.yml

      - name: Upload pure-math records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-pure-math-${{ github.run_id }}
          path: |
            afp_barrier_gate1/pure-math-report.txt
            afp_barrier_gate1/pure-math-python-dependencies.log
            afp_barrier_gate1/pure-math-python-compile.log
            afp_barrier_gate1/pure-math-falsification.log
            afp_barrier_gate1/pure-math-covariance.log
            afp_barrier_gate1/pure-math-prompt2-closeout.log
            afp_barrier_gate1/pure-math-local-global-exact.log
            afp_barrier_gate1/pure-math-spherical-rational.log
            afp_barrier_gate1/pure-math-toolchain.log
            afp_barrier_gate1/pure-math-lake-update.log
            afp_barrier_gate1/pure-math-mathlib-cache.log
            afp_barrier_gate1/pure-math-lean-build.log
            afp_barrier_gate1/pure-math-axiom-audit.log
            afp_barrier_gate1/pure-math-source-audit.log
            afp_barrier_gate1/lake-manifest.json
            afp-pure-math-source-*.tar.gz
          if-no-files-found: warn
