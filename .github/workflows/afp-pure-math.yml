name: AFP Pure Mathematics

on:
  push:
    branches:
      - agent/afp-pure-math-p0-m1
      - agent/afp-pure-math-final-completion-20260802
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASELINE_SHA: 94aebf6578a43516cce4bb7c042fc57681c93890
  ARCHIVE_SHA: 515f1aae6c20bd85711c90b5c1c21b4905252d01

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out literal candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact ancestry, tree, and immutable archive
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          tree=$(git show -s --format=%T HEAD)
          echo "expected_head=${CANDIDATE_SHA}"
          echo "actual_head=${actual}"
          echo "actual_tree=${tree}"
          echo "baseline=${BASELINE_SHA}"
          test "$actual" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          git fetch --no-tags origin archive/afp-gate6-spatial-multigroup-verified
          test "$(git rev-parse FETCH_HEAD)" = "$ARCHIVE_SHA"

      - name: Enforce nontransport completion scope
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASELINE_SHA"...HEAD)
          unexpected=$(awk '
            /^\.github\/workflows\/afp-.*\.yml$/ { next }
            /^afp_barrier_gate1\/AFPBarrier\.lean$/ { next }
            /^afp_barrier_gate1\/AFPBarrier\/.*\.lean$/ { next }
            /^afp_barrier_gate1\/pure_math\// { next }
            /^afp_barrier_gate1\/docs\// { next }
            { print }
          ' <<< "$changed")
          if test -n "$unexpected"; then
            echo 'Out-of-scope final-completion paths:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check "$BASELINE_SHA"...HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned deterministic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' 'networkx==3.5' 'mpmath==1.3.0'
          python --version
          python - <<'PY'
          import mpmath, networkx, numpy, sympy
          print('numpy', numpy.__version__)
          print('sympy', sympy.__version__)
          print('networkx', networkx.__version__)
          print('mpmath', mpmath.__version__)
          PY

      - name: Run all exact Prompt 1-4 and completion audits
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          python -m compileall -q pure_math

          python pure_math/falsification/claim_falsification_audit.py
          python pure_math/examples/exact_local_global_audit.py
          python pure_math/tests/test_spherical_feasibility.py

          python pure_math/covariance/quadratic_covariance_audit.py
          python pure_math/covariance/prompt2_closeout_audit.py
          python pure_math/covariance/exact_quadratic_covariance_audit.py
          python pure_math/covariance/exact_signed_restoration_audit.py
          python pure_math/covariance/exact_d3_invariance_counterexample.py
          python pure_math/spectral_products/exact_spectral_product_audit.py

          python pure_math/rigidity/prompt3_rigidity_audit.py
          python pure_math/rigidity/global_near_rigidity_audit.py
          python pure_math/rigidity/q1_covariance_audit.py
          python pure_math/rigidity/prompt3_completion_audit.py \
            --require-plantri \
            --catalog prompt3-triangulations-through-12.tsv
          test "$(wc -l < prompt3-triangulations-through-12.tsv)" -eq 9150

          python pure_math/barriers/prompt4_sharp_barrier_audit.py

      - name: Verify singular and plural axiom fixtures
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf 'axiom forbidden : Prop\n' > "$tmp/singular.lean"
          printf 'axioms forbidden1 forbidden2 : Prop\n' > "$tmp/plural.lean"
          printf '#print axioms Existing.theorem\ntheorem axiomName : True := by trivial\n' \
            > "$tmp/allowed.lean"
          pattern='^[[:space:]]*(axiom|axioms)([[:space:]]|$)'
          grep -qE "$pattern" "$tmp/singular.lean"
          grep -qE "$pattern" "$tmp/plural.lean"
          ! grep -qE "$pattern" "$tmp/allowed.lean"

      - name: Reject proof placeholders and user declarations
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
            afp_barrier_gate1/AFPBarrier afp_barrier_gate1/AFPBarrier.lean; then
            echo 'Forbidden proof placeholder found.' >&2
            exit 1
          fi
          if grep -RInE --include='*.lean' \
            '^[[:space:]]*(axiom|axioms)([[:space:]]|$)' \
            afp_barrier_gate1/AFPBarrier afp_barrier_gate1/AFPBarrier.lean; then
            echo 'User axiom declaration found.' >&2
            exit 1
          fi

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Prepare pinned independent checker
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          rm -rf _lean4export _nanoda_lib
          rm -f _nanoda_export.txt _nanoda_config.json

          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            source "$HOME/.cargo/env"
          fi

          git init _lean4export
          git -C _lean4export remote add origin \
            https://github.com/ammkrn/lean4export.git
          git -C _lean4export fetch --depth 1 origin \
            f3cf6458a309d643dc586a80f9ab5a93c2304db9
          git -C _lean4export checkout --detach FETCH_HEAD

          python3 - <<'PY'
          from pathlib import Path
          path = Path('_lean4export/Export.lean')
          source = path.read_text(encoding='utf-8')
          old = 'e.updateLet! (← removeMData d) (← removeMData v) (← removeMData b)'
          new = old + ' false'
          if source.count(old) != 1:
              raise SystemExit('Unexpected Lean exporter let-expression source')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          cp lean-toolchain _lean4export/
          (cd _lean4export && lake build)

          git init _nanoda_lib
          git -C _nanoda_lib remote add origin \
            https://github.com/ammkrn/nanoda_lib.git
          git -C _nanoda_lib fetch --depth 1 origin \
            e5438ac0a85a036b6dfe093aa457bc3448498014
          git -C _nanoda_lib checkout --detach FETCH_HEAD
          (cd _nanoda_lib && cargo build --release)

      - name: Resolve pinned Mathlib and obtain cache
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake update
          lake exe cache get

      - name: Build all integrated Lean roots
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake build
          lake env lean AFPBarrier/SpectralProductAlgebra.lean
          lake env lean AFPBarrier/PureMathAxiomAudit.lean \
            2>&1 | tee final-axiom-audit.log
          if grep -q 'sorryAx' final-axiom-audit.log; then
            echo "An integrated theorem depends on Lean's sorry axiom." >&2
            exit 1
          fi

      - name: Independently type-check final declarations with nanoda
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1

          cleanup() {
            rm -rf _lean4export _nanoda_lib
            rm -f _nanoda_export.txt _nanoda_config.json
          }
          trap cleanup EXIT

          foundations=(
            Nat Nat.zero Nat.succ
            List List.nil List.cons
            String String.mk Char Char.ofNat
          )
          declarations=(
            AFPBarrier.linearSampledExactRange_eq_range_inf_targetKernel
            AFPBarrier.linearSampledExactRange_finrank_eq_formExact_sub_samplingKernel
            AFPBarrier.linearSampledExactRange_finrank_eq_samplingRank_sub_residualRank
            AFPBarrier.sphereResidual_factorization
            AFPBarrier.sphereSampledExact_eq_range_inf_targetKernel
            AFPBarrier.sphereSampledExact_finrank_eq_samplingRank_sub_residualRank
            AFPBarrier.oneShell_sphereResidual_factorization
            AFPBarrier.oneShell_sphereResidualKernel_eq_samplingKernel
            AFPBarrier.oneShell_sphereSampledExactRange_eq_bot
            AFPBarrier.spectralSampledSpaces_iSupIndep
            AFPBarrier.spectralSampledFunctions_finrank_sum_le
            AFPBarrier.sphericalEigenvalue_injective
            AFPBarrier.sphericalEigenvalue_dimension_one_collision
            AFPBarrier.internalScalarOperator_constants_eq_zero
            AFPBarrier.sphericalQ_sub_one_eq_normalizedLossVariance
            AFPBarrier.sphericalQ_eq_one_active_loss
            AFPBarrier.connected_spherical_active_loss_rigidity
            AFPBarrier.adjacent_rate_ratio_bounds
            AFPBarrier.incident_loss_cross_bounds
            AFPBarrier.radial_covariance_error_bounds
            AFPBarrier.qOne_covarianceEntry_decomposition
            AFPBarrier.qOne_tangent_entry_isotropic_iff
            AFPBarrier.squarePolar_rates_forced
            AFPBarrier.squarePolar_forced_quartic_lower
            AFPBarrier.universal_rate_lower_of_defect_upper
            AFPBarrier.finiteExtremal_defect_lower
            AFPBarrier.twoLossQuality_sub_one
          )

          lake env _lean4export/.lake/build/bin/lean4export \
            AFPBarrier -- \
            "${foundations[@]}" "${declarations[@]}" \
            > _nanoda_export.txt
          test -s _nanoda_export.txt

          cat > _nanoda_config.json <<'EOF'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": [
              "propext",
              "Classical.choice",
              "Quot.sound",
              "Lean.trustCompiler"
            ],
            "unpermitted_axiom_hard_error": false,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          EOF

          RUST_BACKTRACE=1 \
            _nanoda_lib/target/release/nanoda_bin _nanoda_config.json

      - name: Final cleanliness and archive recheck
        shell: bash
        run: |
          set -euo pipefail
          rm -f afp_barrier_gate1/prompt3-triangulations-through-12.tsv
          git fetch --no-tags origin archive/afp-gate6-spatial-multigroup-verified
          test "$(git rev-parse FETCH_HEAD)" = "$ARCHIVE_SHA"
          git diff --check
          status=$(git status --short)
          if test -n "$status"; then
            echo 'Verification changed the candidate checkout:' >&2
            echo "$status" >&2
            exit 1
          fi
