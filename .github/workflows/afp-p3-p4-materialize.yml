name: AFP P3-P4 reconciliation materializer

on:
  push:
    branches:
      - agent/afp-pure-math-p3-p4-final-reconciliation
    paths:
      - '.github/p3p4-seg-patch-*.b64'
      - '.github/workflows/afp-p3-p4-materialize.yml'
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
    paths:
      - '.github/p3p4-seg-patch-*.b64'
      - '.github/workflows/afp-p3-p4-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afp-p3-p4-materialize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out literal payload head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up deterministic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify, apply, audit, and publish source-only commit
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: agent/afp-pure-math-p3-p4-final-reconciliation
          TARGET_BASE: 94aebf6578a43516cce4bb7c042fc57681c93890
          RICH_SOURCE: f1ef5b3c3107d2dfc835ed84c443eb82d752cb56
          REPAIR_BASE: dc208de1cd9dca013dccf23276a60f2b7992cf15
          ARCHIVE_SHA: 515f1aae6c20bd85711c90b5c1c21b4905252d01
          PATCH_XZ_SHA256: dadc7dbd4a2dd564cd569ec2a7aef17fa0be9d5c8447993c74ce1a32424d2c11
          PATCH_SHA256: 89fd3826109c67688b2bc69ac6c9cdd4a10ff36327745e3f7b487c6b4c39b1ec
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          git merge-base --is-ancestor "${TARGET_BASE}" HEAD
          git merge-base --is-ancestor "${RICH_SOURCE}" HEAD
          git merge-base --is-ancestor "${REPAIR_BASE}" HEAD
          git fetch --no-tags origin archive/afp-gate6-spatial-multigroup-verified
          test "$(git rev-parse FETCH_HEAD)" = "${ARCHIVE_SHA}"

          cat > /tmp/segment-checks <<'EOF'
          1efb6a5a981215e9fe6b1c3910b82dc34ace14d42a68e406f18abfec2e125b2b  .github/p3p4-seg-patch-00a.b64
          24b7b7d48952d7bf98ac06897e8455b41cc7b2f60bedb6c9cd394eefac9c8877  .github/p3p4-seg-patch-00b.b64
          e870fc4f5138589782468bb0cf9e44c422d78542afb9125d605b958fad2a78d4  .github/p3p4-seg-patch-01.b64
          e1158007948134b897f7e75c189b89f129624b276b64a483901574bdf20a958a  .github/p3p4-seg-patch-02.b64
          c59296ac81be66dd942b3244b77033b38138e0f0d944d25b258c02cebbd4a8ee  .github/p3p4-seg-patch-03.b64
          9babea0b7faaa9f8556d58f3e8a96ae1dc8e29f63f3cc5676784a324b363d2c9  .github/p3p4-seg-patch-04.b64
          9cdf584a7f1947c3015f30b8b3b5895ed5eac0355c09d38ad8858b6e02bc771a  .github/p3p4-seg-patch-05.b64
          31105fe2c6e4a7aa8189dbecf172ff6a15c407aa0ad6e979c31311bd1e877eb1  .github/p3p4-seg-patch-06.b64
          a984a3798e5bedb092e3d9bac39e070e7da6cc32192dfe47d8e0667c7be196f1  .github/p3p4-seg-patch-07.b64
          EOF
          sha256sum --check /tmp/segment-checks

          python3 - <<'PY'
          import base64
          from pathlib import Path
          paths = [
              '.github/p3p4-seg-patch-00a.b64',
              '.github/p3p4-seg-patch-00b.b64',
          ] + [f'.github/p3p4-seg-patch-{i:02d}.b64' for i in range(1, 8)]
          text = ''.join(''.join(Path(p).read_text().split()) for p in paths)
          text += '=' * (-len(text) % 4)
          Path('/tmp/p3p4.patch.xz').write_bytes(base64.b64decode(text, validate=True))
          PY

          echo "${PATCH_XZ_SHA256}  /tmp/p3p4.patch.xz" | sha256sum --check
          xz --decompress --stdout /tmp/p3p4.patch.xz > /tmp/p3p4.patch
          echo "${PATCH_SHA256}  /tmp/p3p4.patch" | sha256sum --check
          git apply --check --index /tmp/p3p4.patch
          git apply --index /tmp/p3p4.patch

          python -m pip install --disable-pip-version-check --no-input \
            'mpmath==1.3.0' 'numpy==2.3.2' 'sympy==1.14.0' 'networkx==3.5'
          python -m compileall -q afp_barrier_gate1/pure_math
          python afp_barrier_gate1/pure_math/rigidity/global_near_rigidity_audit.py
          python afp_barrier_gate1/pure_math/rigidity/q1_covariance_audit.py
          python afp_barrier_gate1/pure_math/barriers/prompt4_sharp_barrier_audit.py
          find afp_barrier_gate1/pure_math -type d -name __pycache__ -prune -exec rm -rf {} +
          find afp_barrier_gate1/pure_math -type f -name '*.pyc' -delete

          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev '^afp_barrier_gate1/(AFPBarrier/.*\.lean|pure_math/.*|docs/.*)$' || true)
          test -z "${unexpected}" || { echo "${unexpected}" >&2; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply reconciled Prompt 3 source and synthesis'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
