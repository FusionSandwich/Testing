name: AFP Proposition 7.3 publication-safe repair

on:
  push:
    branches:
      - agent/afp-post-audit-repair-d56db0b
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  SOURCE_DATE_EPOCH: '1785900000'

jobs:
  exact-head-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the literal event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and linear repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor d05c98e5f1e211228940c7094df661c27d9e040b HEAD
          test "$(git rev-list --count --merges d05c98e5f1e211228940c7094df661c27d9e040b..HEAD)" -eq 0
          test -z "$(git status --porcelain)"

      - name: Install deterministic audit dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'pytest==9.0.2' 'matplotlib==3.10.8'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lmodern pandoc poppler-utils ripgrep texlive-fonts-recommended \
            texlive-xetex texlive-latex-extra

      - name: Verify the fixed-level theorem and certificate interface
        shell: bash
        run: |
          set -euo pipefail
          COV=afp_barrier_gate1/pure_math/covariance
          FIXTURE="$COV/p1e_fixed_support_certificate_fixture.json"
          python -m py_compile "$COV"/p1e_fixed_support_*.py
          python "$COV/p1e_fixed_support_certificate.py" "$FIXTURE"
          python "$COV/p1e_fixed_support_certificate_independent.py" "$FIXTURE"
          python "$COV/p1e_fixed_support_robustness_audit.py"
          python -m pytest -p no:cacheprovider -q \
            afp_barrier_gate1/pure_math/tests/test_p1e_fixed_support_robustness.py

      - name: Retain the unperturbed all-orders construction gates
        shell: bash
        run: |
          set -euo pipefail
          COV=afp_barrier_gate1/pure_math/covariance
          python "$COV/p1e_short_gap_symbolic_matrix_audit.py"
          python "$COV/p1e_short_gap_cauchy_guard_audit.py"
          python "$COV/p1e_short_gap_cauchy_hostile_audit.py"
          python "$COV/p1e_short_gap_polar_guard_audit.py"
          python "$COV/p1e_short_gap_proof_audit.py"
          python "$COV/p1e_no_guard_ring_independent_audit.py"
          python "$COV/p1e_short_gap_family_audit.py"
          python "$COV/p1e_short_gap_referee_audit.py"

      - name: Enforce theorem, registry, formalization and numerical boundaries
        shell: bash
        run: |
          set -euo pipefail
          PAPER=docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md
          REG=docs/publication_program/THEOREM_REGISTRY.md
          THM=docs/publication_program/P1E_FIXED_SUPPORT_ROBUSTNESS_THEOREM.md
          grep -Fq '### Proposition 7.3 (fixed-level support-preserving robustness)' "$PAPER"
          ! grep -Fq '### Open problem 7.3' "$PAPER"
          grep -Fq '| P1E-ROBUST-FIXED | PROVED |' "$REG"
          grep -Fq '| P1E-ROBUST-UNIFORM | REJECTED |' "$REG"
          grep -Fq 'level-dependent' "$THM"
          grep -Fq 'merely existential' "$THM"
          grep -Fq 'CONFORMANCE_FIXTURE_ONLY' \
            afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate_fixture.json
          ! grep -RFn 'P1E-ROBUST | OPEN' docs/publication_program
          ! grep -RFn 'Open problem 7.3' docs/publication_program
          ! grep -RFn '2^{28\cdot2^{10^6}}' \
            docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md \
            docs/publication_program/THEOREM_REGISTRY.md \
            docs/publication_program/VALUE_REGISTRY.md
          grep -Fq 'the analytic level-dependent radius in Proposition 7.3' \
            docs/publication_program/p1f_manuscript/FORMAL_AND_RELEASE_AUDIT.md

      - name: Rebuild and inspect the flagship PDF
        shell: bash
        run: |
          set -euo pipefail
          PAPER=output/pdf/FLAGSHIP_MANUSCRIPT.pdf
          GRAPH=docs/publication_program/p1f_manuscript/proof_dependency_graph.png
          cp "$PAPER" "${RUNNER_TEMP}/committed-paper.pdf"
          cp "$GRAPH" "${RUNNER_TEMP}/committed-graph.png"
          python docs/publication_program/p1f_manuscript/build_flagship_paper.py
          mv "$PAPER" "${RUNNER_TEMP}/rebuilt-paper.pdf"
          mv "$GRAPH" "${RUNNER_TEMP}/rebuilt-graph.png"
          cp "${RUNNER_TEMP}/committed-paper.pdf" "$PAPER"
          cp "${RUNNER_TEMP}/committed-graph.png" "$GRAPH"
          pdfinfo "${RUNNER_TEMP}/rebuilt-paper.pdf" > "${RUNNER_TEMP}/pdfinfo.txt"
          pdftotext "${RUNNER_TEMP}/rebuilt-paper.pdf" "${RUNNER_TEMP}/rebuilt-paper.txt"
          pdftotext "$PAPER" "${RUNNER_TEMP}/committed-paper.txt"
          test "$(awk '/^Pages:/ {print $2}' "${RUNNER_TEMP}/pdfinfo.txt")" -ge 20
          test "$(awk '/^Pages:/ {print $2}' "${RUNNER_TEMP}/pdfinfo.txt")" -le 35
          grep -Fq 'Proposition 7.3 (fixed-level support-preserving robustness)' "${RUNNER_TEMP}/rebuilt-paper.txt"
          ! grep -Fq 'Open problem 7.3' "${RUNNER_TEMP}/rebuilt-paper.txt"
          ! grep -Eq '\[\@A[A-Za-z0-9:_-]+\]' "${RUNNER_TEMP}/rebuilt-paper.txt"
          python - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['RUNNER_TEMP'])
          def normalize(path: Path) -> str:
              text = path.read_text(encoding='utf-8')
              text = text.replace('\u00ad', '').replace('-', '')
              return re.sub(r'\s+', '', text)
          committed = normalize(root / 'committed-paper.txt')
          rebuilt = normalize(root / 'rebuilt-paper.txt')
          assert committed == rebuilt, 'committed and clean-rebuilt PDF token streams differ'
          print('P1F_CLEAN_REBUILD_TOKEN_STREAM_PASS')
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          manifest = Path('docs/publication_program/p1f_manuscript/P1F_REPRODUCIBILITY_MANIFEST.md').read_text(encoding='utf-8')
          paths = {
              'FLAGSHIP_MANUSCRIPT.md': Path('docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md'),
              'priority_sources.bib': Path('docs/publication_program/p1f_manuscript/priority_sources.bib'),
              'proof_dependency_graph.png': Path('docs/publication_program/p1f_manuscript/proof_dependency_graph.png'),
              'build_flagship_paper.py': Path('docs/publication_program/p1f_manuscript/build_flagship_paper.py'),
              'paper_header.tex': Path('docs/publication_program/p1f_manuscript/paper_header.tex'),
              'P1E_FIXED_SUPPORT_ROBUSTNESS_THEOREM.md': Path('docs/publication_program/P1E_FIXED_SUPPORT_ROBUSTNESS_THEOREM.md'),
              'p1e_fixed_support_certificate.schema.json': Path('afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate.schema.json'),
              'output/pdf/FLAGSHIP_MANUSCRIPT.pdf': Path('output/pdf/FLAGSHIP_MANUSCRIPT.pdf'),
          }
          for label, path in paths.items():
              match = re.search(rf"`{re.escape(label)}` \| `([0-9a-f]{{64}})` \|", manifest)
              assert match, label
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == match.group(1), (label, actual, match.group(1))
          print('P1F_REPAIR_CONTENT_HASHES_PASS')
          PY

      - name: Emit exact-head repair evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          git rev-parse HEAD > repair-evidence/commit.txt
          git rev-parse HEAD^{tree} > repair-evidence/tree.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          paths = [
              '.github/workflows/afp-post-audit-prop73-repair.yml',
              'docs/publication_program/P1E_FIXED_SUPPORT_ROBUSTNESS_THEOREM.md',
              'docs/publication_program/P1E_ROBUSTNESS_DEPENDENCY.json',
              'docs/publication_program/P1E_ROBUSTNESS_DEPENDENCY_AUDIT.md',
              'docs/publication_program/P1E_ROBUSTNESS_PROOF_FAMILY_REGISTRY.md',
              'docs/publication_program/P1E_ROBUSTNESS_REPAIR_REPORT.md',
              'docs/publication_program/P1E_ROBUSTNESS_REPAIR_MANIFEST.json',
              'docs/publication_program/p1f_manuscript/P1F_REPRODUCIBILITY_MANIFEST.md',
              'docs/publication_program/THEOREM_REGISTRY.md',
              'docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md',
              'afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_robustness.py',
              'afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate.py',
              'afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate_independent.py',
              'afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate.schema.json',
              'afp_barrier_gate1/pure_math/covariance/p1e_fixed_support_certificate_fixture.json',
              'afp_barrier_gate1/pure_math/tests/test_p1e_fixed_support_robustness.py',
              'output/pdf/FLAGSHIP_MANUSCRIPT.pdf',
          ]
          records = []
          for name in paths:
              data = Path(name).read_bytes()
              records.append({'path': name, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)})
          out = {
              'schema_version': 1,
              'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'status': 'EXACT_HEAD_REPAIR_PASS',
              'records': records,
          }
          Path('repair-evidence/manifest.json').write_text(json.dumps(out, indent=2) + '\n')
          PY
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afp-proposition-7-3-exact-head-${{ github.sha }}
          path: repair-evidence
          if-no-files-found: error
          retention-days: 30
