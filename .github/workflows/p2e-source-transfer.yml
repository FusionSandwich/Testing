name: P2E source transfer

on:
  push:
    branches:
      - agent/p2e-source-transfer-783ea62d

permissions:
  contents: write

concurrency:
  group: p2e-source-transfer
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/afp-publication-p2e-benchmark-development-b34c29b1
  TARGET_PARENT: 783ea62df49d132e8b4b82ef544a7c9cfe6a3f77
  PAYLOAD_B64_SHA256: d74dbc96830fe3bd18ba5ad74859ff4e384196150a097d5d95aed65b263dfa9f
  PAYLOAD_TAR_SHA256: 8bda5e57ca188649468dd64d7bf5bee043f9c13fb312f0f4b98b433359add82a

jobs:
  materialize-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and reconstruct payload
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2e-transfer"
          mkdir -p "${work}"
          cat \
            .github/p2e-bootstrap/payload.part00 \
            .github/p2e-bootstrap/payload.part01 \
            .github/p2e-bootstrap/payload.part02x0 \
            .github/p2e-bootstrap/payload.part02x1 \
            > "${work}/payload.b64"
          actual_b64=$(sha256sum "${work}/payload.b64" | awk '{print $1}')
          echo "payload_b64_sha256=${actual_b64}"
          test "${actual_b64}" = "${PAYLOAD_B64_SHA256}"
          base64 --decode "${work}/payload.b64" > "${work}/payload.tar.gz"
          actual_tar=$(sha256sum "${work}/payload.tar.gz" | awk '{print $1}')
          echo "payload_tar_sha256=${actual_tar}"
          test "${actual_tar}" = "${PAYLOAD_TAR_SHA256}"
          tar -tzf "${work}/payload.tar.gz" | sort > "${work}/inventory.txt"
          cat > "${work}/payload-expected.txt" <<'EOF'
          .github/workflows/afp-publication-p2e-development.yml
          afp_barrier_gate1/pure_math/benchmarking/harness.py
          afp_barrier_gate1/pure_math/benchmarking/manifest_builder.py
          afp_barrier_gate1/pure_math/benchmarking/operator_freeze.py
          afp_barrier_gate1/pure_math/benchmarking/transport.py
          afp_barrier_gate1/pure_math/tests/test_p2e_benchmarking.py
          EOF
          diff -u "${work}/payload-expected.txt" "${work}/inventory.txt"

      - name: Materialize exact non-workflow target commit
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2e-transfer"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${TARGET_PARENT}"
          git switch --force-create "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          tar -xzf "${work}/payload.tar.gz"

          # GitHub Actions tokens may not update workflow files without the
          # dedicated workflows permission. Restore the existing workflow and
          # publish the exact workflow payload in a separate connector-audited
          # commit after this source commit succeeds.
          git restore --source=HEAD -- .github/workflows/afp-publication-p2e-development.yml

          git add \
            afp_barrier_gate1/pure_math/benchmarking/harness.py \
            afp_barrier_gate1/pure_math/benchmarking/manifest_builder.py \
            afp_barrier_gate1/pure_math/benchmarking/operator_freeze.py \
            afp_barrier_gate1/pure_math/benchmarking/transport.py \
            afp_barrier_gate1/pure_math/tests/test_p2e_benchmarking.py
          git diff --cached --check
          git diff --cached --name-only | sort > "${work}/changed.txt"
          cat > "${work}/target-expected.txt" <<'EOF'
          afp_barrier_gate1/pure_math/benchmarking/harness.py
          afp_barrier_gate1/pure_math/benchmarking/manifest_builder.py
          afp_barrier_gate1/pure_math/benchmarking/operator_freeze.py
          afp_barrier_gate1/pure_math/benchmarking/transport.py
          afp_barrier_gate1/pure_math/tests/test_p2e_benchmarking.py
          EOF
          diff -u "${work}/target-expected.txt" "${work}/changed.txt"
          git config user.name FusionSandwich
          git config user.email 145234893+FusionSandwich@users.noreply.github.com
          git commit -m 'P2E: add preregistration harness and validation code'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
