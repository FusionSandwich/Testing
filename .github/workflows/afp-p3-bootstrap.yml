name: AFP Prompt 3 bootstrap

on:
  push:
    branches:
      - agent/afp-pure-math-p3-global-rigidity-near-rigidity

permissions:
  contents: write

concurrency:
  group: afp-p3-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify, materialize, and publish the Prompt 3 package
        shell: bash
        env:
          EXPECTED_BASE: c88b57533c3c8ad8fd819e4e52a74c4b5a245479
          EXPECTED_PATCH_SHA256: aceeb604bdc9a548783872601e90fa377165326bdf0989586ff9c6f251146f15
          TARGET_BRANCH: agent/afp-pure-math-p3-global-rigidity-near-rigidity
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${EXPECTED_BASE}" HEAD

          unexpected=$(git diff --name-only "${EXPECTED_BASE}"...HEAD | \
            grep -Ev '^\.github/(p3-patch-0[0-3]\.b64|workflows/afp-p3-bootstrap\.yml)$' || true)
          test -z "${unexpected}" || {
            echo "Unexpected pre-bootstrap paths:" >&2
            echo "${unexpected}" >&2
            exit 1
          }

          cat .github/p3-patch-00.b64 \
              .github/p3-patch-01.b64 \
              .github/p3-patch-02.b64 \
              .github/p3-patch-03.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/p3.patch

          echo "${EXPECTED_PATCH_SHA256}  /tmp/p3.patch" | sha256sum --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -f \
            .github/p3-patch-00.b64 \
            .github/p3-patch-01.b64 \
            .github/p3-patch-02.b64 \
            .github/p3-patch-03.b64 \
            .github/workflows/afp-p3-bootstrap.yml

          git apply --check --index /tmp/p3.patch
          git apply --index /tmp/p3.patch
          git diff --cached --check

          test -f .github/workflows/afp-global-rigidity.yml
          test ! -e .github/p3-patch-00.b64
          test ! -e .github/workflows/afp-p3-bootstrap.yml

          git commit -m 'Implement Prompt 3 global Q rigidity package'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
