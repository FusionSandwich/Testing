name: AFP Lean Gate 1

on:
  push:
    branches:
      - codex-afp-lean-gate1
    paths:
      - 'afp_barrier_gate1/**'
      - '.github/workflows/afp-barrier-gate1.yml'
  pull_request:
    paths:
      - 'afp_barrier_gate1/**'
      - '.github/workflows/afp-barrier-gate1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: afp_barrier_gate1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Elan and pinned Lean toolchain
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat afp_barrier_gate1/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            lean --version
            lake --version
          } | tee toolchain.log

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update 2>&1 | tee lake-update.log

      - name: Download Mathlib compiled cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee mathlib-cache.log

      - name: Lean kernel build
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee lean-build.log

      - name: Axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AFPBarrier/AxiomAudit.lean 2>&1 | tee axiom-audit.log
          if grep -q 'sorryAx' axiom-audit.log; then
            echo "A theorem depends on Lean's sorry axiom." >&2
            exit 1
          fi

      - name: Source placeholder audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' AFPBarrier AFPBarrier.lean; then
            echo "Proof placeholder found." >&2
            exit 1
          fi
          if grep -RInE --include='*.lean' '^[[:space:]]*axiom([[:space:]]|$)' AFPBarrier AFPBarrier.lean; then
            echo "User axiom declaration found." >&2
            exit 1
          fi
          echo "No proof placeholders or user axiom declarations found." | tee source-audit.log

      - name: Write Gate 1 report
        if: always()
        shell: bash
        run: |
          {
            echo "AFP Barrier Gate 1"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "toolchain=$(cat lean-toolchain)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > gate1-report.txt

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-lean-gate1-${{ github.run_id }}
          path: |
            afp_barrier_gate1/gate1-report.txt
            afp_barrier_gate1/toolchain.log
            afp_barrier_gate1/lake-update.log
            afp_barrier_gate1/mathlib-cache.log
            afp_barrier_gate1/lean-build.log
            afp_barrier_gate1/axiom-audit.log
            afp_barrier_gate1/source-audit.log
            afp_barrier_gate1/lake-manifest.json
          if-no-files-found: warn
