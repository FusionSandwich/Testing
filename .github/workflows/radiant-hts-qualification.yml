name: Radiant HTS qualification

on:
  push:
    branches:
      - codex/radiant-qualification-runner-20260828
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radiant-hts-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  julia-test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.6.7'
          - '1.10.12'

    steps:
      - name: Check out qualification harness
        uses: actions/checkout@v4

      - name: Check out Radiant HTS branch
        uses: actions/checkout@v4
        with:
          repository: FusionSandwich/Radiant.jl
          ref: codex/radianthts-core-foundation-20260828
          path: Radiant.jl
          fetch-depth: 1

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64

      - name: Cache Julia packages
        uses: julia-actions/cache@v3

      - name: Record environment
        shell: bash
        run: |
          set -o pipefail
          mkdir -p qualification-output
          {
            echo "runner_repository=${GITHUB_REPOSITORY}"
            echo "runner_ref=${GITHUB_REF}"
            echo "radiant_repository=FusionSandwich/Radiant.jl"
            echo "radiant_ref=codex/radianthts-core-foundation-20260828"
            echo "radiant_sha=$(git -C Radiant.jl rev-parse HEAD)"
            julia --version
            uname -a
          } | tee "qualification-output/environment-julia-${{ matrix.julia-version }}.txt"
          cp Radiant.jl/test/runtests.jl \
            "qualification-output/runtests-source-julia-${{ matrix.julia-version }}.jl"

      - name: Audit two-positional-argument range calls
        if: ${{ matrix.julia-version == '1.6.7' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("Radiant.jl")
          findings = []
          pattern = re.compile(r"\brange\s*\(")

          for path in sorted(root.rglob("*.jl")):
              text = path.read_text(encoding="utf-8")
              for match in pattern.finditer(text):
                  opening = text.find("(", match.start())
                  depth = 0
                  commas = 0
                  semicolons = 0
                  quote = None
                  escaped = False
                  end = None
                  i = opening
                  while i < len(text):
                      char = text[i]
                      if quote is not None:
                          if escaped:
                              escaped = False
                          elif char == "\\":
                              escaped = True
                          elif text.startswith(quote, i):
                              i += len(quote) - 1
                              quote = None
                      else:
                          if text.startswith('"""', i) or text.startswith("'''", i):
                              quote = text[i:i+3]
                              i += 2
                          elif char in ('"', "'"):
                              quote = char
                          elif char == "(":
                              depth += 1
                          elif char == ")":
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  break
                          elif depth == 1 and char == ",":
                              commas += 1
                          elif depth == 1 and char == ";":
                              semicolons += 1
                      i += 1
                  if end is None or commas != 1 or semicolons != 0:
                      continue
                  line = text.count("\n", 0, match.start()) + 1
                  snippet = " ".join(text[match.start():end].split())
                  findings.append(f"{path.relative_to(root)}:{line}: {snippet}")

          output = Path("qualification-output/julia-1.6-two-positional-range-audit.txt")
          output.write_text("\n".join(findings) + ("\n" if findings else ""), encoding="utf-8")
          print(f"two-positional range calls: {len(findings)}")
          for finding in findings:
              print(finding)
          PY

      - name: Instantiate and precompile
        shell: bash
        run: |
          set -o pipefail
          julia --project=Radiant.jl -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()' \
            2>&1 | tee "qualification-output/precompile-julia-${{ matrix.julia-version }}.log"

      - name: Run package tests
        shell: bash
        run: |
          set -o pipefail
          julia --project=Radiant.jl -e 'using Pkg; Pkg.test(; coverage=true)' \
            2>&1 | tee "qualification-output/tests-julia-${{ matrix.julia-version }}.log"

      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiant-hts-julia-${{ matrix.julia-version }}
          path: qualification-output
          if-no-files-found: warn
          retention-days: 30
