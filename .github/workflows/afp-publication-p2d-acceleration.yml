name: AFP publication P2D fixed-point acceleration

on:
  push:
    branches:
      - agent/afp-publication-p2d-acceleration-b34c29b1
      - archive/afp-publication-p2d-acceleration-verified
  pull_request:
    branches:
      - archive/afp-publication-p2c-codesign-verified
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  EXPECTED_REPOSITORY: FusionSandwich/Testing
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P2D_BRANCH: agent/afp-publication-p2d-acceleration-b34c29b1
  P2D_ARCHIVE: archive/afp-publication-p2d-acceleration-verified
  P2C_COMMIT: b34c29b1b04f5293eaa4007b39d189efa03c51f5
  P2C_TREE: 7db9e821738b0121ab3fdb1d1a40b76f85abed48
  P2C_ARCHIVE: archive/afp-publication-p2c-codesign-verified
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  acceleration-proof-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify literal ancestry and exact scope
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2d"; mkdir -p "${out}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P2C_COMMIT}^{tree}")" = "${P2C_TREE}"
          git merge-base --is-ancestor "${P2C_COMMIT}" "${CANDIDATE_SHA}"
          test "$(git rev-list --count --merges "${P2C_COMMIT}..${CANDIDATE_SHA}")" -eq 0
          python - "${P2C_COMMIT}" "${CANDIDATE_SHA}" <<'PY'
          import os, subprocess, sys
          base, head = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-publication-p2d-acceleration.yml",
              "afp_barrier_gate1/AFPBarrier/AccelerationFixedPoint.lean",
              "afp_barrier_gate1/AFPBarrier/P2DAccelerationAxiomAudit.lean",
              "afp_barrier_gate1/pure_math/acceleration/__init__.py",
              "afp_barrier_gate1/pure_math/acceleration/audit.py",
              "afp_barrier_gate1/pure_math/acceleration/core.py",
              "afp_barrier_gate1/pure_math/acceleration/fixtures.py",
              "afp_barrier_gate1/pure_math/tests/test_p2d_acceleration.py",
              "docs/publication_program/P2D_ACCELERATION_PRECONDITIONER.md",
              "docs/publication_program/P2D_APPROACH_REGISTRY.md",
              "docs/publication_program/P2D_CLAIM_MAP.md",
              "docs/publication_program/P2D_CLAUSE_MATRIX.md",
              "docs/publication_program/P2D_PRIOR_ART_AND_HOSTILE_AUDIT.md",
              "docs/publication_program/P2D_STAGE_REPORT.md",
          }
          raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", base, head])
          changed = {os.fsdecode(item) for item in raw.split(b"\0") if item}
          if changed != allowed:
              raise SystemExit(f"P2D scope mismatch; missing={sorted(allowed-changed)} outside={sorted(changed-allowed)}")
          forbidden = (set(range(32)) - {9, 10, 13}) | {127}
          for path in sorted(changed):
              row = subprocess.check_output(["git", "ls-tree", head, "--", path], text=True).strip()
              if not row.startswith("100644 blob "):
                  raise SystemExit(f"not a regular blob: {path}: {row!r}")
              payload = subprocess.check_output(["git", "show", f"{head}:{path}"])
              payload.decode("utf-8")
              bad = sorted({byte for byte in payload if byte in forbidden})
              if bad:
                  raise SystemExit(f"forbidden control bytes in {path}: {bad}")
          print(f"P2D_SCOPE_EXACT:{len(changed)}")
          PY
          git diff --check "${P2C_COMMIT}" "${CANDIDATE_SHA}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install frozen numerical stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'clarabel==0.11.1' 'cvxpy==1.7.3' 'numpy==2.3.2' \
            'osqp==1.0.4' 'pytest==8.4.2' 'scipy==1.18.0' \
            'scs==3.2.9' 'sympy==1.14.0'
          python -m pip freeze --all | sort > "${RUNNER_TEMP}/p2d/pip-freeze.txt"

      - name: Run P2D audit and hostile tests
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2d"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p2d-pycache"
          python -m compileall -q pure_math/acceleration pure_math/tests/test_p2d_acceleration.py
          python -m pure_math.acceleration.audit | tee "${out}/p2d-audit.log"
          python -m pytest -p no:cacheprovider -q -ra pure_math/tests/test_p2d_acceleration.py | tee "${out}/pytest.log"
          grep -Fxq 'P2D_ACCELERATION_AUDIT_PASS' "${out}/p2d-audit.log"
          grep -Fq '"higher_shell_failure_exposed": true' "${out}/p2d-audit.log"
          grep -Fq '"conservation_constraint_preserved": true' "${out}/p2d-audit.log"
          grep -Eq '^[0-9]+ passed' "${out}/pytest.log"

      - name: Retain P2A-P2C regressions
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2d"
          python -m pure_math.optimization.exact_audit | tee "${out}/p2a.log"
          python -m pure_math.dynamics.exact_audit | tee "${out}/p2b.log"
          python -m pure_math.codesign.exact_audit | tee "${out}/p2c.log"
          grep -Fxq 'P2A exact symmetric/Farkas audit: PASS' "${out}/p2a.log"
          grep -Fxq 'P2B exact manufactured audit: PASS' "${out}/p2b.log"
          grep -Fxq 'P2C_EXACT_AUDIT_PASS' "${out}/p2c.log"

      - name: Audit claim/doc inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path("docs/publication_program")
          names = {
              "P2D_ACCELERATION_PRECONDITIONER.md", "P2D_APPROACH_REGISTRY.md",
              "P2D_CLAIM_MAP.md", "P2D_CLAUSE_MATRIX.md",
              "P2D_PRIOR_ART_AND_HOSTILE_AUDIT.md", "P2D_STAGE_REPORT.md",
          }
          got = {path.name for path in root.glob("P2D*.md")}
          if got != names:
              raise SystemExit(f"P2D document inventory mismatch: {sorted(got)}")
          claims = (root / "P2D_CLAIM_MAP.md").read_text(encoding="utf-8")
          ids = re.findall(r"^\|\s*(D[0-9]{2})\s*\|", claims, re.M)
          if ids != [f"D{i:02d}" for i in range(1, 11)]:
              raise SystemExit(f"claim ids: {ids}")
          scan = list(root.glob("P2D*.md")) + list(pathlib.Path("afp_barrier_gate1/pure_math/acceleration").glob("*.py"))
          forbidden = re.compile(r"(?im)(?:^|\s)(?:TODO|TBD|FIXME|XXX):|NotImplementedError|STATUS_PENDING")
          for path in scan:
              match = forbidden.search(path.read_text(encoding="utf-8"))
              if match:
                  raise SystemExit(f"placeholder in {path}: {match.group(0)!r}")
          print("P2D_DOCUMENT_AUDIT_PASS")
          PY
          git diff --check
          test -z "$(git status --short)"

      - name: Hash exact evidence
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2d"
          git archive --format=tar.gz --output="${out}/p2d-source-${CANDIDATE_SHA}.tar.gz" "${CANDIDATE_SHA}"
          printf 'repository=%s\nhead=%s\ntree=%s\nbase=%s\n' \
            "${GITHUB_REPOSITORY}" "${CANDIDATE_SHA}" "$(git rev-parse HEAD^{tree})" "${P2C_COMMIT}" > "${out}/provenance.txt"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afp-publication-p2d-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2d
          if-no-files-found: error
          retention-days: 90

  retained-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Build P2D finite core and axiom audit
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake build AFPBarrier.AccelerationFixedPoint
          lake env lean AFPBarrier/P2DAccelerationAxiomAudit.lean
          ! grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' AFPBarrier/AccelerationFixedPoint.lean AFPBarrier/P2DAccelerationAxiomAudit.lean
          git diff --check
          test -z "$(git status --short)"
