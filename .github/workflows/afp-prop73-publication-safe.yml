name: AFP Proposition 7.3 publication-safe repair

on:
  push:
    branches:
      - agent/afp-prop73-publication-safe-20260810
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  EXPECTED_REPOSITORY: FusionSandwich/Testing
  REPAIR_BRANCH: agent/afp-prop73-publication-safe-20260810
  AUTHORITATIVE_PARENT: b8912c282a22420e8077c75929b16c7a33d189b2
  AUTHORITATIVE_TREE: 4c2175463a661ce3f2bb206f0cb7b5038183b2ab
  PR_BRANCH: agent/afp-consolidated-p2e-p2f-e60f5c7
  GIT_NO_REPLACE_OBJECTS: '1'
  SOURCE_DATE_EPOCH: '1785900000'

jobs:
  repair-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Resolve authority, apply Outcome B, and run exact mathematics
        shell: bash
        run: bash tools/run_p1e_prop73_repair.sh pre

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Run Lean, rebuild the paper, finalize records, and fast-forward the repair branch
        shell: bash
        run: bash tools/run_p1e_prop73_repair.sh post

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: afp-prop73-publication-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/afp-prop73-validation
            output/pdf/FLAGSHIP_MANUSCRIPT.pdf
            docs/publication_program/P1E_PROP73_REPAIR_REPORT.md
            docs/publication_program/P1E_PROP73_VALIDATION_LOG.md
            docs/publication_program/p1f_manuscript/P1F_REPRODUCIBILITY_MANIFEST.md
          if-no-files-found: warn
