name: Harborth Lean CI

on:
  push:
    branches: [codex/harborth-lean-ci-20260823]
  pull_request:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.30.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Version
        run: |
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
