name: AFP Prompt 4 from verified Prompt 3 sharp barriers

on:
  push:
    branches:
      - agent/afp-pure-math-p4-from-p3-8de4b948
      - archive/afp-pure-math-p4-sharp-barriers-verified
  pull_request:
    branches:
      - archive/afp-pure-math-p3-rigidity-verified
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P4_BRANCH: agent/afp-pure-math-p4-from-p3-8de4b948
  P3_BASE_COMMIT: 8de4b94835137d1eaf32c14b626424f87d2e176d
  P3_BASE_TREE: 350fc38359fa4c55666c9244c61890188c4b4f44
  P3_ARCHIVE: archive/afp-pure-math-p3-rigidity-verified
  P4_ARCHIVE: archive/afp-pure-math-p4-sharp-barriers-verified
  OLD_P4_BASE: 47ef59b0463ecd4bd7a18a3301f29b14f9777c20
  OLD_P4_IMPLEMENTATION: ae5b4c7635f917ea7abb6feb58717cc0173b4cd7
  OLD_P4_MERGE: d1a31d195ae3c371b3f9cee29bd7ed34d1ff0994
  P2_COMMIT: 31ea6a49f006df10ca633eafd6848ad43b51ac3f
  P2_TREE: 879b88de81eeb52ebb09373c2ccb77cb7cb7642c
  P2_ARCHIVE: archive/afp-pure-math-p2-quadratic-covariance-verified-31ea6a49
  P3_MATH_COMMIT: c66f3229d0a89d97559535810c4ba09daf6e4e42
  P3_MATH_TREE: 29d5e7f8f55479513a71dd457f9bd64c11b6df0f
  TRANSPORT_ARCHIVE: archive/afp-gate6-spatial-multigroup-verified
  TRANSPORT_COMMIT: 515f1aae6c20bd85711c90b5c1c21b4905252d01
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  exact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      artifact-id: ${{ steps.upload-exact.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-exact.outputs.artifact-digest }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify immutable objects, ancestry, archives, and mutable observations
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-exact"
          record=afp_barrier_gate1/pure_math/barriers/P4_SALVAGE_LEDGER.md
          mkdir -p "${dir}"

          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git cat-file -e "${P3_BASE_COMMIT}^{commit}"
          test "$(git rev-parse "${P3_BASE_COMMIT}^{tree}")" = "${P3_BASE_TREE}"
          git cat-file -e "${P2_COMMIT}^{commit}"
          test "$(git rev-parse "${P2_COMMIT}^{tree}")" = "${P2_TREE}"
          git cat-file -e "${P3_MATH_COMMIT}^{commit}"
          test "$(git rev-parse "${P3_MATH_COMMIT}^{tree}")" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}"

          for old in "${OLD_P4_BASE}" "${OLD_P4_IMPLEMENTATION}" "${OLD_P4_MERGE}"; do
            git cat-file -e "${old}^{commit}"
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Old Prompt 4 commit entered candidate ancestry: ${old}" >&2
              exit 1
            fi
          done
          while IFS= read -r old; do
            [[ -n "${old}" ]] || continue
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Commit from old Prompt 4 implementation range entered candidate ancestry: ${old}" >&2
              exit 1
            fi
          done < <(git rev-list "${OLD_P4_BASE}..${OLD_P4_IMPLEMENTATION}")
          if git rev-list --merges "${P3_BASE_COMMIT}..${CANDIDATE_SHA}" |
              grep -q .; then
            echo 'Merge commit found after the verified Prompt 3 baseline.' >&2
            git rev-list --merges "${P3_BASE_COMMIT}..${CANDIDATE_SHA}" >&2
            exit 1
          fi

          query_exact_ref() {
            local ref=$1 expected=$2 output actual
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
            printf '%s %s %s EXACT\n' "${ref}" "${expected}" "${actual}"
            test "${actual}" = "${expected}"
          }
          {
            printf 'ref expected observed result\n'
            query_exact_ref "${P4_BRANCH}" "${CANDIDATE_SHA}"
            query_exact_ref "${P3_ARCHIVE}" "${P3_BASE_COMMIT}"
            query_exact_ref "${P2_ARCHIVE}" "${P2_COMMIT}"
            query_exact_ref "${TRANSPORT_ARCHIVE}" "${TRANSPORT_COMMIT}"
          } | tee "${dir}/immutable-refs.log"

          p4_archive_log="${dir}/prompt4-archive-observation.log"
          set +e
          archive_output=$(git ls-remote --exit-code --heads origin             "refs/heads/${P4_ARCHIVE}")
          archive_status=$?
          set -e
          if [[ "${archive_status}" -eq 0 ]]; then
            archive_head=$(awk 'NR == 1 { print $1 }' <<< "${archive_output}")
            printf '%s %s PRESENT\n' "${P4_ARCHIVE}" "${archive_head}"               > "${p4_archive_log}"
            if [[ "${archive_head}" != "${CANDIDATE_SHA}" ]]; then
              echo "Prompt 4 archive mismatch: expected ${CANDIDATE_SHA}, observed ${archive_head}" >&2
              exit 1
            fi
          elif [[ "${archive_status}" -eq 2 ]]; then
            printf '%s NOT_YET_CREATED ABSENT\n' "${P4_ARCHIVE}"               > "${p4_archive_log}"
          else
            echo "Prompt 4 archive query failed with status ${archive_status}." >&2
            exit "${archive_status}"
          fi
          cat "${p4_archive_log}"

          test -f "${record}"
          mutable=(
            'agent/afp-pure-math-p4-sharp-barriers-extremal-synthesis 94aebf6578a43516cce4bb7c042fc57681c93890'
            'agent/afp-pure-math-p4-integration-record 83bf04b99a060658b0177f3373ea0869cb4f3447'
          )
          mutable_log="${dir}/mutable-reference-observations.log"
          printf 'ref initial observed classification record_rows\n' > "${mutable_log}"
          mutable_query_failed=0
          for item in "${mutable[@]}"; do
            read -r ref initial <<< "${item}"
            set +e
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            query_status=$?
            set -e
            if [[ "${query_status}" -eq 0 ]]; then
              actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
              if [[ "${actual}" == "${initial}" ]]; then
                classification=UNCHANGED_SINCE_INITIAL_OBSERVATION
              else
                classification=MOVED_EXTERNALLY
              fi
            elif [[ "${query_status}" -eq 2 ]]; then
              actual=MISSING
              classification=MISSING
              mutable_query_failed=1
            else
              actual=QUERY_ERROR
              classification=QUERY_ERROR
              mutable_query_failed=1
            fi
            needle="| \`${ref}\` | \`${initial}\` |"
            record_rows=$(awk -v needle="${needle}"               'index($0, needle) { count++ } END { print count + 0 }' "${record}")
            if [[ "${record_rows}" -ne 1 ]]; then
              echo "Mutable observation is not represented exactly once: ${ref}" >&2
              mutable_query_failed=1
            fi
            printf '%s %s %s %s %s\n'               "${ref}" "${initial}" "${actual}" "${classification}"               "${record_rows}" >> "${mutable_log}"
            if [[ "${classification}" == MOVED_EXTERNALLY ]]; then
              echo "reference branch moved externally; candidate ancestry and source integrity remain valid: ${ref}"                 >> "${mutable_log}"
            fi
          done
          cat "${mutable_log}"
          if [[ "${mutable_query_failed}" -ne 0 ]]; then
            echo 'A mutable branch required for the observation audit was missing/unreadable, or its ledger row was invalid.' >&2
            exit 1
          fi

          {
            echo "candidate=${CANDIDATE_SHA}"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "prompt3_baseline=${P3_BASE_COMMIT}"
            echo "prompt3_baseline_tree=${P3_BASE_TREE}"
            echo "prompt2=${P2_COMMIT}"
            echo "prompt3_mathematical=${P3_MATH_COMMIT}"
            echo 'old_prompt4_ancestry=absent'
            echo 'post_baseline_merge_commits=absent'
          } | tee "${dir}/provenance.log"

      - name: Enforce Prompt 4 allowlist and preserve the verified baseline
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-exact"
          mkdir -p "${dir}"
          python - "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}" <<'PY' \
            2>&1 | tee "${dir}/scope-validation.log"
          import os
          from pathlib import PurePosixPath
          import subprocess
          import sys

          base, candidate = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-prompt4-from-p3-sharp-barriers.yml",
              "afp_barrier_gate1/AFPBarrier.lean",
              "afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean",
              "afp_barrier_gate1/AFPBarrier/SharpProductBarriers.lean",
              "afp_barrier_gate1/pure_math/barriers/SHARP_PRODUCT_GRAPH_BARRIERS.md",
              "afp_barrier_gate1/pure_math/barriers/prompt4_sharp_barrier_audit.py",
              "afp_barrier_gate1/pure_math/barriers/P4_SALVAGE_LEDGER.md",
              "afp_barrier_gate1/pure_math/barriers/P4_APPROACH_REGISTRY.md",
              "afp_barrier_gate1/pure_math/barriers/P4_THEOREM_REGISTRY.md",
              "afp_barrier_gate1/pure_math/FINAL_PURE_MATH_THEOREM_PACKAGE.md",
              "afp_barrier_gate1/pure_math/README.md",
              "afp_barrier_gate1/docs/P4_THEOREM_TO_FILE_MAP.md",
              "afp_barrier_gate1/docs/P4_FINALIZATION_RECORD.md",
              "afp_barrier_gate1/docs/P4_STAGE_REPORT.md",
              "afp_barrier_gate1/docs/PURE_MATH_ASSUMPTIONS_TABLE.md",
              "afp_barrier_gate1/docs/PURE_MATH_COUNTEREXAMPLE_CATALOGUE.md",
              "afp_barrier_gate1/docs/PURE_MATH_MANUSCRIPT_ABSTRACT.md",
              "afp_barrier_gate1/docs/CLAIM_MATRIX.md",
              "afp_barrier_gate1/docs/CONJECTURE_REGISTER.md",
              "afp_barrier_gate1/docs/PURE_MATH_PRIOR_ART_MAP.md",
              "afp_barrier_gate1/docs/THEOREM_TO_FILE_MAP.md",
          }

          raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", base, candidate,
          ])
          changed = [os.fsdecode(item) for item in raw.split(b"\0") if item]
          failures: list[str] = []
          outside = sorted(set(changed) - allowed)
          missing = sorted(allowed - set(changed))
          failures.extend(f"outside Prompt 4 allowlist: {path!r}" for path in outside)
          failures.extend(f"required Prompt 4 path unchanged/missing: {path!r}" for path in missing)

          tree_raw = subprocess.check_output(["git", "ls-tree", "-r", "-z", candidate])
          tree: dict[str, tuple[str, str]] = {}
          for entry in tree_raw.split(b"\0"):
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, object_type, _sha = metadata.decode("ascii").split()
              path = os.fsdecode(raw_path)
              tree[path] = (mode, object_type)
              parts = PurePosixPath(path).parts
              basename = parts[-1].lower() if parts else ""
              if (
                  "__pycache__" in parts
                  or basename.endswith((".pyc", ".pyo", ".b64", ".jsonl", ".log"))
                  or basename in {"plantri", "plantri.exe", "plantri.c"}
              ):
                  failures.append(f"forbidden tracked generated file: {path!r}")

          for path in sorted(allowed):
              entry = tree.get(path)
              if entry != ("100644", "blob"):
                  failures.append(
                      f"required Prompt 4 path is not a regular 100644 blob: "
                      f"{path!r} observed={entry!r}"
                  )

          numstat = subprocess.check_output([
              "git", "diff", "--no-renames", "--numstat", "-z", base, candidate,
          ])
          for record in numstat.split(b"\0"):
              if not record:
                  continue
              fields = record.split(b"\t", 2)
              if len(fields) != 3:
                  failures.append(f"malformed numstat record: {record!r}")
                  continue
              added, deleted, raw_path = fields
              if added == b"-" or deleted == b"-":
                  failures.append(f"binary change forbidden: {os.fsdecode(raw_path)!r}")

          def show(commit: str, path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{commit}:{path}"], text=True
              )

          aggregate_path = "afp_barrier_gate1/AFPBarrier.lean"
          aggregate_base = show(base, aggregate_path)
          aggregate_expected = aggregate_base.replace(
              "import AFPBarrier.QEqualityCovariance\n",
              "import AFPBarrier.QEqualityCovariance\n"
              "import AFPBarrier.SharpProductBarriers\n",
              1,
          )
          if show(candidate, aggregate_path) != aggregate_expected:
              failures.append("aggregate import differs from the exact one-line extension")

          audit_path = "afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean"
          audit_base = show(base, audit_path)
          audit_expected = audit_base.replace(
              "import AFPBarrier.QEqualityCovariance\n",
              "import AFPBarrier.QEqualityCovariance\n"
              "import AFPBarrier.SharpProductBarriers\n",
              1,
          )
          audit_expected += "\n".join([
              "",
              "/-! Prompt 4: sharp product barriers, extremal algebra, and incidence. -/",
              "",
              "#print axioms AFPBarrier.squarePolarQualityFromStep",
              "#print axioms AFPBarrier.squarePolarQualityFromStep_formula",
              "#print axioms AFPBarrier.squarePolar_rates_forced",
              "#print axioms AFPBarrier.squarePolar_totalRate_forced",
              "#print axioms AFPBarrier.squarePolar_forced_quartic_lower",
              "#print axioms AFPBarrier.cscSquaredTruncation",
              "#print axioms AFPBarrier.squarePolarRateMainStep",
              "#print axioms AFPBarrier.cscSquaredTruncation_rate_identity",
              "#print axioms AFPBarrier.squarePolarRateMainStep_grid",
              "#print axioms AFPBarrier.squarePolarQualityMainStep",
              "#print axioms AFPBarrier.squarePolarQualityMainStep_grid",
              "#print axioms AFPBarrier.universal_rate_lower_of_defect_upper",
              "#print axioms AFPBarrier.finiteExtremal_defect_lower",
              "#print axioms AFPBarrier.projectiveQuality_from_fixedMoment",
              "#print axioms AFPBarrier.twoLossWeightedQuality_sub_one",
              "#print axioms AFPBarrier.twoLossQuality_sub_one",
              "#print axioms AFPBarrier.biregular_interRing_incidence",
              "#print axioms AFPBarrier.perfectMatching_ringCounts_eq",
          ]) + "\n"
          if show(candidate, audit_path) != audit_expected:
              failures.append("focused axiom audit differs from the exact P4-only extension")

          if failures:
              print("Prompt 4 scope and baseline preservation: FAIL", file=sys.stderr)
              for failure in failures:
                  print(f"  {failure}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Prompt 4 scope and baseline preservation: PASS ({len(changed)} paths)")
          for path in changed:
              print(path)
          PY

          git diff --quiet --no-ext-diff             "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}" --             afp_barrier_gate1/AFPBarrier             ':(exclude)afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean'             ':(exclude)afp_barrier_gate1/AFPBarrier/SharpProductBarriers.lean'
          git diff --check "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}"
          {
            echo "baseline_tree=${P3_BASE_TREE}"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo 'closed_prompt1_prompt2_prompt3_modules=PRESERVED'
            echo 'aggregate_extension=EXACT'
            echo 'focused_axiom_extension=EXACT'
          } | tee "${dir}/source-preservation.log"

      - name: Set up deterministic Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p4-exact"
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' 'mpmath==1.3.0' \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/python-dependencies.log"
          {
            python --version
            python -c 'import numpy, sympy, mpmath; print("numpy", numpy.__version__); print("sympy", sympy.__version__); print("mpmath", mpmath.__version__)'
          } | tee "${RUNNER_TEMP}/p4-exact/python-toolchain.log"

      - name: Compile pure-math Python
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p4-pycache"
          python -m compileall -q pure_math \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/python-compile.log"

      - name: Run retained Prompt 1 and Prompt 2 regressions
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p4-pycache"
          python pure_math/falsification/claim_falsification_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p1-claim-falsification.log"
          python pure_math/covariance/quadratic_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p1-covariance.log"
          python pure_math/examples/exact_local_global_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p1-local-global.log"
          python pure_math/tests/test_spherical_feasibility.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p1-spherical-feasibility.log"
          python pure_math/covariance/exact_quadratic_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p2-exact-covariance.log"
          python pure_math/covariance/exact_signed_restoration_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p2-signed-restoration.log"
          python pure_math/covariance/exact_d3_invariance_counterexample.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p2-d3-invariance.log"
          python pure_math/spectral_products/exact_spectral_product_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p2-spectral-products.log"

      - name: Run source-pinned Plantri hostile census
        shell: bash
        working-directory: afp_barrier_gate1
        env:
          P3_REQUIRE_PLANTRI: '1'
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p4-pycache"
          catalog="${RUNNER_TEMP}/p4-exact/triangulations-through-12.jsonl"
          python pure_math/rigidity/triangulation_counterexample_audit.py \
            --require-plantri --catalog "${catalog}" \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/triangulation-audit.log"
          test "$(wc -l < "${catalog}")" -eq 9150

      - name: Run Prompt 3 quantitative and covariance audits
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p4-pycache"
          python pure_math/rigidity/global_near_rigidity_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/global-near-rigidity.log"
          python pure_math/rigidity/q1_covariance_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/q1-covariance.log"

      - name: Run Prompt 4 sharp-barrier, extremal, and anisotropy audit
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p4-pycache"
          python pure_math/barriers/prompt4_sharp_barrier_audit.py \
            2>&1 | tee "${RUNNER_TEMP}/p4-exact/p4-sharp-barriers.log"
          grep -Fq 'Prompt 4 exact audit: PASS' \
            "${RUNNER_TEMP}/p4-exact/p4-sharp-barriers.log"

      - name: Verify exact-regression checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo 'Exact-regression checkout remains clean.' \
            | tee "${RUNNER_TEMP}/p4-exact/checkout-clean.log"

      - name: Hash exact-regression records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-exact"
          mkdir -p "${dir}"
          {
            echo 'AFP Prompt 4 exact regressions'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p4-exact-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0 \
              | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload exact-regression records
        if: always()
        id: upload-exact
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt4-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p4-exact
          if-no-files-found: error

      - name: Record exact-regression artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo '### Prompt 4 exact-regression artifact'
            echo "artifact_id=${{ steps.upload-exact.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-exact.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-exact.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      artifact-id: ${{ steps.upload-lean.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-lean.outputs.artifact-digest }}
      source-sha256: ${{ steps.pack-source.outputs.source-sha256 }}
      lean-jobs: ${{ steps.pack-source.outputs.lean-jobs }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Recheck pinned Prompt 3 baseline and closed ancestors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P3_BASE_COMMIT}^{tree}")" = "${P3_BASE_TREE}"
          test "$(git rev-parse "${P2_COMMIT}^{tree}")" = "${P2_TREE}"
          test "$(git rev-parse "${P3_MATH_COMMIT}^{tree}")" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"
          mkdir -p "${RUNNER_TEMP}/p4-lean"
          {
            echo "candidate=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "prompt3_baseline=${P3_BASE_COMMIT}"
            echo "prompt3_baseline_tree=${P3_BASE_TREE}"
            echo "prompt2=${P2_COMMIT}"
            echo "prompt3_mathematical_candidate=${P3_MATH_COMMIT}"
          } | tee "${RUNNER_TEMP}/p4-lean/provenance.log"

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Record Lean toolchain
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          {
            lean --version
            lake --version
            echo "toolchain=$(cat lean-toolchain)"
          } | tee "${RUNNER_TEMP}/p4-lean/toolchain.log"

      - name: Install source-policy scanner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep \
            2>&1 | tee "${RUNNER_TEMP}/p4-lean/ripgrep-install.log"
          rg --version | tee "${RUNNER_TEMP}/p4-lean/ripgrep-version.log"

      - name: Resolve pinned dependencies and cache
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake update 2>&1 | tee "${RUNNER_TEMP}/p4-lean/lake-update.log"
          lake exe cache get 2>&1 | tee "${RUNNER_TEMP}/p4-lean/mathlib-cache.log"

      - name: Build pinned Lean package
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake build 2>&1 | tee "${RUNNER_TEMP}/p4-lean/lean-build.log"

      - name: Run focused axiom audit
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          lake env lean AFPBarrier/PureMathAxiomAudit.lean \
            2>&1 | tee "${RUNNER_TEMP}/p4-lean/axiom-audit.log"
          if grep -n 'sorryAx' "${RUNNER_TEMP}/p4-lean/axiom-audit.log"; then
            echo "A Prompt 4 accepted declaration depends on Lean's sorry axiom." >&2
            exit 1
          else
            grep_status=$?
            if [[ "${grep_status}" -ne 1 ]]; then
              echo "Axiom-log scan failed with status ${grep_status}." >&2
              exit "${grep_status}"
            fi
          fi

      - name: Reject placeholders and user axioms
        shell: bash
        working-directory: afp_barrier_gate1
        run: |
          set -euo pipefail
          if placeholder_matches=$(rg --glob '*.lean' \
              '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
              AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${placeholder_matches}"
            echo 'Lean proof placeholder found.' >&2
            exit 1
          else
            scan_status=$?
            if [[ "${scan_status}" -ne 1 ]]; then
              echo "Placeholder scan failed with status ${scan_status}." >&2
              exit "${scan_status}"
            fi
          fi
          if axiom_matches=$(rg --glob '*.lean' \
              '^[[:space:]]*((private|protected|noncomputable|unsafe|scoped)[[:space:]]+)*(axiom|axioms)([[:space:]]|$)' \
              AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${axiom_matches}"
            echo 'User axiom declaration found.' >&2
            exit 1
          else
            scan_status=$?
            if [[ "${scan_status}" -ne 1 ]]; then
              echo "User-axiom scan failed with status ${scan_status}." >&2
              exit "${scan_status}"
            fi
          fi
          echo 'No placeholders or user axioms.' \
            | tee "${RUNNER_TEMP}/p4-lean/source-policy.log"

      - name: Verify Lean checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short)"
          echo 'Lean checkout remains clean.' \
            | tee "${RUNNER_TEMP}/p4-lean/checkout-clean.log"

      - name: Pack and hash exact source
        if: always()
        id: pack-source
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-lean"
          mkdir -p "${dir}"
          archive_name="afp-prompt4-source-${CANDIDATE_SHA}.tar.gz"
          archive="${dir}/${archive_name}"
          git archive --format=tar.gz --output="${archive}" "${CANDIDATE_SHA}" -- \
            .gitignore \
            .github/workflows/afp-prompt4-from-p3-sharp-barriers.yml \
            afp_barrier_gate1
          (
            cd "${dir}"
            sha256sum "${archive_name}" > "${archive_name}.sha256"
            sha256sum -c "${archive_name}.sha256"
          )
          if ! lean_jobs=$(grep -Eo '[0-9]+ jobs' "${dir}/lean-build.log" | tail -n 1); then
            echo 'Lean job count was not found in the build log.' >&2
            exit 1
          fi
          if [[ -z "${lean_jobs}" ]]; then
            echo 'Lean job count was empty.' >&2
            exit 1
          fi
          source_sha256=$(awk 'NR == 1 { print $1 }' \
            "${dir}/${archive_name}.sha256")
          test -n "${source_sha256}"
          echo "source-sha256=${source_sha256}" >> "${GITHUB_OUTPUT}"
          echo "lean-jobs=${lean_jobs}" >> "${GITHUB_OUTPUT}"
          {
            echo 'AFP Prompt 4 Lean kernel verification'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "toolchain=$(cat afp_barrier_gate1/lean-toolchain)"
            echo "lean_build=${lean_jobs}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p4-lean-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0 \
              | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload Lean records and exact source
        if: always()
        id: upload-lean
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt4-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p4-lean
          if-no-files-found: error

      - name: Record Lean artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo '### Prompt 4 Lean/source artifact'
            echo "artifact_id=${{ steps.upload-lean.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-lean.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-lean.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  final-candidate-integrity:
    name: final-candidate-integrity
    needs:
      - exact-regressions
      - lean-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate for final integrity audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact candidate, prerequisites, ancestry, scope, and remote bindings
        shell: bash
        env:
          EXACT_RESULT: ${{ needs.exact-regressions.result }}
          LEAN_RESULT: ${{ needs.lean-kernel.result }}
          EXACT_ARTIFACT_ID: ${{ needs.exact-regressions.outputs.artifact-id }}
          EXACT_ARTIFACT_DIGEST: ${{ needs.exact-regressions.outputs.artifact-digest }}
          LEAN_ARTIFACT_ID: ${{ needs.lean-kernel.outputs.artifact-id }}
          LEAN_ARTIFACT_DIGEST: ${{ needs.lean-kernel.outputs.artifact-digest }}
          SOURCE_SHA256: ${{ needs.lean-kernel.outputs.source-sha256 }}
          LEAN_JOBS: ${{ needs.lean-kernel.outputs.lean-jobs }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-final-state"
          mkdir -p "${dir}"
          gate_log="${dir}/final-gate.log"
          {
            echo "exact_regressions=${EXACT_RESULT}"
            echo "lean_kernel=${LEAN_RESULT}"
            echo "exact_artifact_id=${EXACT_ARTIFACT_ID}"
            echo "exact_artifact_digest=${EXACT_ARTIFACT_DIGEST}"
            echo "lean_artifact_id=${LEAN_ARTIFACT_ID}"
            echo "lean_artifact_digest=${LEAN_ARTIFACT_DIGEST}"
            echo "source_tar_sha256=${SOURCE_SHA256}"
            echo "lean_build=${LEAN_JOBS}"
          } > "${gate_log}"
          test "${EXACT_RESULT}" = success
          test "${LEAN_RESULT}" = success
          test -n "${EXACT_ARTIFACT_ID}"
          [[ "${EXACT_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          test -n "${LEAN_ARTIFACT_ID}"
          [[ "${LEAN_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "${SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LEAN_JOBS}" =~ ^[0-9]+[[:space:]]jobs$ ]]

          candidate_head=$(git rev-parse HEAD)
          candidate_tree=$(git rev-parse HEAD^{tree})
          test "${candidate_head}" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P3_BASE_COMMIT}^{tree}")" = "${P3_BASE_TREE}"
          test "$(git rev-parse "${P2_COMMIT}^{tree}")" = "${P2_TREE}"
          test "$(git rev-parse "${P3_MATH_COMMIT}^{tree}")" = "${P3_MATH_TREE}"
          git merge-base --is-ancestor "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P2_COMMIT}" "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P3_MATH_COMMIT}" "${CANDIDATE_SHA}"

          for old in "${OLD_P4_BASE}" "${OLD_P4_IMPLEMENTATION}" "${OLD_P4_MERGE}"; do
            git cat-file -e "${old}^{commit}"
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Old Prompt 4 commit entered final ancestry: ${old}" >&2
              exit 1
            fi
          done
          while IFS= read -r old; do
            [[ -n "${old}" ]] || continue
            if git merge-base --is-ancestor "${old}" "${CANDIDATE_SHA}"; then
              echo "Old Prompt 4 implementation-range commit entered final ancestry: ${old}" >&2
              exit 1
            fi
          done < <(git rev-list "${OLD_P4_BASE}..${OLD_P4_IMPLEMENTATION}")
          test -z "$(git rev-list --merges "${P3_BASE_COMMIT}..${CANDIDATE_SHA}")"

          python - "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}" <<'PY' \
            2>&1 | tee "${dir}/final-scope.log"
          import os
          import subprocess
          import sys

          base, candidate = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-prompt4-from-p3-sharp-barriers.yml",
              "afp_barrier_gate1/AFPBarrier.lean",
              "afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean",
              "afp_barrier_gate1/AFPBarrier/SharpProductBarriers.lean",
              "afp_barrier_gate1/pure_math/barriers/SHARP_PRODUCT_GRAPH_BARRIERS.md",
              "afp_barrier_gate1/pure_math/barriers/prompt4_sharp_barrier_audit.py",
              "afp_barrier_gate1/pure_math/barriers/P4_SALVAGE_LEDGER.md",
              "afp_barrier_gate1/pure_math/barriers/P4_APPROACH_REGISTRY.md",
              "afp_barrier_gate1/pure_math/barriers/P4_THEOREM_REGISTRY.md",
              "afp_barrier_gate1/pure_math/FINAL_PURE_MATH_THEOREM_PACKAGE.md",
              "afp_barrier_gate1/pure_math/README.md",
              "afp_barrier_gate1/docs/P4_THEOREM_TO_FILE_MAP.md",
              "afp_barrier_gate1/docs/P4_FINALIZATION_RECORD.md",
              "afp_barrier_gate1/docs/P4_STAGE_REPORT.md",
              "afp_barrier_gate1/docs/PURE_MATH_ASSUMPTIONS_TABLE.md",
              "afp_barrier_gate1/docs/PURE_MATH_COUNTEREXAMPLE_CATALOGUE.md",
              "afp_barrier_gate1/docs/PURE_MATH_MANUSCRIPT_ABSTRACT.md",
              "afp_barrier_gate1/docs/CLAIM_MATRIX.md",
              "afp_barrier_gate1/docs/CONJECTURE_REGISTER.md",
              "afp_barrier_gate1/docs/PURE_MATH_PRIOR_ART_MAP.md",
              "afp_barrier_gate1/docs/THEOREM_TO_FILE_MAP.md",
          }
          raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", base, candidate,
          ])
          changed = {os.fsdecode(path) for path in raw.split(b"\0") if path}
          if changed != allowed:
              for path in sorted(changed - allowed):
                  print(f"outside final allowlist: {path}", file=sys.stderr)
              for path in sorted(allowed - changed):
                  print(f"required final path missing: {path}", file=sys.stderr)
              raise SystemExit(1)
          for path in sorted(allowed):
              line = subprocess.check_output([
                  "git", "ls-tree", candidate, "--", path,
              ], text=True).strip()
              if not line.startswith("100644 blob "):
                  print(f"non-regular final path: {path}: {line!r}", file=sys.stderr)
                  raise SystemExit(1)
          print(f"final Prompt 4 allowlist: PASS ({len(changed)} paths)")
          PY

          git diff --quiet --no-ext-diff             "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}" --             afp_barrier_gate1/AFPBarrier             ':(exclude)afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean'             ':(exclude)afp_barrier_gate1/AFPBarrier/SharpProductBarriers.lean'
          git diff --check "${P3_BASE_COMMIT}" "${CANDIDATE_SHA}"

          query_exact_ref() {
            local ref=$1 expected=$2 output actual
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
            printf '%s %s %s EXACT\n' "${ref}" "${expected}" "${actual}"               >> "${dir}/immutable-remote-bindings.log"
            test "${actual}" = "${expected}"
          }
          printf 'ref expected observed result\n' > "${dir}/immutable-remote-bindings.log"
          query_exact_ref "${P4_BRANCH}" "${CANDIDATE_SHA}"
          query_exact_ref "${P3_ARCHIVE}" "${P3_BASE_COMMIT}"
          query_exact_ref "${P2_ARCHIVE}" "${P2_COMMIT}"
          query_exact_ref "${TRANSPORT_ARCHIVE}" "${TRANSPORT_COMMIT}"
          cat "${dir}/immutable-remote-bindings.log" | tee -a "${gate_log}"

          set +e
          archive_output=$(git ls-remote --exit-code --heads origin             "refs/heads/${P4_ARCHIVE}")
          archive_status=$?
          set -e
          if [[ "${archive_status}" -eq 0 ]]; then
            archive_head=$(awk 'NR == 1 { print $1 }' <<< "${archive_output}")
            classification=PRESENT_EXACT
            test "${archive_head}" = "${CANDIDATE_SHA}"
          elif [[ "${archive_status}" -eq 2 ]]; then
            archive_head=NOT_YET_CREATED
            classification=ABSENT_BEFORE_CREATION
          else
            echo "Prompt 4 archive query failed with status ${archive_status}." >&2
            exit "${archive_status}"
          fi
          printf '%s %s %s\n' "${P4_ARCHIVE}" "${archive_head}"             "${classification}" > "${dir}/prompt4-archive-observation.log"
          cat "${dir}/prompt4-archive-observation.log" | tee -a "${gate_log}"

          mutable=(
            'agent/afp-pure-math-p4-sharp-barriers-extremal-synthesis 94aebf6578a43516cce4bb7c042fc57681c93890'
            'agent/afp-pure-math-p4-integration-record 83bf04b99a060658b0177f3373ea0869cb4f3447'
          )
          mutable_log="${dir}/mutable-reference-observations.log"
          printf 'ref initial observed classification\n' > "${mutable_log}"
          for item in "${mutable[@]}"; do
            read -r ref initial <<< "${item}"
            set +e
            output=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              actual=$(awk 'NR == 1 { print $1 }' <<< "${output}")
              if [[ "${actual}" == "${initial}" ]]; then
                result=UNCHANGED_SINCE_INITIAL_OBSERVATION
              else
                result=MOVED_EXTERNALLY
              fi
            elif [[ "${status}" -eq 2 ]]; then
              actual=MISSING
              result=MISSING
            else
              actual=QUERY_ERROR
              result=QUERY_ERROR
            fi
            printf '%s %s %s %s\n' "${ref}" "${initial}" "${actual}"               "${result}" >> "${mutable_log}"
            if [[ "${result}" == MOVED_EXTERNALLY ]]; then
              echo "reference branch moved externally; candidate ancestry and source integrity remain valid: ${ref}"                 >> "${mutable_log}"
            fi
            if [[ "${result}" == MISSING || "${result}" == QUERY_ERROR ]]; then
              echo "Mutable reference required for observation audit is unavailable: ${ref}" >&2
              exit 1
            fi
          done
          cat "${mutable_log}" | tee -a "${gate_log}"

          {
            echo "candidate_expected=${CANDIDATE_SHA}"
            echo "candidate_observed=${candidate_head}"
            echo "candidate_tree=${candidate_tree}"
            echo "prompt3_baseline=${P3_BASE_COMMIT}"
            echo "prompt3_baseline_tree=${P3_BASE_TREE}"
            echo 'old_prompt4_ancestry=absent'
            echo 'closed_prompt1_prompt2_prompt3_modules=preserved'
          } >> "${gate_log}"
          git diff --check
          test -z "$(git status --short)"
          echo 'Prompt 4 final candidate integrity: PASS' | tee -a "${gate_log}"

      - name: Capture workflow job identities
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/"
              f"{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          )
          request = Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['ACTIONS_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request) as response:
              payload = json.load(response)
          expected = {"exact-regressions", "lean-kernel", "final-candidate-integrity"}
          selected = {}
          for job in payload.get("jobs", []):
              if job.get("name") in expected:
                  selected[job["name"]] = {
                      "id": job["id"],
                      "name": job["name"],
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "run_attempt": job.get("run_attempt"),
                  }
          missing = expected - set(selected)
          if missing:
              raise SystemExit(f"workflow job identities missing: {sorted(missing)}")
          out = Path(os.environ["RUNNER_TEMP"]) / "p4-final-state"
          out.mkdir(parents=True, exist_ok=True)
          (out / "workflow-jobs.json").write_text(
              json.dumps(selected, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with (out / "workflow-job-identities.txt").open("w", encoding="utf-8") as handle:
              for name in sorted(selected):
                  job = selected[name]
                  handle.write(
                      f"{name} id={job['id']} status={job['status']} "
                      f"conclusion={job['conclusion']}\n"
                  )
          PY
          cat "${RUNNER_TEMP}/p4-final-state/workflow-job-identities.txt"

      - name: Hash final-state evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/p4-final-state"
          mkdir -p "${dir}"
          {
            echo 'AFP Prompt 4 final candidate integrity'
            echo "commit=${CANDIDATE_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${dir}/p4-final-state-report.txt"
          (
            cd "${dir}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0               | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload final candidate-integrity evidence
        if: always()
        id: upload-final-state
        uses: actions/upload-artifact@v4
        with:
          name: afp-p4-final-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p4-final-state
          if-no-files-found: error

      - name: Materialize the resolved finalization record
        shell: bash
        env:
          EXACT_ARTIFACT_ID: ${{ needs.exact-regressions.outputs.artifact-id }}
          EXACT_ARTIFACT_DIGEST: ${{ needs.exact-regressions.outputs.artifact-digest }}
          LEAN_ARTIFACT_ID: ${{ needs.lean-kernel.outputs.artifact-id }}
          LEAN_ARTIFACT_DIGEST: ${{ needs.lean-kernel.outputs.artifact-digest }}
          SOURCE_SHA256: ${{ needs.lean-kernel.outputs.source-sha256 }}
          LEAN_JOBS: ${{ needs.lean-kernel.outputs.lean-jobs }}
          FINAL_ARTIFACT_ID: ${{ steps.upload-final-state.outputs.artifact-id }}
          FINAL_ARTIFACT_DIGEST: ${{ steps.upload-final-state.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          resolved="${RUNNER_TEMP}/p4-finalization-resolved"
          mkdir -p "${resolved}"
          cp afp_barrier_gate1/docs/P4_FINALIZATION_RECORD.md             "${resolved}/P4_FINALIZATION_RECORD.resolved.md"
          {
            echo
            echo '## Machine-resolved exact Prompt 4 values'
            echo
            echo 'The values below are generated from the exact tested checkout.'
            echo
            echo '~~~text'
            echo "final_prompt4_commit=${CANDIDATE_SHA}"
            echo "final_prompt4_tree=$(git rev-parse HEAD^{tree})"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo 'exact_regressions=success'
            echo "exact_artifact_id=${EXACT_ARTIFACT_ID}"
            echo "exact_artifact_digest=${EXACT_ARTIFACT_DIGEST}"
            echo 'lean_kernel=success'
            echo "lean_artifact_id=${LEAN_ARTIFACT_ID}"
            echo "lean_artifact_digest=${LEAN_ARTIFACT_DIGEST}"
            echo "lean_build=${LEAN_JOBS}"
            echo 'focused_axiom_audit=only_propext_Classical.choice_Quot.sound'
            echo 'placeholders=absent'
            echo 'user_axioms=absent'
            echo "exact_source_tar_sha256=${SOURCE_SHA256}"
            echo 'final_candidate_integrity=success'
            echo "final_state_artifact_id=${FINAL_ARTIFACT_ID}"
            echo "final_state_artifact_digest=${FINAL_ARTIFACT_DIGEST}"
            echo 'closed_prompt1_prompt2_prompt3_modules=PRESERVED'
            echo "prompt5_exact_baseline=${CANDIDATE_SHA}"
            echo '~~~'
            echo
            echo '### Exact deterministic conclusions'
            echo
            echo '~~~text'
            echo 'python_compile=success'
            echo 'prompt1_claim_falsification=success'
            echo 'prompt1_covariance=success'
            echo 'prompt1_local_global=success'
            echo 'prompt1_spherical_feasibility=success'
            echo 'prompt2_exact_covariance=success'
            echo 'prompt2_signed_restoration=success'
            echo 'prompt2_d3_invariance=success'
            echo 'prompt2_spectral_products=success'
            echo 'prompt3_plantri_counts=1,1,2,5,14,50,233,1249,7595'
            echo 'prompt3_plantri_total=9150'
            echo 'prompt3_global_near_rigidity=success'
            echo 'prompt3_q1_covariance=success'
            echo 'prompt4_sharp_barriers=success'
            echo '~~~'
            echo
            echo '### Workflow job identifiers at materialization time'
            echo
            echo '~~~text'
            cat "${RUNNER_TEMP}/p4-final-state/workflow-job-identities.txt"
            echo '~~~'
            echo
            echo '### Prompt 4 archive observation'
            echo
            echo '~~~text'
            cat "${RUNNER_TEMP}/p4-final-state/prompt4-archive-observation.log"
            echo '~~~'
          } >> "${resolved}/P4_FINALIZATION_RECORD.resolved.md"
          cp "${RUNNER_TEMP}/p4-final-state/mutable-reference-observations.log"             "${resolved}/mutable-reference-observations.log"
          cp "${RUNNER_TEMP}/p4-final-state/workflow-jobs.json"             "${resolved}/workflow-jobs.json"
          cp "${RUNNER_TEMP}/p4-final-state/immutable-remote-bindings.log"             "${resolved}/immutable-remote-bindings.log"
          (
            cd "${resolved}"
            find . -maxdepth 1 -type f ! -name 'records.sha256' -print0               | sort -z | xargs -0 sha256sum > records.sha256
          )

      - name: Upload resolved finalization record
        id: upload-resolution
        uses: actions/upload-artifact@v4
        with:
          name: afp-p4-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p4-finalization-resolved
          if-no-files-found: error

      - name: Record final artifact identities
        shell: bash
        run: |
          {
            echo '### Prompt 4 final candidate-integrity artifact'
            echo "artifact_id=${{ steps.upload-final-state.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-final-state.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-final-state.outputs.artifact-digest }}"
            echo
            echo '### Prompt 4 resolved finalization record'
            echo "artifact_id=${{ steps.upload-resolution.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload-resolution.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload-resolution.outputs.artifact-digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"
