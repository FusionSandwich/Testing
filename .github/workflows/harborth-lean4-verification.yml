name: Harborth Lean 4 verification

on:
  push:
    branches:
      - ci/harborth-lean4-verification-20260823
    paths:
      - 'harborth_ci/**'
      - '.github/workflows/harborth-lean4-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare diagnostics
        run: mkdir -p harborth_ci/ci-logs

      - name: Source audit
        shell: bash
        run: |
          set -o pipefail
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "toolchain=$(cat harborth_ci/lean-toolchain)"
            ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' harborth_ci/PlanarContactNumber harborth_ci/PlanarContactNumber.lean
            ! grep -RInE '^[[:space:]]*(axiom|opaque)[[:space:]]' harborth_ci/PlanarContactNumber harborth_ci/PlanarContactNumber.lean
          } 2>&1 | tee harborth_ci/ci-logs/source-audit.log

      - name: Install Elan
        shell: bash
        run: |
          set -o pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none 2>&1 | tee harborth_ci/ci-logs/elan-install.log
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve and cache mathlib
        working-directory: harborth_ci
        shell: bash
        run: |
          set -o pipefail
          lake update 2>&1 | tee ci-logs/lake-update.log
          lake exe cache get 2>&1 | tee ci-logs/cache-get.log

      - name: Build project
        working-directory: harborth_ci
        shell: bash
        run: |
          set -o pipefail
          lean --version 2>&1 | tee ci-logs/lean-version.log
          lake build 2>&1 | tee ci-logs/lake-build.log

      - name: Audit theorem axioms
        working-directory: harborth_ci
        shell: bash
        run: |
          set -o pipefail
          lake env lean PlanarContactNumber/AxiomAudit.lean 2>&1 | tee ci-logs/axiom-audit.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harborth-lean4-${{ github.run_id }}-${{ github.run_attempt }}
          path: harborth_ci/ci-logs
          if-no-files-found: error
          retention-days: 30
