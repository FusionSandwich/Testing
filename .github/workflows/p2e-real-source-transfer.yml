name: P2E real source transfer

on:
  push:
    branches:
      - agent/p2e-real-source-transfer-2fb7a11b

permissions:
  contents: write

concurrency:
  group: p2e-real-source-transfer
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/afp-publication-p2e-benchmark-hierarchy-2fb7a11b
  TARGET_PARENT: 2fb7a11b75a9699a7afc8a2ee16c90656c58fb28
  PAYLOAD_B64_SHA256: b3ab71e2ab378bd79707e7880ce82bb1d84084bd00252cd32093c3a7a874f18c
  PAYLOAD_TAR_SHA256: 0b69a69d0b0b4256fffc0d81c36087bc1df1155504346f6746733d7a2e09392e
  INVENTORY_SHA256: 299de5a8f7b8425f61dc45edd540d1267b2d368eee67237483efd8a575cf83fc

jobs:
  materialize-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact payload
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2e-real-transfer"
          mkdir -p "${work}"
          cp .github/p2e-real-bootstrap/payload.part00 "${work}/payload.b64"
          test "$(sha256sum "${work}/payload.b64" | awk '{print $1}')" = "${PAYLOAD_B64_SHA256}"
          base64 --decode "${work}/payload.b64" > "${work}/payload.tar.gz"
          test "$(sha256sum "${work}/payload.tar.gz" | awk '{print $1}')" = "${PAYLOAD_TAR_SHA256}"
          tar -tzf "${work}/payload.tar.gz" | LC_ALL=C sort > "${work}/inventory.txt"
          test "$(sha256sum "${work}/inventory.txt" | awk '{print $1}')" = "${INVENTORY_SHA256}"

      - name: Publish exact source
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2e-real-transfer"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${TARGET_PARENT}"
          git switch --force-create "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          tar -xzf "${work}/payload.tar.gz"
          xargs -d '\n' git add -- < "${work}/inventory.txt"
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort > "${work}/changed.txt"
          test "$(sha256sum "${work}/changed.txt" | awk '{print $1}')" = "${INVENTORY_SHA256}"
          git config user.name FusionSandwich
          git config user.email 145234893+FusionSandwich@users.noreply.github.com
          git commit -m 'P2E: add preregistration benchmark harness'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
