name: AFP publication P2E held-out execution

on:
  push:
    branches:
      - agent/afp-publication-p2e-heldout-execution-df6f0e28
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  PREREG_SHA: df6f0e285cb176f183930815967e43c36166928a
  PREREG_ARCHIVE: archive/afp-publication-p2e-preregistered
  EXPECTED_MANIFEST_SHA: c947d2b0954210af640780ba35240d4271cf66c60e5bcd623f8bdb23725499db
  EXPECTED_REGISTRY_SHA: 0380a84199eae0818bc135c869a7dfa0a69a3c93bdfcd4ab95415f1922181fa8
  GIT_NO_REPLACE_OBJECTS: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  execute-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable preregistration lineage and one-path execution scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-list --count --merges "${PREREG_SHA}..HEAD")" -eq 0
          test "$(git rev-list --count "${PREREG_SHA}..HEAD")" -eq 1
          git merge-base --is-ancestor "${PREREG_SHA}" HEAD
          test "$(git diff --name-only "${PREREG_SHA}" HEAD)" = '.github/workflows/afp-publication-p2e-heldout-execution.yml'
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${PREREG_ARCHIVE}" | awk 'NR==1 {print $1}')" = "${PREREG_SHA}"
          git diff --check "${PREREG_SHA}" HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('afp_barrier_gate1/pure_math/benchmarking')
          manifest = json.loads((root / 'P2E_BENCHMARK_MANIFEST.json').read_text())
          registry = json.loads((root / 'P2E_FROZEN_OPERATOR_REGISTRY.json').read_text())
          assert manifest['status'] == 'PREREGISTERED_NO_HELDOUT_EXECUTED'
          assert manifest['scientific_sha256'] == 'c947d2b0954210af640780ba35240d4271cf66c60e5bcd623f8bdb23725499db'
          assert registry['scientific_sha256'] == '0380a84199eae0818bc135c869a7dfa0a69a3c93bdfcd4ab95415f1922181fa8'
          assert not Path('afp_barrier_gate1/benchmarks/p2e/heldout').exists()
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install frozen numerical stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'scipy==1.18.0' 'pytest==8.4.2' 'sympy==1.14.0'
          python -m pip freeze --all | sort > "${RUNNER_TEMP}/pip-freeze.txt"

      - name: Execute all held-out cases and ablations exactly once
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2e-heldout"; mkdir -p "${out}"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p2e-heldout-pycache"
          python -m compileall -q pure_math/benchmarking pure_math/tests/test_p2e_benchmarking.py
          python -m pytest -p no:cacheprovider -q -ra pure_math/tests/test_p2e_benchmarking.py | tee "${out}/pytest.log"
          /usr/bin/time -v python -m pure_math.benchmarking.runner heldout \
            --output "${out}/P2E_HELDOUT_RESULTS.json" \
            > "${out}/heldout.stdout.log" 2> "${out}/heldout.stderr.log"
          set +e
          python -m pure_math.benchmarking.audit "${out}/P2E_HELDOUT_RESULTS.json" \
            --output "${out}/P2E_HELDOUT_AUDIT.json" \
            > "${out}/audit.stdout.log" 2> "${out}/audit.stderr.log"
          audit_rc=$?
          set -e
          printf '%s\n' "${audit_rc}" > "${out}/audit-exit-code.txt"
          cp pure_math/benchmarking/P2E_BENCHMARK_MANIFEST.json "${out}/"
          cp pure_math/benchmarking/P2E_FROZEN_OPERATOR_REGISTRY.json "${out}/"
          cp "${RUNNER_TEMP}/pip-freeze.txt" "${out}/"

      - name: Audit completion separately from the preregistered value hypothesis
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p2e-heldout"
          python - "${out}" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          result = json.loads((out / 'P2E_HELDOUT_RESULTS.json').read_text())
          audit = json.loads((out / 'P2E_HELDOUT_AUDIT.json').read_text())
          rc = int((out / 'audit-exit-code.txt').read_text().strip())
          expected = [f'P2E-{i:02d}' for i in range(1, 8)]
          assert result['partition'] == 'heldout'
          assert [row['id'] for row in result['cases']] == expected
          assert result['manifest_sha256'] == 'c947d2b0954210af640780ba35240d4271cf66c60e5bcd623f8bdb23725499db'
          assert result['operator_registry_sha256'] == '0380a84199eae0818bc135c869a7dfa0a69a3c93bdfcd4ab95415f1922181fa8'
          checks = audit['checks']
          integrity = [
              'manifest_match', 'registry_match', 'case_inventory',
              'same_node_comparisons', 'same_space_energy',
              'complete_required_fields', 'invariant_gate', 'positivity_gate',
              'balance_gate', 'ablation_inventory', 'quadrature_ablation_separate',
              'signed_scope_honest', 'accelerator_inventory', 'accelerator_fixed_point',
          ]
          assert all(checks[key] for key in integrity), {key: checks[key] for key in integrity}
          value_keys = ['angular_value_gate', 'physical_value_gate', 'median_value_gate', 'worst_degradation_gate']
          assert all(key in checks for key in value_keys)
          assert (audit['status'] == 'PASS' and rc == 0) or (audit['status'] == 'FAIL' and rc != 0)
          status = {
              'schema': 'afp-p2e-heldout-execution-status-v1',
              'execution_complete': True,
              'integrity_checks_passed': True,
              'preregistered_value_hypothesis': audit['status'],
              'value_gates': {key: checks[key] for key in value_keys},
              'aggregate': result['aggregate'],
              'scientific_sha256': result['scientific_sha256'],
              'no_posthoc_tuning': True,
              'interpretation_rule': 'A failed value gate is retained as a scientific result and is not repaired by changing the frozen operator or threshold.'
          }
          (out / 'P2E_HELDOUT_EXECUTION_STATUS.json').write_text(
              json.dumps(status, indent=2, sort_keys=True, allow_nan=False) + '\n'
          )
          print(json.dumps(status, indent=2, sort_keys=True))
          print('P2E_HELDOUT_EXECUTION_COMPLETE')
          PY
          printf 'repository=%s\nhead=%s\nprereg=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${PREREG_SHA}" > "${out}/provenance.txt"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)
          git diff --check
          test -z "$(git status --short)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: afp-p2e-heldout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2e-heldout
          if-no-files-found: error
          retention-days: 90
