name: Harborth Lean CI mirror

on:
  push:
    branches:
      - agent/harborth-lean-ci-20260823
    paths:
      - 'harborth-ci/**'
      - '.github/workflows/harborth-ci.yml'
  pull_request:
    paths:
      - 'harborth-ci/**'
      - '.github/workflows/harborth-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: harborth-ci
        run: |
          lake update
          lake exe cache get
          lake build
      - name: Reject trust escapes
        run: |
          if grep -RInE --include='*.lean' '\b(sorry|admit|axiom|unsafe)\b' harborth-ci; then
            echo 'Forbidden Lean trust escape found.' >&2
            exit 1
          fi
      - name: Package portable Lean environment
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BIN="$HOME/.elan/bin/lean"
          TOOLCHAIN_DIR="$(dirname "$(dirname "$(readlink -f "$LEAN_BIN")")")"
          TOOLCHAIN_NAME="$(basename "$TOOLCHAIN_DIR")"
          mkdir -p /tmp/harborth-env/toolchains /tmp/harborth-env/project
          cp -a "$TOOLCHAIN_DIR" "/tmp/harborth-env/toolchains/$TOOLCHAIN_NAME"
          cp -a harborth-ci/.lake /tmp/harborth-env/project/.lake
          cp harborth-ci/lake-manifest.json /tmp/harborth-env/project/lake-manifest.json
          cp harborth-ci/lakefile.lean /tmp/harborth-env/project/lakefile.lean
          cp harborth-ci/lean-toolchain /tmp/harborth-env/project/lean-toolchain
          tar --use-compress-program='zstd -5 -T0' -cf /tmp/harborth-lean-env.tar.zst -C /tmp harborth-env
          ls -lh /tmp/harborth-lean-env.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: harborth-lean-env
          path: /tmp/harborth-lean-env.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
