name: Planar contact number Lean scratch CI

on:
  push:
    branches:
      - ci/planar-contact-lean4-20260823
  pull_request:
    branches:
      - testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_ci
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Resolve dependencies
        working-directory: lean_ci
        run: lake update
      - name: Download mathlib cache
        working-directory: lean_ci
        run: lake exe cache get
      - name: Build
        working-directory: lean_ci
        run: lake build
