name: P2D completion source transfer

on:
  push:
    branches:
      - agent/p2d-completion-source-transfer-2fb7a11b

permissions:
  contents: write

concurrency:
  group: p2d-completion-source-transfer
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/afp-publication-p2d-completion-2fb7a11b
  TARGET_PARENT: 2fb7a11b75a9699a7afc8a2ee16c90656c58fb28
  PAYLOAD_B64_SHA256: ce2d0ef0b1fa08d48f5ddafca280a07384b0ec78e4b917332baecad29b932632
  PAYLOAD_TAR_SHA256: 79aa3fb513a1e2ac72a6da26b348fd37f84d9e9428e758c3831e67e9b167b2c8

jobs:
  materialize-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact payload
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2d-completion-transfer"
          mkdir -p "${work}"
          cp .github/p2d-completion-bootstrap/payload.part00 "${work}/payload.b64"
          test "$(sha256sum "${work}/payload.b64" | awk '{print $1}')" = "${PAYLOAD_B64_SHA256}"
          base64 --decode "${work}/payload.b64" > "${work}/payload.tar.gz"
          test "$(sha256sum "${work}/payload.tar.gz" | awk '{print $1}')" = "${PAYLOAD_TAR_SHA256}"
          tar -tzf "${work}/payload.tar.gz" | LC_ALL=C sort > "${work}/inventory.txt"
          cat > "${work}/expected.txt" <<'EOF'
          afp_barrier_gate1/pure_math/acceleration/__init__.py
          afp_barrier_gate1/pure_math/acceleration/audit.py
          afp_barrier_gate1/pure_math/acceleration/core.py
          afp_barrier_gate1/pure_math/acceleration/p2d_frozen_operators.json
          afp_barrier_gate1/pure_math/acceleration/transport.py
          afp_barrier_gate1/pure_math/tests/test_p2d_acceleration.py
          docs/publication_program/P2D_ACCELERATION_PRECONDITIONER.md
          docs/publication_program/P2D_APPROACH_REGISTRY.md
          docs/publication_program/P2D_CLAIM_MAP.md
          docs/publication_program/P2D_CLAUSE_MATRIX.md
          docs/publication_program/P2D_PRIOR_ART_AND_HOSTILE_AUDIT.md
          docs/publication_program/P2D_STAGE_REPORT.md
          EOF
          LC_ALL=C sort -o "${work}/expected.txt" "${work}/expected.txt"
          diff -u "${work}/expected.txt" "${work}/inventory.txt"

      - name: Publish exact non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/p2d-completion-transfer"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${TARGET_PARENT}"
          git switch --force-create "${TARGET_BRANCH}" "refs/remotes/origin/${TARGET_BRANCH}"
          tar -xzf "${work}/payload.tar.gz"
          xargs -d '\n' git add -- < "${work}/expected.txt"
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort > "${work}/changed.txt"
          diff -u "${work}/expected.txt" "${work}/changed.txt"
          git config user.name FusionSandwich
          git config user.email 145234893+FusionSandwich@users.noreply.github.com
          git commit -m 'P2D: complete forward-peaked acceleration audit'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
