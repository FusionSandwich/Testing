name: Erdős 1084 Phase-I maximum and no-isolated theorem

on:
  pull_request:
    branches: [testing]
    paths:
      - 'erdos1084/formal/Erdos1084/ContactNumberExistence.lean'
      - 'erdos1084/formal/Erdos1084/MaximizerNoIsolated.lean'
      - 'erdos1084/formal/Erdos1084/Phase1FoundationalInterfacesFinal.lean'
      - 'erdos1084/formal/Erdos1084ContactNumberExistence*.lean'
      - 'erdos1084/formal/Erdos1084MaximizerNoIsolated*.lean'
      - 'erdos1084/formal/Erdos1084Phase1FoundationalFinal*.lean'
      - '.github/workflows/erdos1084-phase1-maximizer.yml'
  push:
    branches:
      - 'agent/erdos-1084-phase1-contact-model-lean-20260819'
    paths:
      - 'erdos1084/formal/Erdos1084/ContactNumberExistence.lean'
      - 'erdos1084/formal/Erdos1084/MaximizerNoIsolated.lean'
      - 'erdos1084/formal/Erdos1084/Phase1FoundationalInterfacesFinal.lean'
      - 'erdos1084/formal/Erdos1084ContactNumberExistence*.lean'
      - 'erdos1084/formal/Erdos1084MaximizerNoIsolated*.lean'
      - 'erdos1084/formal/Erdos1084Phase1FoundationalFinal*.lean'
      - '.github/workflows/erdos1084-phase1-maximizer.yml'
  workflow_dispatch:

jobs:
  maximizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders and project axioms
        run: |
          if grep -R --include='*.lean' -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' erdos1084/formal; then
            echo 'Lean placeholder found' >&2
            exit 1
          fi
          if grep -R --include='*.lean' -nE '^[[:space:]]*(axiom|constant)[[:space:]]+' erdos1084/formal/Erdos1084; then
            echo 'Project-specific axiom/constant declaration found' >&2
            exit 1
          fi
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        working-directory: erdos1084/formal
        run: |
          lake update
          lake exe cache get
          lake build
          lake env lean Erdos1084ContactNumberExistenceTests.lean
          lake env lean Erdos1084ContactNumberExistenceAxiomAudit.lean
          lake env lean Erdos1084MaximizerNoIsolatedTests.lean
          lake env lean Erdos1084MaximizerNoIsolatedAxiomAudit.lean
          lake env lean Erdos1084Phase1FoundationalFinalTests.lean
          lake env lean Erdos1084Phase1FoundationalFinalAxiomAudit.lean
