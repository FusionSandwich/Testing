name: Flagship paper exact publication release

on:
  push:
    branches:
      - agent/afp-publication-p1f-flagship-paper-4e461c10
      - archive/afp-publication-p1f-flagship-paper-verified
  pull_request:
    branches:
      - archive/afp-publication-p1e-asymptotic-family-verified
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  EXPECTED_REPOSITORY: FusionSandwich/Testing
  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P1F_BRANCH: agent/afp-publication-p1f-flagship-paper-4e461c10
  P1F_ARCHIVE: archive/afp-publication-p1f-flagship-paper-verified
  P1E_COMMIT: 4e461c10f069cd7eb4614e7d52b886637dff134b
  P1E_TREE: 2474126498a50b0315d0a6e5ab703f0717c00a79
  P1E_ARCHIVE: archive/afp-publication-p1e-asymptotic-family-verified
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  paper-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact paper head, scope, ancestry, and archives
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"; mkdir -p "${out}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            test "${GITHUB_HEAD_REF}" = "${P1F_BRANCH}"
            test "${GITHUB_BASE_REF}" = "${P1E_ARCHIVE}"
            test "${PR_HEAD_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P1E_COMMIT}^{tree}")" = "${P1E_TREE}"
          git merge-base --is-ancestor "${P1E_COMMIT}" "${CANDIDATE_SHA}"
          test "$(git rev-list --count --merges "${P1E_COMMIT}..${CANDIDATE_SHA}")" -eq 0
          python - "${P1E_COMMIT}" "${CANDIDATE_SHA}" <<'PY' | tee "${out}/scope.log"
          import os, subprocess, sys
          base, head = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-publication-p1f-flagship-paper.yml",
              "docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md",
              "docs/publication_program/p1f_manuscript/FORMAL_AND_RELEASE_AUDIT.md",
              "docs/publication_program/p1f_manuscript/P1F_REPRODUCIBILITY_MANIFEST.md",
              "docs/publication_program/p1f_manuscript/P1F_STAGE_REPORT.md",
              "docs/publication_program/p1f_manuscript/PRIORITY_AND_HOSTILE_REFEREE_AUDIT.md",
              "docs/publication_program/p1f_manuscript/PROSE_OVERCLAIM_AUDIT.md",
              "docs/publication_program/p1f_manuscript/SAMPLING_ALIAS_EQUALITY_HOSTILE_REFEREE_REPORT.md",
              "docs/publication_program/p1f_manuscript/build_flagship_paper.py",
              "docs/publication_program/p1f_manuscript/paper_header.tex",
              "docs/publication_program/p1f_manuscript/priority_sources.bib",
              "docs/publication_program/p1f_manuscript/proof_dependency_graph.png",
              "docs/publication_program/p1f_manuscript/table_layout.lua",
              "output/pdf/FLAGSHIP_MANUSCRIPT.pdf",
          }
          raw = subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-only", "-z", base, head]
          )
          changed = {os.fsdecode(p) for p in raw.split(b"\0") if p}
          if changed != allowed:
              raise SystemExit(
                  f"P1F scope mismatch; missing={sorted(allowed-changed)} "
                  f"outside={sorted(changed-allowed)}"
              )
          for path in sorted(changed):
              row = subprocess.check_output(
                  ["git", "ls-tree", head, "--", path], text=True
              ).strip()
              if not row.startswith("100644 blob "):
                  raise SystemExit(f"not a regular blob: {path}: {row!r}")
          print(f"P1F allowlist PASS: {len(changed)} paths")
          PY
          git diff --check "${P1E_COMMIT}" "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P1F_BRANCH}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P1E_ARCHIVE}" | awk 'NR==1 {print $1}')" = "${P1E_COMMIT}"
          set +e
          archive_line=$(git ls-remote --exit-code --heads origin "refs/heads/${P1F_ARCHIVE}"); archive_status=$?
          set -e
          if [[ ${archive_status} -eq 0 ]]; then
            archive_head=$(awk 'NR==1 {print $1}' <<<"${archive_line}")
            test "${archive_head}" = "${CANDIDATE_SHA}"
            echo "${P1F_ARCHIVE} ${archive_head} PRESENT_EXACT" | tee "${out}/archive.log"
          elif [[ ${archive_status} -eq 2 && "${GITHUB_REF}" != "refs/heads/${P1F_ARCHIVE}" ]]; then
            echo "${P1F_ARCHIVE} ABSENT_BEFORE_CREATE_ONLY_FREEZE" | tee "${out}/archive.log"
          else
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install publication and exact-audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            lmodern pandoc poppler-utils ripgrep texlive-xetex texlive-latex-extra | tee "${out}/apt.log"
          python -m pip install --disable-pip-version-check --no-input \
            'matplotlib==3.10.8' 'numpy==2.3.2' 'sympy==1.14.0' 'mpmath==1.3.0' | tee "${out}/pip.log"
          pandoc --version | head -n 2 | tee "${out}/pandoc-version.log"
          xelatex --version | head -n 1 | tee "${out}/xelatex-version.log"
          pdftotext -v 2>&1 | head -n 1 | tee "${out}/poppler-version.log"
      - name: Audit manuscript, priority boundary, and source map
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"
          paper=docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md
          bib=docs/publication_program/p1f_manuscript/priority_sources.bib
          test "$(head -n 1 "${paper}")" = '# A sharp positivity--rate frontier for quadratic fidelity of reversible spherical generators'
          ! sed -n '1,90p' "${paper}" | rg -i '\bAFP\b'
          ! rg 'P1E_SHORT_GAP_S2_CANDIDATE_THEOREM|STATUS_PENDING|construction[^\n]*BLOCKED' "${paper}"
          for heading in \
            '## Abstract' \
            '## 1. Introduction' \
            '## Appendix A. Proof dependency graph' \
            '## Appendix B. Theorem-to-source-to-test-to-registry map' \
            '## Appendix C. Numerical and falsification protocol' \
            '## Appendix D. Formalization' \
            '## Appendix E. Reproducibility record' \
            '## Appendix F. Limitations and future work' \
            '## Appendix G. Related-theorem and hypothesis-transfer matrix'; do
            rg -Fxq "${heading}" "${paper}"
          done
          python - "${paper}" "${bib}" docs/publication_program/p1f_manuscript/P1F_REPRODUCIBILITY_MANIFEST.md <<'PY' | tee "${out}/citation-map.log"
          import hashlib, re, sys
          paper = open(sys.argv[1], encoding="utf-8").read()
          bib = open(sys.argv[2], encoding="utf-8").read()
          manifest = open(sys.argv[3], encoding="utf-8").read()
          cited = set(re.findall(r"@([A-Za-z0-9_:.+-]+)", paper))
          records = set(re.findall(r"^@[A-Za-z]+\{([^,]+),", bib, re.M))
          if cited != records:
              raise SystemExit(f"citation mismatch: uncited={sorted(records-cited)} missing={sorted(cited-records)}")
          required = {
              "P1A-QUOT", "P1A-2DEF", "P1B-SHARP", "P1B-EQUALITY",
              "P1C-LOCAL", "P1C-GLOBAL", "P1D-MASTER", "P1D-QUOTIENT",
              "P1E-POLYGON", "P1E-RING", "P1E-ROW", "F-CONSTRUCT",
          }
          missing = sorted(x for x in required if x not in paper)
          if missing:
              raise SystemExit(f"source-map registry keys missing: {missing}")
          root = "docs/publication_program/p1f_manuscript/"
          hashed = {
              "FLAGSHIP_MANUSCRIPT.md": root + "FLAGSHIP_MANUSCRIPT.md",
              "priority_sources.bib": root + "priority_sources.bib",
              "proof_dependency_graph.png": root + "proof_dependency_graph.png",
              "output/pdf/FLAGSHIP_MANUSCRIPT.pdf": "output/pdf/FLAGSHIP_MANUSCRIPT.pdf",
          }
          for label, path in hashed.items():
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              if f"| `{label}` | `{digest}` |" not in manifest:
                  raise SystemExit(f"manifest hash mismatch for {label}: {digest}")
          print(f"citation keys EXACT: {len(cited)}; source-map keys and manifest hashes EXACT")
          PY
          pandoc "${paper}" --from=markdown --standalone --citeproc --bibliography="${bib}" -t native -o /dev/null 2>"${out}/pandoc-warnings.log"
          test ! -s "${out}/pandoc-warnings.log"
      - name: Rebuild and inspect the publication PDF
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"
          pdf=output/pdf/FLAGSHIP_MANUSCRIPT.pdf
          figure=docs/publication_program/p1f_manuscript/proof_dependency_graph.png
          cp "${pdf}" "${out}/committed.pdf"
          cp "${figure}" "${out}/committed-figure.png"
          pdftotext "${out}/committed.pdf" "${out}/committed.txt"
          python docs/publication_program/p1f_manuscript/build_flagship_paper.py | tee "${out}/build.log"
          cmp "${out}/committed-figure.png" "${figure}"
          pdfinfo "${pdf}" | tee "${out}/pdfinfo.log"
          pdftotext "${pdf}" "${out}/rebuilt.txt"
          python - "${out}/committed.txt" "${out}/rebuilt.txt" <<'PY'
          import sys
          old = open(sys.argv[1], encoding="utf-8", errors="replace").read().split()
          new = open(sys.argv[2], encoding="utf-8", errors="replace").read().split()
          if old != new:
              raise SystemExit("committed and rebuilt PDF text token streams differ")
          print(f"rebuilt PDF text EXACT: {len(new)} tokens")
          PY
          pages=$(pdfinfo "${pdf}" | awk '/^Pages:/ {print $2}')
          test "${pages}" -ge 20 && test "${pages}" -le 30
          grep -Fq 'Title:           A sharp positivity--rate frontier for quadratic fidelity of reversible spherical generators' "${out}/pdfinfo.log"
          ! rg '\[@|Citation|P1E_SHORT_GAP_S2_CANDIDATE|mermaid' "${out}/rebuilt.txt"
          rg -Fq 'Izmestiev' "${out}/rebuilt.txt"
          rg -Fq 'Benedetto' "${out}/rebuilt.txt"
          sha256sum "${out}/committed.pdf" | tee "${out}/committed-pdf.sha256"
          sha256sum "${out}/committed-figure.png" | tee "${out}/committed-figure.sha256"
          git restore -- "${pdf}" "${figure}"
          rm -rf tmp/pdfs/p1f-build
          test -z "$(git status --short)"
      - name: Run accepted P1A through P1E deterministic audits
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p1f-pycache"
          python pure_math/covariance/p1a_quadratic_fidelity_audit.py | tee "${out}/p1a.log"
          grep -Fxq 'P1A exact quadratic-fidelity audit: PASS' "${out}/p1a.log"
          python pure_math/covariance/p1b_sharp_quadratic_defect_audit.py | tee "${out}/p1b.log"
          grep -Fxq 'P1B sharp quadratic-defect audit: PASS' "${out}/p1b.log"
          python pure_math/covariance/p1c_equality_geometry_audit.py | tee "${out}/p1c.log"
          grep -Fxq 'P1C exact equality-geometry audit: PASS' "${out}/p1c.log"
          python pure_math/covariance/p1d_quantitative_stability_audit.py | tee "${out}/p1d.log"
          grep -Fxq 'P1D quantitative stability audit: PASS' "${out}/p1d.log"
          python pure_math/covariance/p1e_short_gap_symbolic_matrix_audit.py | tee "${out}/p1e-symbolic.log"
          grep -Fxq 'short-gap literal symbolic matrix-to-limit audit: PASS' "${out}/p1e-symbolic.log"
          python pure_math/covariance/p1e_short_gap_cauchy_guard_audit.py | tee "${out}/p1e-cauchy.log"
          grep -Fxq 'short-gap rational Cauchy all-orders guard: PASS' "${out}/p1e-cauchy.log"
          python pure_math/covariance/p1e_short_gap_cauchy_hostile_audit.py | tee "${out}/p1e-hostile.log"
          grep -Fxq 'short-gap hostile Cauchy/first-row audit: ACCEPT' "${out}/p1e-hostile.log"
          python pure_math/covariance/p1e_short_gap_polar_guard_audit.py | tee "${out}/p1e-polar.log"
          grep -Fxq 'short-gap first-polar-row Cauchy guard: PASS' "${out}/p1e-polar.log"
          python pure_math/covariance/p1e_short_gap_proof_audit.py | tee "${out}/p1e-proof.log"
          grep -Fxq 'short-gap exact algebra audit: PASS (remainder is certified by the Cauchy guard audit)' "${out}/p1e-proof.log"
          python pure_math/covariance/p1e_no_guard_ring_independent_audit.py | tee "${out}/p1e-independent.log"
          grep -Fxq 'no-guard ring independent audit: exact regressions PASS' "${out}/p1e-independent.log"
          python pure_math/covariance/p1e_short_gap_referee_audit.py | tee "${out}/p1e-referee.log"
          grep -Fxq 'short-gap hostile referee audit: rejected-mutation regressions PASS' "${out}/p1e-referee.log"
          python pure_math/covariance/p1e_asymptotic_family_audit.py | tee "${out}/p1e-polygon.log"
          grep -Fxq 'closed-form all-level polygon identities: PASS' "${out}/p1e-polygon.log"
          git diff --check
          test -z "$(git status --short)"
      - name: Hash paper release records
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-paper"
          printf 'commit=%s\ntree=%s\nrun=%s\nattempt=%s\nbase=%s\n' \
            "${CANDIDATE_SHA}" "$(git rev-parse HEAD^{tree})" "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" "${P1E_COMMIT}" > "${out}/report.txt"
          sha256sum output/pdf/FLAGSHIP_MANUSCRIPT.pdf \
            docs/publication_program/p1f_manuscript/FLAGSHIP_MANUSCRIPT.md \
            docs/publication_program/p1f_manuscript/priority_sources.bib \
            docs/publication_program/p1f_manuscript/proof_dependency_graph.png \
            > "${out}/release-files.sha256"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: flagship-paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/pdf/FLAGSHIP_MANUSCRIPT.pdf
            ${{ runner.temp }}/p1f-paper
          if-no-files-found: error

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact Lean source base
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P1E_COMMIT}^{tree}")" = "${P1E_TREE}"
          git merge-base --is-ancestor "${P1E_COMMIT}" "${CANDIDATE_SHA}"
          test -z "$(git diff --name-only "${P1E_COMMIT}" "${CANDIDATE_SHA}" -- 'afp_barrier_gate1/*.lean' 'afp_barrier_gate1/AFPBarrier/*.lean')"
          mkdir -p "${RUNNER_TEMP}/p1f-lean"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Rebuild aggregate and audit public axioms
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1f-lean"
          lean --version | tee "${out}/lean-version.log"
          lake --version | tee "${out}/lake-version.log"
          lake update | tee "${out}/lake-update.log"
          lake exe cache get | tee "${out}/cache.log"
          lake build | tee "${out}/lean-build.log"
          lake env lean AFPBarrier/QuadraticFidelityConstruction.lean | tee "${out}/construction.log"
          lake env lean AFPBarrier/AxiomAudit.lean | tee "${out}/all-axioms.log"
          lake env lean AFPBarrier/PureMathAxiomAudit.lean | tee "${out}/pure-axioms.log"
          python - "${out}/pure-axioms.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          groups = re.findall(r"depends on axioms:\s*\[(.*?)\]", text, re.S)
          if not groups:
              raise SystemExit("focused axiom audit produced no records")
          observed = {x.strip() for group in groups for x in group.split(",") if x.strip()}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          if observed != allowed:
              raise SystemExit(f"unexpected axioms: {sorted(observed)}")
          print("focused axiom dependency set: EXACT", sorted(observed))
          PY
          git diff --check
          test -z "$(git status --short)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: flagship-paper-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1f-lean
          if-no-files-found: error

  final-release-integrity:
    needs: [paper-and-regressions, lean-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Recheck immutable release state
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.paper-and-regressions.result }}" = success
          test "${{ needs.lean-kernel.result }}" = success
          test -n "${{ needs.paper-and-regressions.outputs.artifact-id }}"
          test -n "${{ needs.paper-and-regressions.outputs.artifact-digest }}"
          test -n "${{ needs.lean-kernel.outputs.artifact-id }}"
          test -n "${{ needs.lean-kernel.outputs.artifact-digest }}"
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P1F_BRANCH}" | awk 'NR==1 {print $1}')" = "${CANDIDATE_SHA}"
          test "$(git ls-remote --exit-code --heads origin "refs/heads/${P1E_ARCHIVE}" | awk 'NR==1 {print $1}')" = "${P1E_COMMIT}"
          test -s output/pdf/FLAGSHIP_MANUSCRIPT.pdf
          git diff --check "${P1E_COMMIT}" "${CANDIDATE_SHA}"
          test -z "$(git status --short)"
      - name: Report release candidate
        run: |
          printf '%s\n' \
            "flagship_commit=${CANDIDATE_SHA}" \
            "flagship_tree=$(git rev-parse HEAD^{tree})" \
            "p1e_base=${P1E_COMMIT}" \
            "paper_artifact=${{ needs.paper-and-regressions.outputs.artifact-id }}" \
            "paper_digest=${{ needs.paper-and-regressions.outputs.artifact-digest }}" \
            "lean_artifact=${{ needs.lean-kernel.outputs.artifact-id }}" \
            "lean_digest=${{ needs.lean-kernel.outputs.artifact-digest }}"
