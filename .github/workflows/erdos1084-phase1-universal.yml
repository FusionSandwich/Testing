name: Erdős 1084 universal Phase-I theorem

on:
  pull_request:
    branches: [testing]
    paths:
      - 'erdos1084/formal/Erdos1084/Phase1UniversalTheorem.lean'
      - 'erdos1084/formal/Erdos1084Phase1Universal*.lean'
      - '.github/workflows/erdos1084-phase1-universal.yml'
  push:
    branches:
      - 'agent/erdos-1084-phase1-contact-model-lean-20260819'
  workflow_dispatch:

jobs:
  universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders and project axioms
        run: |
          if grep -R --include='*.lean' -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' erdos1084/formal; then exit 1; fi
          if grep -R --include='*.lean' -nE '^[[:space:]]*(axiom|constant)[[:space:]]+' erdos1084/formal/Erdos1084; then exit 1; fi
      - name: Install Elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit universal theorem
        working-directory: erdos1084/formal
        run: |
          lake update
          lake exe cache get
          lake build Erdos1084.Phase1UniversalTheorem
          lake env lean Erdos1084Phase1UniversalTests.lean
          lake env lean Erdos1084Phase1UniversalAxiomAudit.lean
