name: AFP publication P1A quadratic foundation

on:
  push:
    branches:
      - agent/afp-publication-p1a-quadratic-foundation-b40ee289
      - archive/afp-publication-p1a-quadratic-foundation-verified
  pull_request:
    branches:
      - archive/afp-publication-program-baseline-p0-6bac46ce
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  EXPECTED_REPOSITORY: FusionSandwich/Testing
  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  P1A_BRANCH: agent/afp-publication-p1a-quadratic-foundation-b40ee289
  P1A_ARCHIVE: archive/afp-publication-p1a-quadratic-foundation-verified
  P0_COMMIT: b40ee2898dbbfc206e1f079cc4df83f716e2f3b0
  P0_TREE: 3cf100f90d98bbc186b1df3e419c279b599b7d39
  P0_ARCHIVE: archive/afp-publication-program-baseline-p0-6bac46ce
  P4_COMMIT: 6bac46ce1a34ffba53f0003b876e57c4d747feaf
  P4_ARCHIVE: archive/afp-pure-math-p4-sharp-barriers-verified
  P3_COMMIT: 8de4b94835137d1eaf32c14b626424f87d2e176d
  P3_ARCHIVE: archive/afp-pure-math-p3-rigidity-verified
  P2_COMMIT: 31ea6a49f006df10ca633eafd6848ad43b51ac3f
  P2_ARCHIVE: archive/afp-pure-math-p2-quadratic-covariance-verified-31ea6a49
  P1_HISTORICAL_ARCHIVE: archive/afp-spherical-feasibility-validation-accepted
  P1_HISTORICAL_ARCHIVE_COMMIT: 01a592301978ab184fc7969d9f54592eddad742c
  TRANSPORT_COMMIT: 515f1aae6c20bd85711c90b5c1c21b4905252d01
  TRANSPORT_ARCHIVE: archive/afp-gate6-spatial-multigroup-verified
  GIT_NO_REPLACE_OBJECTS: '1'

jobs:
  exact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Verify exact P0 ancestry, P1A scope, and immutable refs
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-exact"
          mkdir -p "${out}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            test "${GITHUB_HEAD_REF}" = "${P1A_BRANCH}"
            test "${PR_HEAD_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P0_COMMIT}^{tree}")" = "${P0_TREE}"
          git merge-base --is-ancestor "${P0_COMMIT}" "${CANDIDATE_SHA}"
          merge_count=$(git rev-list --count --merges "${P0_COMMIT}..${CANDIDATE_SHA}")
          test "${merge_count}" -eq 0

          python - "${P0_COMMIT}" "${CANDIDATE_SHA}" <<'PY' | tee "${out}/scope.log"
          import os, subprocess, sys
          base, head = sys.argv[1:]
          allowed = {
              ".github/workflows/afp-publication-p1a-quadratic-foundation.yml",
              "afp_barrier_gate1/AFPBarrier.lean",
              "afp_barrier_gate1/AFPBarrier/PureMathAxiomAudit.lean",
              "afp_barrier_gate1/AFPBarrier/QuadraticFidelityFoundation.lean",
              "afp_barrier_gate1/pure_math/covariance/P1A_QUADRATIC_FIDELITY_FOUNDATION.md",
              "afp_barrier_gate1/pure_math/covariance/p1a_quadratic_fidelity_audit.py",
              "docs/publication_program/APPROACH_REGISTRY.md",
              "docs/publication_program/PAPER_BOUNDARY_MATRIX.md",
              "docs/publication_program/P1A_APPROACH_REGISTRY.md",
              "docs/publication_program/P1A_STAGE_REPORT.md",
              "docs/publication_program/PRIOR_ART_MATRIX.md",
              "docs/publication_program/THEOREM_REGISTRY.md",
              "docs/publication_program/VALUE_REGISTRY.md",
          }
          required = allowed
          raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", base, head
          ])
          changed = {os.fsdecode(p) for p in raw.split(b"\0") if p}
          outside = changed - allowed
          missing = required - changed
          if outside or missing:
              for path in sorted(outside):
                  print(f"outside P1A allowlist: {path}", file=sys.stderr)
              for path in sorted(missing):
                  print(f"required P1A path missing: {path}", file=sys.stderr)
              raise SystemExit(1)
          for path in sorted(changed):
              row = subprocess.check_output(
                  ["git", "ls-tree", head, "--", path], text=True
              ).strip()
              if not row.startswith("100644 blob "):
                  raise SystemExit(f"P1A path is not a regular blob: {path}: {row!r}")
              payload = subprocess.check_output(["git", "show", f"{head}:{path}"])
              if not payload:
                  raise SystemExit(f"empty P1A path: {path}")
              payload.decode("utf-8")
          print(f"P1A allowlist PASS: {len(changed)} paths")
          PY

          git diff --check "${P0_COMMIT}" "${CANDIDATE_SHA}"

          exact_ref() {
            local ref=$1 expected=$2 actual
            actual=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}" | awk 'NR==1 {print $1}')
            test "${actual}" = "${expected}"
            printf '%s %s %s EXACT\n' "${ref}" "${expected}" "${actual}" | tee -a "${out}/immutable-refs.log"
          }
          printf 'ref expected observed result\n' > "${out}/immutable-refs.log"
          exact_ref "${P1A_BRANCH}" "${CANDIDATE_SHA}"
          exact_ref "${P0_ARCHIVE}" "${P0_COMMIT}"
          exact_ref "${P1_HISTORICAL_ARCHIVE}" "${P1_HISTORICAL_ARCHIVE_COMMIT}"
          exact_ref "${P2_ARCHIVE}" "${P2_COMMIT}"
          exact_ref "${P3_ARCHIVE}" "${P3_COMMIT}"
          exact_ref "${P4_ARCHIVE}" "${P4_COMMIT}"
          exact_ref "${TRANSPORT_ARCHIVE}" "${TRANSPORT_COMMIT}"

          set +e
          archive_line=$(git ls-remote --exit-code --heads origin "refs/heads/${P1A_ARCHIVE}")
          archive_status=$?
          set -e
          if [[ ${archive_status} -eq 0 ]]; then
            archive_head=$(awk 'NR==1 {print $1}' <<<"${archive_line}")
            test "${archive_head}" = "${CANDIDATE_SHA}"
            echo "${P1A_ARCHIVE} ${archive_head} PRESENT_EXACT" > "${out}/p1a-archive.log"
          elif [[ ${archive_status} -eq 2 ]]; then
            if [[ "${GITHUB_REF}" = "refs/heads/${P1A_ARCHIVE}" ]]; then
              echo 'archive ref required for archive-ref verification' >&2
              exit 1
            fi
            echo "${P1A_ARCHIVE} NOT_YET_CREATED ABSENT" > "${out}/p1a-archive.log"
          else
            exit "${archive_status}"
          fi

          printf 'ref initial observed classification\n' > "${out}/mutable-refs.log"
          for item in \
            'agent/afp-publication-program-p0-6bac46ce b40ee2898dbbfc206e1f079cc4df83f716e2f3b0' \
            'agent/afp-pure-math-p0-m1 c8505a70df01320d18a443bbf2ed1c11a761e5ce' \
            'agent/afp-pure-math-final-integration-20260802 8e3d9d0526b8ce4ad53745f15d961e04ea51b392'; do
            read -r ref initial <<<"${item}"
            set +e
            line=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}")
            status=$?
            set -e
            if [[ ${status} -eq 0 ]]; then
              actual=$(awk 'NR==1 {print $1}' <<<"${line}")
              [[ "${actual}" = "${initial}" ]] && class=UNCHANGED_SINCE_INITIAL_OBSERVATION || class=MOVED_EXTERNALLY
            elif [[ ${status} -eq 2 ]]; then actual=MISSING; class=MISSING
            else actual=QUERY_ERROR; class=QUERY_ERROR
            fi
            printf '%s %s %s %s\n' "${ref}" "${initial}" "${actual}" "${class}" >> "${out}/mutable-refs.log"
          done
          cat "${out}/p1a-archive.log" "${out}/mutable-refs.log"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run P1A and every retained P1-P4 exact regression
        working-directory: afp_barrier_gate1
        shell: bash
        env:
          P3_REQUIRE_PLANTRI: '1'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-exact"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/p1a-pycache"
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' 'mpmath==1.3.0' | tee "${out}/dependencies.log"
          python -m compileall -q pure_math
          python pure_math/covariance/p1a_quadratic_fidelity_audit.py | tee "${out}/p1a.log"
          grep -Fxq 'fixtures=19' "${out}/p1a.log"
          grep -Fxq 'weighted-adjoint mutation: REJECTED' "${out}/p1a.log"
          grep -Fxq 'generator-sign mutation: REJECTED' "${out}/p1a.log"
          grep -Fxq 'non-invariant-compression mutation: REJECTED' "${out}/p1a.log"
          grep -Fxq 'sampling-quotient conflation mutation: REJECTED' "${out}/p1a.log"
          grep -Fxq 'P1A exact quadratic-fidelity audit: PASS' "${out}/p1a.log"
          python pure_math/falsification/claim_falsification_audit.py | tee "${out}/p1-falsification.log"
          python pure_math/covariance/quadratic_covariance_audit.py | tee "${out}/p1-covariance.log"
          python pure_math/examples/exact_local_global_audit.py | tee "${out}/p1-local-global.log"
          python pure_math/tests/test_spherical_feasibility.py | tee "${out}/p1-feasibility.log"
          python pure_math/covariance/exact_quadratic_covariance_audit.py | tee "${out}/p2-covariance.log"
          python pure_math/covariance/exact_signed_restoration_audit.py | tee "${out}/p2-signed.log"
          python pure_math/covariance/exact_d3_invariance_counterexample.py | tee "${out}/p2-d3.log"
          python pure_math/spectral_products/exact_spectral_product_audit.py | tee "${out}/p2-spectral.log"
          catalog="${out}/triangulations-through-12.jsonl"
          python pure_math/rigidity/triangulation_counterexample_audit.py \
            --require-plantri --catalog "${catalog}" | tee "${out}/p3-plantri.log"
          test "$(wc -l < "${catalog}")" -eq 9150
          python pure_math/rigidity/global_near_rigidity_audit.py | tee "${out}/p3-near.log"
          python pure_math/rigidity/q1_covariance_audit.py | tee "${out}/p3-covariance.log"
          python pure_math/barriers/prompt4_sharp_barrier_audit.py | tee "${out}/p4.log"
          grep -Fq 'Prompt 4 exact audit: PASS' "${out}/p4.log"
          git diff --check
          checkout_status=$(git status --short)
          test -z "${checkout_status}"

      - name: Hash exact records
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-exact"
          printf 'commit=%s\ntree=%s\nrun=%s\nattempt=%s\n' \
            "${CANDIDATE_SHA}" "$(git rev-parse HEAD^{tree})" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" \
            > "${out}/report.txt"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: afp-publication-p1a-exact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1a-exact
          if-no-files-found: error

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      source-sha256: ${{ steps.pack.outputs.source-sha256 }}
      lean-jobs: ${{ steps.pack.outputs.lean-jobs }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Recheck exact head and P0 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            test "${GITHUB_HEAD_REF}" = "${P1A_BRANCH}"
            test "${PR_HEAD_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test "$(git rev-parse "${P0_COMMIT}^{tree}")" = "${P0_TREE}"
          git merge-base --is-ancestor "${P0_COMMIT}" "${CANDIDATE_SHA}"
          branch_head=$(git ls-remote --exit-code --heads origin "refs/heads/${P1A_BRANCH}" | awk 'NR==1 {print $1}')
          test "${branch_head}" = "${CANDIDATE_SHA}"
          mkdir -p "${RUNNER_TEMP}/p1a-lean"
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Resolve, build, and audit Lean 4.30/Mathlib
        working-directory: afp_barrier_gate1
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-lean"
          lean --version | tee "${out}/lean-version.log"
          lake --version | tee "${out}/lake-version.log"
          lake update | tee "${out}/lake-update.log"
          lake exe cache get | tee "${out}/cache.log"
          lake build | tee "${out}/lean-build.log"
          lake env lean AFPBarrier/QuadraticFidelityFoundation.lean | tee "${out}/p1a-focused.log"
          lake env lean AFPBarrier/PureMathAxiomAudit.lean | tee "${out}/axiom-audit.log"
          python - "${out}/axiom-audit.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          groups = re.findall(r"depends on axioms:\s*\[(.*?)\]", text, re.S)
          if not groups:
              raise SystemExit("focused axiom audit produced no dependency records")
          observed = {item.strip() for group in groups for item in group.split(",") if item.strip()}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          if observed != allowed:
              raise SystemExit(f"expected exact allowed axioms {sorted(allowed)}, observed {sorted(observed)}")
          print("focused axiom dependency set: EXACT", sorted(observed))
          PY
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ripgrep
          if matches=$(rg --glob '*.lean' '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${matches}"; echo 'Lean placeholder found.' >&2; exit 1
          else
            status=$?; [[ ${status} -eq 1 ]] || exit "${status}"
          fi
          if matches=$(rg --glob '*.lean' '^[[:space:]]*(@\[[^]]*\][[:space:]]*)*((private|protected|noncomputable|unsafe|scoped|local)[[:space:]]+)*(axiom|axioms)([[:space:]]|$)' AFPBarrier AFPBarrier.lean); then
            printf '%s\n' "${matches}"; echo 'User axiom found.' >&2; exit 1
          else
            status=$?; [[ ${status} -eq 1 ]] || exit "${status}"
          fi
          if matches=$(rg '^[[:space:]]*(@\[[^]]*\][[:space:]]*)*((private|protected|noncomputable|unsafe|scoped|local)[[:space:]]+)*(constant|constants)([[:space:]]|$)' \
              AFPBarrier.lean AFPBarrier/PureMathAxiomAudit.lean \
              AFPBarrier/QuadraticFidelityFoundation.lean); then
            printf '%s\n' "${matches}"
            echo 'Project constant declaration found in the P1A Lean scope.' >&2
            exit 1
          else
            status=$?; [[ ${status} -eq 1 ]] || exit "${status}"
          fi
          git diff --check
          checkout_status=$(git status --short)
          test -z "${checkout_status}"

      - name: Pack exact source
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-lean"
          name="afp-publication-p1a-source-${CANDIDATE_SHA}.tar.gz"
          git archive --format=tar.gz --output="${out}/${name}" "${CANDIDATE_SHA}" -- \
            .gitignore .github/workflows/afp-publication-p1a-quadratic-foundation.yml \
            docs/publication_program afp_barrier_gate1
          sha256sum "${out}/${name}" > "${out}/${name}.sha256"
          jobs=$(grep -Eo '[0-9]+ jobs' "${out}/lean-build.log" | tail -n 1)
          test -n "${jobs}"
          digest=$(awk 'NR==1 {print $1}' "${out}/${name}.sha256")
          echo "lean-jobs=${jobs}" >> "${GITHUB_OUTPUT}"
          echo "source-sha256=${digest}" >> "${GITHUB_OUTPUT}"
          (cd "${out}" && find . -maxdepth 1 -type f ! -name records.sha256 -print0 | sort -z | xargs -0 sha256sum > records.sha256)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: afp-publication-p1a-lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1a-lean
          if-no-files-found: error

  final-candidate-integrity:
    needs: [exact-regressions, lean-kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Require both full gates and recheck exact remote state
        shell: bash
        env:
          EXACT_RESULT: ${{ needs.exact-regressions.result }}
          LEAN_RESULT: ${{ needs.lean-kernel.result }}
          EXACT_ID: ${{ needs.exact-regressions.outputs.artifact-id }}
          EXACT_DIGEST: ${{ needs.exact-regressions.outputs.artifact-digest }}
          LEAN_ID: ${{ needs.lean-kernel.outputs.artifact-id }}
          LEAN_DIGEST: ${{ needs.lean-kernel.outputs.artifact-digest }}
          SOURCE_SHA: ${{ needs.lean-kernel.outputs.source-sha256 }}
          LEAN_JOBS: ${{ needs.lean-kernel.outputs.lean-jobs }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p1a-final"
          mkdir -p "${out}"
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          if [[ "${GITHUB_EVENT_NAME}" = pull_request ]]; then
            test "${GITHUB_HEAD_REF}" = "${P1A_BRANCH}"
            test "${PR_HEAD_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          fi
          test "${EXACT_RESULT}" = success
          test "${LEAN_RESULT}" = success
          test -n "${EXACT_ID}"; [[ "${EXACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          test -n "${LEAN_ID}"; [[ "${LEAN_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LEAN_JOBS}" =~ ^[0-9]+[[:space:]]jobs$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git merge-base --is-ancestor "${P0_COMMIT}" "${CANDIDATE_SHA}"
          branch_head=$(git ls-remote --exit-code --heads origin "refs/heads/${P1A_BRANCH}" | awk 'NR==1 {print $1}')
          test "${branch_head}" = "${CANDIDATE_SHA}"
          immutable_log="${out}/immutable-heads.txt"
          printf 'ref expected observed result\n' > "${immutable_log}"
          for pair in \
            "${P0_ARCHIVE} ${P0_COMMIT}" \
            "${P1_HISTORICAL_ARCHIVE} ${P1_HISTORICAL_ARCHIVE_COMMIT}" \
            "${P2_ARCHIVE} ${P2_COMMIT}" \
            "${P3_ARCHIVE} ${P3_COMMIT}" \
            "${P4_ARCHIVE} ${P4_COMMIT}" \
            "${TRANSPORT_ARCHIVE} ${TRANSPORT_COMMIT}"; do
            read -r ref expected <<<"${pair}"
            actual=$(git ls-remote --exit-code --heads origin "refs/heads/${ref}" | awk 'NR==1 {print $1}')
            test "${actual}" = "${expected}"
            printf '%s %s %s EXACT\n' "${ref}" "${expected}" "${actual}" >> "${immutable_log}"
          done
          set +e
          archive_line=$(git ls-remote --exit-code --heads origin "refs/heads/${P1A_ARCHIVE}")
          archive_status=$?
          set -e
          if [[ ${archive_status} -eq 0 ]]; then
            archive_head=$(awk 'NR==1 {print $1}' <<<"${archive_line}")
            test "${archive_head}" = "${CANDIDATE_SHA}"
            archive=PRESENT_EXACT
          elif [[ ${archive_status} -eq 2 ]]; then
            if [[ "${GITHUB_REF}" = "refs/heads/${P1A_ARCHIVE}" ]]; then
              echo 'archive ref required for archive-ref verification' >&2
              exit 1
            fi
            archive_head=ABSENT
            archive=ABSENT_BEFORE_CREATE_ONLY_FREEZE
          else exit "${archive_status}"; fi
          cat > "${out}/resolved.txt" <<EOF
          commit=${CANDIDATE_SHA}
          tree=$(git rev-parse HEAD^{tree})
          workflow-blob=$(git rev-parse HEAD:.github/workflows/afp-publication-p1a-quadratic-foundation.yml)
          observed-at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          run=${GITHUB_RUN_ID}
          exact-regressions=${EXACT_RESULT}
          exact-artifact=${EXACT_ID}
          exact-digest=${EXACT_DIGEST}
          lean-kernel=${LEAN_RESULT}
          lean-artifact=${LEAN_ID}
          lean-digest=${LEAN_DIGEST}
          lean-build=${LEAN_JOBS}
          source-tar-sha256=${SOURCE_SHA}
          axiom-audit=only_propext_Classical.choice_Quot.sound
          p1a-fixtures=19
          retained-p1-p4=success
          plantri-total=9150
          p0-baseline=${P0_COMMIT}
          p0-tree=${P0_TREE}
          event=${GITHUB_EVENT_NAME}
          event-ref=${GITHUB_REF}
          p1a-branch-head=${branch_head}
          p1a-archive=${archive}
          p1a-archive-head=${archive_head}
          EOF
          cat "${immutable_log}" >> "${out}/resolved.txt"
          git diff --check
          checkout_status=$(git status --short)
          test -z "${checkout_status}"
          sha256sum "${out}/resolved.txt" > "${out}/records.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: afp-publication-p1a-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p1a-final
          if-no-files-found: error

      - name: Report final artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "final_artifact_id=${{ steps.upload.outputs.artifact-id }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "final_artifact_digest=${{ steps.upload.outputs.artifact-digest }}" >> "${GITHUB_STEP_SUMMARY}"
