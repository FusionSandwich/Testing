name: P2C exact source assembler

on:
  push:
    branches:
      - agent/afp-publication-p2c-completion-b34c29b1
    paths:
      - '.github/workflows/p2c-upload-assemble.yml'

permissions:
  contents: write

concurrency:
  group: p2c-exact-source-assembler
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/afp-publication-p2c-completion-b34c29b1

      - name: Reconstruct and verify exact sources
        shell: bash
        env:
          P2C_PARENT: b34c29b1b04f5293eaa4007b39d189efa03c51f5
          P2C_EXPECTED_TREE: c25da2ab59408dea279393fb62dbf684266518b4
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import subprocess

          specs = {
              '.github/workflows/afp-publication-p2c-codesign.yml': (
                  ['.p2c_upload/workflow.part00.b64'],
                  '65962ac770848ad91652965453e7642fc6b932da',
                  None,
              ),
              'afp_barrier_gate1/pure_math/codesign/families.py': (
                  ['.p2c_upload/families.part00.b64'],
                  'b12aa82e108d67328fdaae91171d698e86da2b5e',
                  None,
              ),
              'afp_barrier_gate1/pure_math/tests/test_p2c_codesign.py': (
                  ['.p2c_upload/tests.part00.b64'],
                  '8be088960b05ee517669af6a7a2b220ab5fa1d1c',
                  None,
              ),
              'docs/publication_program/P2C_QUADRATURE_GENERATOR_CODESIGN.md': (
                  [
                      '.p2c_upload/main_theorem.part00.b64',
                      '.p2c_upload/main_theorem.part01.b64',
                  ],
                  '22d4986b53ef1b1362739fae279f48670cf92dfd',
                  None,
              ),
              'docs/publication_program/THEOREM_REGISTRY.md': (
                  [
                      '.p2c_upload/theorem_registry.part00.b64',
                      '.p2c_upload/theorem_registry.tail00.b64',
                      '.p2c_upload/theorem_registry.tail01.b64',
                      '.p2c_upload/theorem_registry.tail02.b64',
                  ],
                  'b5473bd8b88818deb363b90f0b4ad29d62a6ef92',
                  (22356, 'cea44229140ad47c8d0c3e1938c236dd8dbbd3724309ae418e65199fdd1c18b9'),
              ),
          }

          for target, (parts, expected_blob, encoded_guard) in specs.items():
              encoded = ''.join(
                  ''.join(Path(part).read_text(encoding='ascii').split())
                  for part in parts
              )
              if encoded_guard is not None:
                  expected_length, expected_sha256 = encoded_guard
                  actual_sha256 = hashlib.sha256(encoded.encode('ascii')).hexdigest()
                  if len(encoded) != expected_length or actual_sha256 != expected_sha256:
                      raise SystemExit(
                          f'{target}: encoded payload mismatch '
                          f'length={len(encoded)} sha256={actual_sha256}'
                      )
              compressed = base64.b64decode(encoded, validate=True)
              raw = gzip.decompress(compressed)
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              actual = subprocess.check_output(
                  ['git', 'hash-object', target], text=True
              ).strip()
              if actual != expected_blob:
                  raise SystemExit(
                      f'{target}: blob mismatch {actual} != {expected_blob}'
                  )
              print(f'VERIFIED {target} {actual}')
          PY

          rm -rf .p2c_upload
          rm -f .github/workflows/p2c-upload-assemble.yml
          git add -A

          python - <<'PY'
          import os
          import subprocess

          parent = os.environ['P2C_PARENT']
          expected = sorted([
              '.github/workflows/afp-publication-p2c-codesign.yml',
              'afp_barrier_gate1/AFPBarrier.lean',
              'afp_barrier_gate1/AFPBarrier/P2CAxiomAudit.lean',
              'afp_barrier_gate1/AFPBarrier/QuadratureGeneratorCodesign.lean',
              'afp_barrier_gate1/pure_math/codesign/__init__.py',
              'afp_barrier_gate1/pure_math/codesign/audit.py',
              'afp_barrier_gate1/pure_math/codesign/families.py',
              'afp_barrier_gate1/pure_math/tests/test_p2c_codesign.py',
              'docs/publication_program/P2C_APPROACH_REGISTRY.md',
              'docs/publication_program/P2C_CLAIM_MAP.md',
              'docs/publication_program/P2C_CLAUSE_MATRIX.md',
              'docs/publication_program/P2C_FORMAL_AND_RELEASE_AUDIT.md',
              'docs/publication_program/P2C_INDEPENDENT_PROOF_AUDIT.md',
              'docs/publication_program/P2C_PRIOR_ART_AND_HOSTILE_AUDIT.md',
              'docs/publication_program/P2C_QUADRATURE_GENERATOR_CODESIGN.md',
              'docs/publication_program/P2C_STAGE_REPORT.md',
              'docs/publication_program/PAPER_BOUNDARY_MATRIX.md',
              'docs/publication_program/THEOREM_REGISTRY.md',
              'docs/publication_program/VALUE_REGISTRY.md',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', parent, '--'],
              text=True,
          ).splitlines()))
          if actual != expected:
              raise SystemExit(
                  'final path inventory mismatch:\n'
                  f'actual={actual}\nexpected={expected}'
              )
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          expected_tree = os.environ['P2C_EXPECTED_TREE']
          if tree != expected_tree:
              raise SystemExit(f'tree mismatch {tree} != {expected_tree}')
          print(f'VERIFIED_FINAL_TREE {tree}')
          PY

      - name: Commit exact assembled tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'P2C: assemble exact audited completion tree'
          git push origin HEAD:agent/afp-publication-p2c-completion-b34c29b1
