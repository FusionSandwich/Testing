name: AFP Prompt 2 completion

on:
  push:
    branches:
      - agent/afp-pure-math-p2-quadratic-covariance-completion
  pull_request:
    branches:
      - agent/afp-pure-math-p1-local-global-corrected
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: afp_barrier_gate1

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Enforce Prompt 2 scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          baseline=9cfacd0cb55b8f12f802beae86a4708f96ed7aa3
          test "$(git rev-parse "${baseline}^{tree}")" = \
            efeedbc492764a3ddc844ae7427961f84cbf4a6b
          test "$(git rev-parse "${baseline}^")" = \
            923dc47dae4f83dbea9cd56aa904164c6378e52d
          test "$(git rev-parse 923dc47dae4f83dbea9cd56aa904164c6378e52d^{tree})" = \
            906449c151fd97756a10fb83e7106a2e6ba39b0f
          git merge-base --is-ancestor "${baseline}" "${CANDIDATE_SHA}"
          changed="$(git diff --name-only "${baseline}" "${CANDIDATE_SHA}")"
          unexpected="$(awk '
            /^\.gitignore$/ { next }
            /^\.github\/workflows\/afp-prompt2-completion\.yml$/ { next }
            /^afp_barrier_gate1\/AFPBarrier\.lean$/ { next }
            /^afp_barrier_gate1\/AFPBarrier\/(PureMathAxiomAudit|QuadraticCovariance|QuadraticSampling|SpectralProductAlgebra|QuadraticSphereResidual|OneShellQuadraticRigidity|SpectralSamplingObstruction)\.lean$/ { next }
            /^afp_barrier_gate1\/pure_math\// { next }
            /^afp_barrier_gate1\/docs\/(CLAIM_MATRIX|CONJECTURE_REGISTER|PURE_MATH_PRIOR_ART_MAP|P2_THEOREM_TO_FILE_MAP|THEOREM_TO_FILE_MAP)\.md$/ { next }
            { print }
          ' <<< "${changed}")"
          if [[ -n "${unexpected}" ]]; then
            echo "Prompt 2 changed a path outside the pure-math allowlist:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          git diff --check "${baseline}" "${CANDIDATE_SHA}"
          echo "Prompt 2 scope is pure mathematics only." | tee p2-scope-audit.log

      - name: Set up deterministic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'numpy==2.3.2' 'sympy==1.14.0' \
            2>&1 | tee p2-python-dependencies.log
          {
            echo "commit=${CANDIDATE_SHA}"
            python --version
            python -c 'import numpy, sympy; print("numpy", numpy.__version__); print("sympy", sympy.__version__)'
          } | tee p2-python-toolchain.log

      - name: Compile pure-math Python
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q pure_math 2>&1 | tee p2-python-compile.log

      - name: Run saved Prompt 1 regressions
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/falsification/claim_falsification_audit.py \
            2>&1 | tee p2-claim-falsification.log
          python pure_math/covariance/quadratic_covariance_audit.py \
            2>&1 | tee p2-covariance-legacy.log
          python pure_math/examples/exact_local_global_audit.py \
            2>&1 | tee p2-local-global.log
          python pure_math/tests/test_spherical_feasibility.py \
            2>&1 | tee p2-spherical-feasibility.log

      - name: Run exact Prompt 2 regressions
        shell: bash
        run: |
          set -euo pipefail
          python pure_math/covariance/exact_quadratic_covariance_audit.py \
            2>&1 | tee p2-exact-covariance.log
          python pure_math/covariance/exact_signed_restoration_audit.py \
            2>&1 | tee p2-exact-signed-restoration.log
          python pure_math/covariance/exact_d3_invariance_counterexample.py \
            2>&1 | tee p2-exact-d3.log
          python pure_math/spectral_products/exact_spectral_product_audit.py \
            2>&1 | tee p2-exact-spectral.log

      - name: Verify exact-regression checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [[ -n "${status}" ]]; then
            echo "Exact regressions changed the candidate checkout:" >&2
            echo "${status}" >&2
            exit 1
          fi
          echo "Exact-regression checkout remains clean."

      - name: Write exact-regression report
        if: always()
        shell: bash
        run: |
          {
            echo "AFP Prompt 2 exact regressions"
            echo "commit=${CANDIDATE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > p2-exact-report.txt

      - name: Hash exact-regression records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum p2-*.log p2-exact-report.txt > p2-exact-records.sha256

      - name: Upload exact-regression records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt2-exact-${{ github.run_id }}
          path: |
            afp_barrier_gate1/p2-*.log
            afp_barrier_gate1/p2-exact-report.txt
            afp_barrier_gate1/p2-exact-records.sha256
          if-no-files-found: error

  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: afp_barrier_gate1

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Record Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${CANDIDATE_SHA}"
            lean --version
            lake --version
          } | tee p2-lean-toolchain.log

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update 2>&1 | tee p2-lake-update.log

      - name: Download Mathlib compiled cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee p2-mathlib-cache.log

      - name: Build Lean package
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee p2-lean-build.log

      - name: Run focused axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AFPBarrier/PureMathAxiomAudit.lean \
            2>&1 | tee p2-axiom-audit.log
          if grep -q 'sorryAx' p2-axiom-audit.log; then
            echo "A Prompt 2 theorem depends on Lean's sorry axiom." >&2
            exit 1
          fi

      - name: Reject placeholders and user axioms
        shell: bash
        run: |
          set -euo pipefail
          if rg --glob '*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
            AFPBarrier AFPBarrier.lean; then
            echo "Lean proof placeholder found." >&2
            exit 1
          fi
          if rg --glob '*.lean' \
            '^[[:space:]]*(axiom|axioms)([[:space:]]|$)' \
            AFPBarrier AFPBarrier.lean; then
            echo "User axiom declaration found." >&2
            exit 1
          fi
          echo "No placeholders or user axioms." | tee p2-source-audit.log

      - name: Verify Lean checkout cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [[ -n "${status}" ]]; then
            echo "Lean verification changed the candidate checkout:" >&2
            echo "${status}" >&2
            exit 1
          fi
          echo "Lean checkout remains clean."

      - name: Write Lean report
        if: always()
        shell: bash
        run: |
          {
            echo "AFP Prompt 2 Lean kernel verification"
            echo "commit=${CANDIDATE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "toolchain=$(cat lean-toolchain)"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > p2-lean-report.txt

      - name: Pack exact source snapshot
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output=afp-prompt2-source-${CANDIDATE_SHA}.tar.gz \
            "${CANDIDATE_SHA}" -- \
            .gitignore \
            afp_barrier_gate1 \
            .github/workflows/afp-prompt2-completion.yml
          sha256sum afp-prompt2-source-${CANDIDATE_SHA}.tar.gz \
            > afp-prompt2-source-${CANDIDATE_SHA}.tar.gz.sha256

      - name: Upload Lean records and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-prompt2-lean-${{ github.run_id }}
          path: |
            afp_barrier_gate1/p2-lean-report.txt
            afp_barrier_gate1/p2-lean-toolchain.log
            afp_barrier_gate1/p2-lake-update.log
            afp_barrier_gate1/p2-mathlib-cache.log
            afp_barrier_gate1/p2-lean-build.log
            afp_barrier_gate1/p2-axiom-audit.log
            afp_barrier_gate1/p2-source-audit.log
            afp_barrier_gate1/lake-manifest.json
            afp-prompt2-source-*.tar.gz
            afp-prompt2-source-*.tar.gz.sha256
          if-no-files-found: error
