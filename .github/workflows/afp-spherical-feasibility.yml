name: AFP spherical feasibility

on:
  push:
    branches:
      - agent/afp-spherical-feasibility-validation
      - agent/afp-pure-math-p0-m1
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run exact arithmetic regressions
        run: python3 afp_barrier_gate1/pure_math/tests/test_spherical_feasibility.py

      - name: Reject proof placeholders in stage modules
        shell: bash
        run: |
          files=(
            afp_barrier_gate1/AFPBarrier/LocalSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/SphericalFeasibilityAlgebra.lean
            afp_barrier_gate1/AFPBarrier/QuantitativeSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/GlobalSharedEdgeDuality.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx|axiom)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or user axiom found.' >&2
            exit 1
          fi

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Prepare pinned external checker
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          rm -rf _lean4export _nanoda_lib
          rm -f _nanoda_export.txt _nanoda_config.json

          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            source "$HOME/.cargo/env"
          fi

          # Pin the paired 2.0.0 exporter/checker format for reproducible
          # independent validation.
          git init _lean4export
          git -C _lean4export remote add origin \
            https://github.com/ammkrn/lean4export.git
          git -C _lean4export fetch --depth 1 origin \
            f3cf6458a309d643dc586a80f9ab5a93c2304db9
          git -C _lean4export checkout --detach FETCH_HEAD

          # Lean 4.30 let expressions contain a `nondep` bit, while export
          # format 2.0.0 does not serialize that bit. Canonicalize it to false
          # before hashing/export so semantically identical serialized nodes
          # cannot receive two exporter indices.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_lean4export/Export.lean")
          source = path.read_text(encoding="utf-8")
          old = "e.updateLet! (← removeMData d) (← removeMData v) (← removeMData b)"
          new = old + " false"
          if source.count(old) != 1:
              raise SystemExit("Unexpected Lean exporter let-expression source")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          grep -qF \
            'e.updateLet! (← removeMData d) (← removeMData v) (← removeMData b) false' \
            _lean4export/Export.lean

          cp lean-toolchain _lean4export/
          (
            cd _lean4export
            lake build
          )

          git init _nanoda_lib
          git -C _nanoda_lib remote add origin \
            https://github.com/ammkrn/nanoda_lib.git
          git -C _nanoda_lib fetch --depth 1 origin \
            e5438ac0a85a036b6dfe093aa457bc3448498014
          git -C _nanoda_lib checkout --detach FETCH_HEAD
          (
            cd _nanoda_lib
            cargo build --release
          )

      - name: Resolve dependencies and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake update
          lake exe cache get

      - name: Build Lean package explicitly
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake build

      - name: Independently type-check all spherical-stage declarations with nanoda
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1

          cleanup() {
            rm -rf _lean4export _nanoda_lib
            rm -f _nanoda_export.txt _nanoda_config.json
          }
          trap cleanup EXIT

          modules=(
            AFPBarrier.QuantitativeSphericalFeasibility
            AFPBarrier.GlobalSharedEdgeDuality
          )

          # Nanoda's Nat/String literal extensions require these foundational
          # declarations to be present even when the selected theorem slice
          # reaches them only through literal nodes.
          foundations=(
            Nat
            Nat.zero
            Nat.succ
            List
            List.nil
            List.cons
            String
            String.mk
            Char
            Char.ofNat
          )

          declarations=(
            AFPBarrier.scaledSphericalRowRate
            AFPBarrier.tangentDependenceWeight
            AFPBarrier.scaledSphericalRowRate_nonneg
            AFPBarrier.scaledSphericalRowRate_pos
            AFPBarrier.scaledSphericalRowRate_tangent_balance
            AFPBarrier.scaledSphericalRowRate_normal_balance
            AFPBarrier.tangentDependenceWeight_nonneg
            AFPBarrier.tangentDependenceWeight_balance
            AFPBarrier.tangentDependenceWeight_normal_scale
            AFPBarrier.tangentNormalScale
            AFPBarrier.tangentNormalScale_pos
            AFPBarrier.commonScale_eq_two_div
            AFPBarrier.commonScale_pos
            AFPBarrier.scaledSphericalRowRate_eq_commonScale
            AFPBarrier.antipodalTotalRate
            AFPBarrier.mixedNormalBudget_identity
            AFPBarrier.antipodalTotalRate_eq_of_mixedNormalBudget
            AFPBarrier.antipodalTotalRate_nonneg_iff
            AFPBarrier.antipodalTotalRate_pos_iff
            AFPBarrier.antipodalOnly_normalBalance_iff
            AFPBarrier.sphericalOutgoingRate
            AFPBarrier.sphericalOutgoingRate_nonneg
            AFPBarrier.normalBalance_lossUpper_crossBound
            AFPBarrier.normalBalance_lossLower_crossBound
            AFPBarrier.normalBalance_outgoingRate_lower
            AFPBarrier.normalBalance_outgoingRate_upper
            AFPBarrier.sharedEdgeDualWork
            AFPBarrier.sharedEdgeDualWork_swap
            AFPBarrier.sharedEdgeDualWork_constant
            AFPBarrier.sharedEdgeDualWork_radial
            AFPBarrier.sharedEdgeDualWork_radial_nonneg
            AFPBarrier.positiveLPDualSlack
            AFPBarrier.positiveLPDualSlack_nonneg
            AFPBarrier.positiveLP_objectiveGap_eq_slackPairing
            AFPBarrier.positiveLP_complementaritySum_eq_zero
            AFPBarrier.positiveLP_complementarySlackness
            AFPBarrier.positiveLP_active_forces_dualSaturation
            AFPBarrier.positiveLP_strictDualSlack_forces_inactive
          )

          echo "Exporting ${#declarations[@]} spherical-stage declarations"
          lake env _lean4export/.lake/build/bin/lean4export \
            "${modules[@]}" -- "${foundations[@]}" "${declarations[@]}" \
            > _nanoda_export.txt
          test -s _nanoda_export.txt
          echo "Exported $(wc -l < _nanoda_export.txt) lines"

          cat > _nanoda_config.json <<'EOF'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": [
              "propext",
              "Classical.choice",
              "Quot.sound",
              "Lean.trustCompiler"
            ],
            "unpermitted_axiom_hard_error": false,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          EOF

          RUST_BACKTRACE=1 \
            _nanoda_lib/target/release/nanoda_bin _nanoda_config.json
