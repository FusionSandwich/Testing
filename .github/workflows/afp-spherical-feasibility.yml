name: AFP spherical feasibility

on:
  push:
    branches:
      - agent/afp-spherical-feasibility-validation
      - agent/afp-pure-math-p0-m1
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run exact arithmetic regressions
        run: python3 afp_barrier_gate1/pure_math/tests/test_spherical_feasibility.py

      - name: Reject proof placeholders in stage modules
        shell: bash
        run: |
          files=(
            afp_barrier_gate1/AFPBarrier/LocalSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/SphericalFeasibilityAlgebra.lean
            afp_barrier_gate1/AFPBarrier/QuantitativeSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/GlobalSharedEdgeDuality.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx|axiom)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or user axiom found.' >&2
            exit 1
          fi

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Resolve dependencies and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake update
          lake exe cache get

      - name: Build Lean package explicitly
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake build

      - name: Independently type-check spherical stage roots with nanoda
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1

          cleanup() {
            rm -rf _lean4export _nanoda_lib
            rm -f _nanoda_export_*.txt _nanoda_config_*.json
          }
          trap cleanup EXIT
          cleanup

          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            source "$HOME/.cargo/env"
          fi

          # nanoda documents this format2024 exporter as its expected format.
          # Pin the exact exporter commit for reproducible kernel validation.
          git init _lean4export
          git -C _lean4export remote add origin \
            https://github.com/ammkrn/lean4export.git
          git -C _lean4export fetch --depth 1 origin \
            66be65dab1fcaabddde91a76e82e63beab180846
          git -C _lean4export checkout --detach FETCH_HEAD
          cp lean-toolchain _lean4export/
          (
            cd _lean4export
            lake build
          )

          git clone --depth 1 --branch debug \
            https://github.com/ammkrn/nanoda_lib.git _nanoda_lib
          (
            cd _nanoda_lib
            cargo build --release
          )

          modules=(
            AFPBarrier.QuantitativeSphericalFeasibility
            AFPBarrier.GlobalSharedEdgeDuality
          )

          for module in "${modules[@]}"; do
            safe_name="${module//./_}"
            export_file="_nanoda_export_${safe_name}.txt"
            config_file="_nanoda_config_${safe_name}.json"

            echo "Exporting ${module} for independent checking"
            lake env _lean4export/.lake/build/bin/lean4export "$module" \
              > "$export_file"
            test -s "$export_file"
            echo "Exported $(wc -l < "$export_file") lines for ${module}"

            cat > "$config_file" <<EOF
          {
            "export_file_path": "$export_file",
            "use_stdin": false,
            "permitted_axioms": [
              "propext",
              "Classical.choice",
              "Quot.sound",
              "Lean.trustCompiler"
            ],
            "unpermitted_axiom_hard_error": false,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          EOF

            RUST_BACKTRACE=1 \
              _nanoda_lib/target/release/nanoda_bin "$config_file"
          done
