name: AFP spherical feasibility

on:
  push:
    branches:
      - agent/afp-spherical-feasibility-validation
      - agent/afp-pure-math-p0-m1
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run exact arithmetic regressions
        run: python3 afp_barrier_gate1/pure_math/tests/test_spherical_feasibility.py

      - name: Reject proof placeholders in stage modules
        shell: bash
        run: |
          files=(
            afp_barrier_gate1/AFPBarrier/LocalSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/SphericalFeasibilityAlgebra.lean
            afp_barrier_gate1/AFPBarrier/QuantitativeSphericalFeasibility.lean
            afp_barrier_gate1/AFPBarrier/GlobalSharedEdgeDuality.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx|axiom)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Forbidden Lean placeholder or user axiom found.' >&2
            exit 1
          fi

      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          auto-config: false
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Resolve dependencies and obtain Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake update
          lake exe cache get

      - name: Build Lean package explicitly
        shell: bash
        run: |
          set -euo pipefail
          cd afp_barrier_gate1
          lake build

      - name: Independently type-check environment with nanoda
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          auto-config: false
          build: false
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
          use-mathlib-cache: false
          use-github-cache: false
