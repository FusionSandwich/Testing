name: AFP spherical feasibility

on:
  push:
    branches:
      - agent/afp-spherical-feasibility-validation
      - agent/afp-pure-math-p0-m1
      - agent/afp-pure-math-p2-closeout-corrected
      - agent/afp-pure-math-p4-sharp-barriers-extremal-synthesis
      - 'agent/afp-pure-math-p3-p4-final-acceptance*'
  pull_request:
    branches:
      - agent/afp-pure-math-p0-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out literal event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up deterministic Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: afp_barrier_gate1
          build: false
          test: false
          lint: false
          nanoda: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Run retained compatibility and complete Prompt 1-4 exact-head gate
        id: gate
        env:
          GATE_NAME: afp-spherical-feasibility
        run: env GITHUB_SHA='${{ github.event.pull_request.head.sha || github.sha }}' bash afp_barrier_gate1/pure_math/final_acceptance_gate.sh
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afp-spherical-feasibility-${{ github.run_id }}
          path: ${{ steps.gate.outputs.evidence_dir }}
          if-no-files-found: error
